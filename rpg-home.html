<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공명 연대기 · 게임 선택</title>
<link rel="icon" href="rpg-icon-192.png">
<meta property="og:title" content="공명 연대기">
<meta property="og:image" content="https://ykim99281-debug.github.io/-/rpg-art-og.jpg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 16px;background:radial-gradient(900px 500px at 20% -10%,rgba(124,58,237,.35),transparent 60%),radial-gradient(800px 500px at 90% 110%,rgba(14,116,144,.3),transparent 60%),#07070d;color:#f1f1f6;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto}h1{text-align:center;font-size:30px;margin:6px 0 4px;background:linear-gradient(90deg,#fff,#c4b5fd 55%,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#b9b6cf;margin:0 0 22px}
.card{display:block;text-decoration:none;color:inherit;margin:16px 0;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(196,181,253,.28);box-shadow:0 12px 36px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.card:hover,.card:active{transform:translateY(-3px);box-shadow:0 16px 44px rgba(124,58,237,.4)}
.card img{display:block;width:100%;height:170px;object-fit:cover;object-position:center 30%}
.card .t{padding:16px 18px 18px}.card h2{margin:0 0 6px;font-size:22px}.card p{margin:0 0 10px;color:#d1d5db;line-height:1.6;font-size:14px;word-break:keep-all}
.go{display:inline-block;padding:11px 22px;border-radius:999px;font-weight:900;color:#fff}
.a .go{background:linear-gradient(180deg,#7c3aed,#4c1d95)}.b .go{background:linear-gradient(180deg,#f59e0b,#b45309)}
.tag{display:inline-block;margin:0 6px 8px 0;padding:2px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.12)}
small{display:block;text-align:center;color:#8b8aa5;margin-top:22px}a.l{color:#93c5fd}
</style>
</head>
<body>
<main>
  <h1>공명 연대기</h1>
  <p class="sub">하고 싶은 이야기를 골라요</p>

  <a class="card a" href="rpg.html">
    <img src="rpg-art-hero.jpg" alt="별빛 공명 연대기">
    <div class="t">
      <span class="tag">액션 RPG</span><span class="tag">이야기 14장</span>
      <h2>별빛 공명 연대기</h2>
      <p>꺼진 별을 다시 켜는 공명의 여정. 30명의 영웅과 함께 공허군에 맞서요.</p>
      <span class="go">▶ 시작하기</span>
    </div>
  </a>

  <a class="card b" href="hagil.html">
    <img src="rpg-art-hero.jpg" alt="하길 공명 연대기" style="filter:hue-rotate(-35deg) saturate(1.15) brightness(1.05)">
    <div class="t">
      <span class="tag">액션 RPG</span><span class="tag">성경 인물 30명</span><span class="tag">성경·교회 퀴즈</span><span class="tag">랭킹</span>
      <h2>하길 공명 연대기</h2>
      <p>성경 속 인물과 장소로 만든 모험. 다윗, 모세, 엘리야와 천사들이 어둠에 맞서요. 몬스터를 쓰러뜨리면 성경 퀴즈가 나오고, 맞히면 상자 세 개 중 하나를 골라요.</p>
      <span class="go">▶ 시작하기</span>
    </div>
  </a>

  <small>두 게임은 계정과 점수가 따로예요 · <a class="l" href="rpg-terms.html">이용약관</a> · <a class="l" href="rpg-privacy.html">개인정보처리방침</a></small>
</main>
</body>
</html>
