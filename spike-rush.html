<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SPIKE RUSH - 5v5 택티컬 슈터</title>
<meta name="theme-color" content="#0f1923">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff4655;--bg:#0f1923;--bg2:#1b2733;--cream:#ece8e1;--teal:#3cffd0;--gold:#ffcc33;--ally:#3cffd0;--foe:#ff4655}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05080c;color:var(--cream);font-family:"Rajdhani","Noto Sans KR","Segoe UI",sans-serif;font-weight:600}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;font-weight:700;color:inherit;cursor:pointer;border:0}
/* ---------- buttons ---------- */
.btn{position:relative;background:var(--bg2);border:1px solid rgba(236,232,225,.25);padding:11px 22px;font-size:18px;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:.15s}
.btn:hover{background:#2a3a4a;border-color:var(--cream)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-size:24px;padding:14px 34px}
.btn.pri:hover{background:#ff6a76;transform:translateX(4px)}
.btn.sm{padding:7px 14px;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg div{padding:7px 16px;background:rgba(236,232,225,.08);border:1px solid rgba(236,232,225,.2);cursor:pointer;font-size:16px;letter-spacing:1px;transition:.12s}
.seg div:hover{background:rgba(236,232,225,.18)}
.seg div.on{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.lbl{font-size:13px;letter-spacing:3px;color:#8b97a6;margin:16px 0 6px}
/* ---------- menu ---------- */
#home{position:fixed;inset:0;z-index:30;display:flex;background:linear-gradient(90deg,rgba(8,12,18,.94) 0,rgba(8,12,18,.78) 42%,rgba(8,12,18,.3) 100%);overflow:auto}
#home:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.025) 46px 48px);pointer-events:none}
#home .left{position:relative;width:min(520px,100%);padding:max(28px,5vh) 5vw;display:flex;flex-direction:column;gap:6px;z-index:2}
.logo{font-size:clamp(46px,9vh,84px);line-height:.88;font-weight:700;letter-spacing:4px;color:var(--cream)}
.logo b{color:var(--red);display:block;letter-spacing:8px}
.tag{letter-spacing:6px;font-size:14px;color:#8b97a6;margin:8px 0 12px}
.menu-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#home .right{position:relative;flex:1;z-index:1;display:flex;align-items:center;justify-content:center;min-width:0}
#agentCards{display:flex;gap:14px;padding:20px;flex-wrap:wrap;justify-content:center}
.acard{width:150px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(236,232,225,.18);padding:14px 12px 12px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.acard:hover{transform:translateY(-4px);border-color:var(--ac)}
.acard.on{border-color:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 28%,transparent),rgba(255,255,255,.03));box-shadow:0 0 28px color-mix(in srgb,var(--ac) 40%,transparent)}
.acard svg{width:100%;height:130px;display:block}
.acard h3{font-size:24px;letter-spacing:3px;color:var(--ac);margin-top:4px}
.acard small{display:block;color:#9aa6b4;letter-spacing:2px;font-size:12px;margin-bottom:8px}
.acard ul{list-style:none;font-size:12.5px;line-height:1.55;color:#cfd6de;font-weight:500}
.acard li b{display:inline-block;width:18px;color:var(--ac)}
#lastCard{position:absolute;right:20px;bottom:16px;font-size:13px;color:#8b97a6;letter-spacing:1px;text-align:right}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,30,.55) 100%);opacity:0;transition:opacity .25s}
#flashfx{position:absolute;inset:0;background:#fff;opacity:0}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 30vh,#000 30.4vh)}
#scope:before,#scope:after{content:"";position:absolute;background:#000}
#scope:before{left:0;right:0;top:50%;height:2px}#scope:after{top:0;bottom:0;left:50%;width:2px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:var(--xc,#3cffd0);box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#hitm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .12s}
#hitm i{position:absolute;width:11px;height:3px;background:#fff;box-shadow:0 0 3px #000}
#hitm i:nth-child(1){transform:translate(-20px,-12px) rotate(45deg)}#hitm i:nth-child(2){transform:translate(9px,-12px) rotate(-45deg)}
#hitm i:nth-child(3){transform:translate(-20px,9px) rotate(-45deg)}#hitm i:nth-child(4){transform:translate(9px,9px) rotate(45deg)}
#hitm.head i{background:var(--red)}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0}
#dmgdir div{position:absolute;left:-90px;top:-180px;width:180px;height:60px;border-top:7px solid var(--red);border-radius:50%;opacity:0;transform-origin:90px 180px;filter:drop-shadow(0 0 6px var(--red))}
#hudTop{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(15,25,35,.85),rgba(15,25,35,.35));border-bottom:2px solid rgba(236,232,225,.25);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%)}
.tm{display:flex;gap:4px;align-items:center;padding:0 20px;min-width:120px}
.tm i{width:11px;height:20px;background:var(--c);transform:skewX(-14deg);opacity:1;transition:.2s}
.tm i.dead{opacity:.18}
#tmA{--c:var(--ally);justify-content:flex-end}#tmB{--c:var(--foe)}
.sc{font-size:34px;font-weight:700;padding:2px 16px;min-width:56px;text-align:center}
#scA{color:var(--ally);background:rgba(60,255,208,.08)}#scB{color:var(--foe);background:rgba(255,70,85,.08)}
#timer{width:96px;text-align:center;line-height:1}
#timer b{display:block;font-size:30px;margin-top:3px}#timer.warn b{color:var(--red)}
#timer span{font-size:11px;letter-spacing:3px;color:#9aa6b4}
#spikeInd{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:3px;color:var(--red);text-shadow:0 0 8px #000;display:none}
#mini{position:absolute;left:12px;top:12px;width:200px;height:200px;border:2px solid rgba(236,232,225,.3);background:rgba(8,14,20,.7);border-radius:4px}
#feed{position:absolute;right:12px;top:12px;width:340px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fk{background:rgba(15,25,35,.82);padding:4px 12px;font-size:16px;display:flex;gap:9px;align-items:center;border-right:3px solid var(--foe);animation:fk 5s forwards;white-space:nowrap}
.fk.me{border:2px solid var(--red);border-right-width:3px;background:rgba(80,20,30,.8)}
.fk .a{color:var(--ally)}.fk .e{color:var(--foe)}.fk .w{color:#9aa6b4;font-size:13px}.fk .hs{color:var(--gold)}
@keyframes fk{0%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30px)}}
#banner{position:absolute;left:0;right:0;top:19%;text-align:center;opacity:0;transition:opacity .3s}
#banner h1{font-size:clamp(34px,7vw,68px);letter-spacing:10px;font-weight:700;text-shadow:0 0 30px rgba(0,0,0,.8)}
#banner p{font-size:20px;letter-spacing:4px;color:#cfd6de;margin-top:4px}
#banner.win h1{color:var(--teal)}#banner.lose h1{color:var(--red)}
#prog{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:280px;text-align:center;display:none}
#prog span{font-size:18px;letter-spacing:4px;text-shadow:0 0 6px #000}
#prog .bar{height:8px;background:rgba(0,0,0,.6);margin-top:6px;border:1px solid rgba(255,255,255,.4)}#prog .bar b{display:block;height:100%;width:0;background:var(--gold)}
#hint{position:absolute;left:50%;top:70%;transform:translateX(-50%);font-size:17px;letter-spacing:3px;text-shadow:0 0 6px #000;color:var(--gold);display:none}
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:16px}
#hpbox{background:rgba(15,25,35,.78);border-left:4px solid var(--teal);padding:6px 16px 8px;min-width:180px}
#hpbox small{font-size:12px;letter-spacing:3px;color:#9aa6b4;display:flex;justify-content:space-between}
#hpn{font-size:46px;line-height:1;font-weight:700}#arn{color:#7ec8ff;font-size:24px;margin-left:12px}
#hpbar{height:5px;background:#2b3744;margin-top:4px}#hpbar b{display:block;height:100%;background:var(--teal);width:100%;transition:width .12s}
#abil{display:flex;gap:8px;align-items:flex-end}
.ab{position:relative;width:62px;height:62px;background:rgba(15,25,35,.8);border:2px solid rgba(236,232,225,.3);text-align:center;font-size:11px;letter-spacing:1px;padding-top:4px;transition:.12s}
.ab b{display:block;font-size:22px;line-height:1.25;font-weight:400}.ab span{display:block;font-size:9px;letter-spacing:0;white-space:nowrap;overflow:hidden;color:#b8c2cf;margin-top:-1px}
.ab i{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid rgba(236,232,225,.4);font-style:normal;font-size:13px;padding:0 6px}
.ab em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:16px;color:var(--gold)}
.ab.sel{border-color:var(--gold);background:rgba(255,204,51,.2);transform:translateY(-6px)}.ab.no{opacity:.38}
.ab.ult{width:70px}.ab.ult.rdy{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 18px var(--gold)}}
#ultpips{display:flex;gap:2px;justify-content:center;margin-top:3px}#ultpips u{width:7px;height:7px;background:#2b3744;transform:rotate(45deg);text-decoration:none}#ultpips u.on{background:var(--gold)}
#ammoBox{position:absolute;right:16px;bottom:16px;background:rgba(15,25,35,.78);border-right:4px solid var(--red);padding:6px 16px 8px;text-align:right;min-width:190px}
#wname{font-size:13px;letter-spacing:3px;color:#9aa6b4}#amn{font-size:48px;line-height:1;font-weight:700}#amn s{text-decoration:none;font-size:24px;color:#8b97a6}
#credits{position:absolute;left:16px;bottom:16px;font-size:20px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 6px #000}
#spec{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:20px;letter-spacing:4px;text-shadow:0 0 6px #000;display:none}
#reloadT{position:absolute;left:50%;top:56%;transform:translateX(-50%);font-size:16px;letter-spacing:4px;display:none;text-shadow:0 0 6px #000}
#nametip{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:14px;color:var(--ally);display:none}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(5,9,14,.82);backdrop-filter:blur(4px)}
.ov.on{display:flex}
.box{background:linear-gradient(180deg,#16212d,#0f1923);border:1px solid rgba(236,232,225,.22);padding:24px 30px;max-width:min(94vw,640px);max-height:92vh;overflow:auto;position:relative}
.box h2{letter-spacing:6px;font-size:26px;margin-bottom:12px;color:var(--red)}
.box label{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0;font-size:16px;letter-spacing:1px}
.box input[type=range]{accent-color:var(--red);width:200px}
.box p,.box li{font-size:14.5px;line-height:1.7;color:#cfd6de;font-weight:500}
.box li{margin-left:18px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:15px;font-weight:500}.keys kbd{background:#2a3a4a;border:1px solid #556;padding:1px 8px;font-family:inherit;font-weight:700;color:var(--cream);text-align:center;border-radius:3px}
.sw{display:inline-block;width:26px;height:26px;border:3px solid transparent;cursor:pointer;margin-left:6px}.sw.on{border-color:#fff}
#buy{background:rgba(5,9,14,.74)}
#buyBox{width:min(96vw,1020px);padding:16px 22px;max-width:none;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
#buyGrid{overflow:auto;min-height:0;flex:1;padding-right:4px}
#buyHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;letter-spacing:4px}
#buyHead b{color:var(--gold);font-size:26px;letter-spacing:2px}
#buyGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bsec{grid-column:1/-1;font-size:13px;letter-spacing:4px;color:#8b97a6;margin-top:6px;border-bottom:1px solid rgba(236,232,225,.15)}
.bi{background:rgba(236,232,225,.07);border:1px solid rgba(236,232,225,.22);padding:8px 10px;cursor:pointer;transition:.1s;position:relative}
.bi:hover{background:rgba(236,232,225,.16);border-color:var(--cream)}
.bi.own{border-color:var(--teal);background:rgba(60,255,208,.12)}.bi.dis{opacity:.4}
.bi h4{font-size:16px;letter-spacing:1px}.bi small{font-size:12px;color:#9aa6b4;display:block;font-weight:500}.bi b{position:absolute;right:8px;top:7px;color:var(--gold);font-size:15px}
#sb table{border-collapse:collapse;width:min(94vw,720px);font-size:16px}
#sb th{font-size:12px;letter-spacing:2px;color:#8b97a6;text-align:right;padding:4px 10px;font-weight:600}#sb th:first-child,#sb td:first-child{text-align:left}
#sb td{padding:5px 10px;text-align:right;border-bottom:1px solid rgba(236,232,225,.08)}
#sb tr.me td{background:rgba(255,255,255,.1)}#sb tr.dead td{opacity:.45}
#sb .t0{color:var(--ally)}#sb .t1{color:var(--foe)}
#sb2 th{font-size:12px;letter-spacing:2px;color:#8b97a6;font-weight:600;padding:4px 10px}#sb2 td{padding:5px 10px;text-align:center;border-bottom:1px solid rgba(236,232,225,.08)}#sb2 td:first-child,#sb2 th:first-child{text-align:left}#sb2 tr.me td{background:rgba(255,255,255,.1)}#sb2 .t0{color:var(--ally)}#sb2 .t1{color:var(--foe)}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
body.touch #touch{display:block}
#touch>*{position:absolute;pointer-events:auto;touch-action:none}
#lookpad{right:0;top:0;width:55%;height:78%}
#joy{left:3vw;bottom:5vh;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.3)}
.tb{width:58px;height:58px;border-radius:50%;background:rgba(15,25,35,.6);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:1px}
.tb:active,.tb.dn{background:rgba(255,70,85,.55)}
#tFire{right:18vw;bottom:14vh;width:84px;height:84px;font-size:17px;background:rgba(255,70,85,.4)}
#tJump{right:5vw;bottom:24vh}#tRel{right:5vw;bottom:5vh}#tAds{right:30vw;bottom:5vh}
#tC{left:20vw;bottom:48vh;width:46px;height:46px}#tQ{left:20vw;bottom:36vh;width:46px;height:46px}#tE{left:20vw;bottom:24vh;width:46px;height:46px}#tX{left:26vw;bottom:42vh;width:46px;height:46px}
#tUse{right:19vw;bottom:36vh;width:64px;height:64px}#tBuy{left:2vw;top:230px;width:48px;height:48px}#tPause{right:3vw;top:10px;width:42px;height:42px}#tSwap{right:5vw;bottom:42vh;width:46px;height:46px}#tCr{right:12vw;bottom:5vh;width:46px;height:46px}
body.touch #mini{width:120px;height:120px}body.touch #feed{top:60px;width:250px}
body.touch #hpbox{min-width:120px;padding:3px 10px}body.touch #hpn{font-size:30px}body.touch #ammoBox{bottom:auto;top:8px;right:60px;min-width:110px;padding:2px 10px}body.touch #amn{font-size:28px}
body.touch #abil{display:none}body.touch #credits{bottom:auto;top:130px;left:12px;font-size:15px}
@media (max-width:760px){#home .right{display:none}#hudTop .tm{min-width:70px;padding:0 8px}.sc{font-size:26px;padding:2px 8px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="vig"></div><div id="flashfx"></div><div id="scope"></div>
  <div id="dmgdir"></div>
  <div id="cross"></div>
  <div id="hitm"><i></i><i></i><i></i><i></i></div>
  <div id="hudTop"><div class="tm" id="tmA"></div><div class="sc" id="scA">0</div><div id="timer"><b id="tt">1:40</b><span id="phaseLbl">공격</span></div><div class="sc" id="scB">0</div><div class="tm" id="tmB"></div></div>
  <div id="spikeInd">● 스파이크 설치됨</div>
  <canvas id="mini" width="400" height="400"></canvas>
  <div id="feed"></div>
  <div id="banner"><h1></h1><p></p></div>
  <div id="prog"><span id="progL"></span><div class="bar"><b></b></div></div>
  <div id="hint"></div>
  <div id="reloadT">재장전 중...</div>
  <div id="spec"></div>
  <div id="credits"></div>
  <div id="bottom">
    <div id="hpbox"><small><span>HEALTH</span><span id="arn"></span></small><span id="hpn">100</span><div id="hpbar"><b></b></div></div>
    <div id="abil"></div>
  </div>
  <div id="ammoBox"><div id="wname">K9</div><div id="amn">12<s> / 36</s></div></div>
</div>

<div id="touch">
  <div id="lookpad"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="tFire">발사</div><div class="tb" id="tJump">점프</div><div class="tb" id="tRel">장전</div><div class="tb" id="tAds">조준</div>
  <div class="tb" id="tC">C</div><div class="tb" id="tQ">Q</div><div class="tb" id="tE">E</div><div class="tb" id="tX">X</div>
  <div class="tb" id="tUse">F</div><div class="tb" id="tBuy">구매</div><div class="tb" id="tPause">Ⅱ</div><div class="tb" id="tSwap">교체</div><div class="tb" id="tCr">앉기</div>
</div>

<div id="home">
  <div class="left">
    <div class="logo">SPIKE<b>RUSH</b></div>
    <div class="tag">5 v 5 TACTICAL SHOOTER</div>
    <button class="btn pri" id="mPlay">▶ 매치 시작</button>
    <div class="lbl">난이도</div>
    <div class="seg" id="diffSeg"><div data-v="0">쉬움</div><div data-v="1">보통</div><div data-v="2">어려움</div></div>
    <div class="lbl">경기 길이</div>
    <div class="seg" id="lenSeg"><div data-v="0">단판 (4승, 7라운드)</div><div data-v="1">정규 (7승, 13라운드)</div></div>
    <div class="menu-row"><button class="btn sm" id="mSet">설정</button><button class="btn sm" id="mHelp">조작법</button><button class="btn sm" id="mBack">← 월드로</button></div>
  </div>
  <div class="right"><div id="agentCards"></div></div>
  <div id="lastCard"></div>
</div>

<div class="ov" id="pause"><div class="box"><h2>일시정지</h2><div style="display:flex;flex-direction:column;gap:10px"><button class="btn pri" id="pResume">계속하기</button><button class="btn" id="pSet">설정</button><button class="btn" id="pHelp">조작법</button><button class="btn" id="pHome">매치 포기하고 나가기</button></div></div></div>
<div class="ov" id="buy"><div class="box" id="buyBox"><div id="buyHead"><span>구매 단계 · <span id="buyT">20</span>초</span><b id="buyCr">$800</b></div><div id="buyGrid"></div><div style="margin-top:12px;display:flex;gap:10px;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#8b97a6;letter-spacing:1px">B 키로 열고 닫기 · 클릭하면 구매</span><button class="btn pri sm" id="buyGo">준비 완료</button></div></div></div>

/* ======================= AUDIO (WebAudio 합성) ======================= */
const AU=(()=>{

    if(ctx.createStereoPanner){const pn=ctx.createStereoPanner();pn.pan.value=d<.6?0:clamp((dx*Math.cos(L.yaw)-dz*Math.sin(L.yaw))/d,-1,1)*.85;tail.connect(pn);pn.connect(master)}else tail.connect(master);

    reload(p){if(!ctx)return;const o=dest(p),t=ctx.currentTime;tn(o,t,.05,.3,'square',500,300);tn(o,t+.55,.06,.4,'square',700,350);nz(o,t+.55,.05,.3,'highpass',2500,2500)},

/* ======================= MAP ======================= */
const CS=2,GW=36,GH=36,OFF=36;

  atkRect:{r0:29,c0:8,r1:34,c1:27},defRect:{r0:1,c0:13,r1:5,c1:22}};

  R(1,13,5,22);R(3,9,5,12);R(3,23,5,26);          // 수비 기지 + 통로
  R(2,2,10,9);R(2,26,10,33);                      // A / B 사이트
  R(6,15,7,20);R(6,16,28,19);                     // 미드
  R(11,3,28,6);R(11,29,28,32);                    // 양쪽 레인
  R(13,7,15,15);R(19,20,21,28);                   // 숏 연결로

  // 엄폐물
  [[4,4,'X'],[4,5,'X'],[7,3,'x'],[7,4,'x'],[8,7,'x'],[6,8,'X'],[9,5,'x']].forEach(([r,c,h])=>GR[r][c]=h);
  [[5,29,'X'],[5,30,'X'],[8,31,'x'],[8,32,'x'],[4,27,'x'],[7,27,'X'],[9,29,'x']].forEach(([r,c,h])=>GR[r][c]=h);

   [10,17,'x'],[10,18,'x'],[17,17,'X'],[22,18,'x'],[25,16,'x'],[12,19,'x'],[31,12,'x'],[31,23,'x'],[33,9,'X'],[33,26,'X'],[3,17,'X'],[3,19,'X']].forEach(([r,c,h])=>GR[r][c]=h);
  HM=GR.map(row=>row.map(ch=>({'#':6,'X':2.6,'x':1.2,'p':.4}[ch]||0)));

buildMap();
const hAt=(c,r)=>(c<0||r<0||c>=GW||r>=GH)?9:HM[r][c];
const inRect=(x,z,R,pad)=>{const p=pad||0;return x>=R.c0*CS-OFF-p&&x<=(R.c1+1)*CS-OFF+p&&z>=R.r0*CS-OFF-p&&z<=(R.r1+1)*CS-OFF+p};
const siteOf=(x,z)=>inRect(x,z,ZONES.A)?'A':inRect(x,z,ZONES.B)?'B':null;
const siteCenter=s=>{const R=ZONES[s];return{x:((R.c0+R.c1+1)/2)*CS-OFF,z:((R.r0+R.r1+1)/2)*CS-OFF}};
const walk=(c,r)=>hAt(c,r)<=.45;
function clearAt(x,z,rad){const c0=cellOf(x-rad),c1=cellOf(x+rad),r0=cellOf(z-rad),r1=cellOf(z+rad);for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(!walk(c,r))return false;return true}
function nearestWalk(c,r){if(walk(c,r))return[c,r];for(let d=1;d<8;d++)for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++)if(Math.max(Math.abs(dr),Math.abs(dc))===d&&walk(c+dc,r+dr))return[c+dc,r+dr];return[c,r]}

/* 그리드 레이캐스트: 높이 있는 셀(벽·상자)과 바닥 */
function rayGrid(ox,oy,oz,dx,dy,dz,maxT){
  let best=maxT,nrm=null;
  if(dy<0){const t=-oy/dy;if(t>=0&&t<best){best=t;nrm=[0,1,0]}}
  let c=cellOf(ox),r=cellOf(oz);
  const sx=dx>0?1:-1,sz=dz>0?1:-1;
  const tDx=dx!==0?Math.abs(CS/dx):1e9,tDz=dz!==0?Math.abs(CS/dz):1e9;
  let nx=dx>0?((c+1)*CS-OFF-ox)/dx:dx<0?((c*CS-OFF)-ox)/dx:1e9;
  let nzz=dz>0?((r+1)*CS-OFF-oz)/dz:dz<0?((r*CS-OFF)-oz)/dz:1e9;
  let tE=0,side=0;
  for(let i=0;i<90;i++){
    if(tE>=best)break;
    const h=hAt(c,r),tX=Math.min(nx,nzz);
    if(h>0){
      const yE=oy+dy*tE,yX=oy+dy*Math.min(tX,best);
      if(yE<h){best=tE;nrm=i===0?[0,1,0]:side===0?[-sx,0,0]:[0,0,-sz];break}
      else if(yX<h&&dy<0){const t=(h-oy)/dy;if(t<best){best=t;nrm=[0,1,0]}break}
    }
    if(tX>=best)break;
    if(nx<nzz){c+=sx;tE=nx;nx+=tDx;side=0}else{r+=sz;tE=nzz;nzz+=tDz;side=1}
  }
  return best<maxT?{t:best,n:nrm}:null;
}
function losClear(x0,y0,z0,x1,y1,z1){const dx=x1-x0,dy=y1-y0,dz=z1-z0,d=Math.hypot(dx,dy,dz);if(d<.01)return true;return!rayGrid(x0,y0,z0,dx/d,dy/d,dz/d,d-.05)}

/* A* 경로탐색 (그리드) */
function findPath(x0,z0,x1,z1){
  const sc=cellOf(x0),sr=cellOf(z0);const[gc,gr]=nearestWalk(cellOf(x1),cellOf(z1));
  const[s0c,s0r]=nearestWalk(sc,sr);
  const N=GW*GH,g=new Float32Array(N).fill(1e9),came=new Int16Array(N).fill(-1),closed=new Uint8Array(N);
  const heap=[];const push=(f,i)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){let l=2*k+1,r=l+1,m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};
  const si=s0r*GW+s0c,gi=gr*GW+gc;g[si]=0;push(0,si);
  const near=(c,r)=>!walk(c+1,r)||!walk(c-1,r)||!walk(c,r+1)||!walk(c,r-1);
  while(heap.length){
    const[,i]=pop();if(closed[i])continue;closed[i]=1;if(i===gi)break;
    const c=i%GW,r=(i/GW)|0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;const nc=c+dc,nr=r+dr;if(!walk(nc,nr))continue;
      if(dr&&dc&&(!walk(c+dc,r)||!walk(c,r+dr)))continue;
      const ni=nr*GW+nc,cost=g[i]+(dr&&dc?1.414:1)+(near(nc,nr)?.5:0);
      if(cost<g[ni]){g[ni]=cost;came[ni]=i;push(cost+Math.hypot(gc-nc,gr-nr),ni)}
    }
  }
  if(came[gi]<0&&gi!==si)return[{x:wx(gc),z:wx(gr)}];
  const cells=[];for(let i=gi;i>=0;i=came[i]){cells.push({x:wx(i%GW),z:wx((i/GW)|0)});if(i===si)break}
  cells.reverse();cells[0]={x:x0,z:z0};
  // 경로 단순화
  const out=[];let a=0;
  const lineOK=(p,q)=>{const d=Math.hypot(q.x-p.x,q.z-p.z),n=Math.ceil(d/.5);for(let k=1;k<=n;k++){const t=k/n;if(!clearAt(p.x+(q.x-p.x)*t,p.z+(q.z-p.z)*t,.55))return false}return true};
  while(a<cells.length-1){let b=cells.length-1;while(b>a+1&&!lineOK(cells[a],cells[b]))b--;out.push(cells[b]);a=b}
  return out;
}

      fragmentShader:'varying vec4 vc;void main(){float d=length(gl_PointCoord-.5)*2.;gl_FragColor=vec4(vc.rgb,vc.a*smoothstep(1.,.15,d));}'});

  };

    this.p[k]=x;this.p[k+1]=y;this.p[k+2]=z;this.v[k]=vx;this.v[k+1]=vy;this.v[k+2]=vz;this.life[i]=life;this.max[i]=life;this.s0[i]=size;this.s[i]=size;this.g[i]=grav||0;this.grow[i]=grow||0;
    this.c0[q]=r;this.c0[q+1]=g;this.c0[q+2]=b;this.c0[q+3]=a;this.c[q]=r;this.c[q+1]=g;this.c[q+2]=b;this.c[q+3]=a};

const RAD=.38,STEP=.46,RUN=5.4;
function canStand(x,z,y){const c0=cellOf(x-RAD),c1=cellOf(x+RAD),r0=cellOf(z-RAD),r1=cellOf(z+RAD);for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(hAt(c,r)>y+STEP)return false;return true}
function groundH(x,z,y){const c0=cellOf(x-RAD*.8),c1=cellOf(x+RAD*.8),r0=cellOf(z-RAD*.8),r1=cellOf(z+RAD*.8);let g=0;for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const h=hAt(c,r);if(h<=y+STEP&&h>g)g=h}return g}
function moveActor(a,wx_,wz_,spd,dt){
  const ac=a.onGround?(wx_||wz_?58:78):4;
  let tx=wx_*spd,tz=wz_*spd;
  if(a.slow>0)tx*=.6,tz*=.6;
  a.vx+=(tx-a.vx)*Math.min(1,ac*dt);a.vz+=(tz-a.vz)*Math.min(1,ac*dt);
  if(a.dashT>0){a.vx=a.dashDir[0]*23;a.vz=a.dashDir[1]*23;a.dashT-=dt}
  const sub=Math.ceil(Math.hypot(a.vx,a.vz)*dt/.3)||1,sdt=dt/sub;
  for(let i=0;i<sub;i++){
    const nx=a.x+a.vx*sdt;if(canStand(nx,a.z,a.y))a.x=nx;else a.vx=0;
    const nz=a.z+a.vz*sdt;if(canStand(a.x,nz,a.y))a.z=nz;else a.vz=0;
  }
  if(G.phase==='buy'){const R=isAtk(a)?SPAWN.atkRect:SPAWN.defRect;a.x=clamp(a.x,R.c0*CS-OFF+.5,(R.c1+1)*CS-OFF-.5);a.z=clamp(a.z,R.r0*CS-OFF+.5,(R.r1+1)*CS-OFF-.5)}
  a.vy-=22*dt;a.y+=a.vy*dt;const gh=groundH(a.x,a.z,a.y);
  if(a.y<=gh){if(a.vy<-6&&a.isP)AU.step(null,1.2);a.y=gh;a.vy=0;a.onGround=true}else a.onGround=false;
  a.spd=Math.hypot(a.vx,a.vz);
}
function separate(){const A=G.actors.filter(a=>a.alive);for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){const a=A[i],b=A[j];if(Math.abs(a.y-b.y)>1.2)continue;const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<.66&&d>.001){const p=(.66-d)*.5,nx=dx/d*p,nz=dz/d*p;if(canStand(a.x-nx,a.z-nz,a.y)){a.x-=nx;a.z-=nz}if(canStand(b.x+nx,b.z+nz,b.y)){b.x+=nx;b.z+=nz}}}}

  if(!a.alive)return;a.stepD+=a.spd*dt;
  if(a.stepD>2.1){a.stepD=0;if(a.onGround&&a.spd>3.2&&!a.walking&&a.crouchT<.5){if(a.isP)AU.step(null,.4);else AU.step({x:a.x,z:a.z},1);makeNoise(a.x,a.z,16,a.team,false)}}
}

function smokeBlocks(x0,y0,z0,x1,y1,z1){
  for(const zn of G.zones){if(zn.type!=='smoke'||zn.age<.6||zn.t<1)continue;
    const cx=zn.x,cy=zn.y,cz=zn.z,dx=x1-x0,dy=y1-y0,dz=z1-z0,L2=dx*dx+dy*dy+dz*dz;let t=((cx-x0)*dx+(cy-y0)*dy+(cz-z0)*dz)/L2;t=clamp(t,0,1);
    const px=x0+dx*t-cx,py=y0+dy*t-cy,pz=z0+dz*t-cz;if(px*px+py*py+pz*pz<zn.r*zn.r*.72)return true}

function canSee(a,b,fovDeg){
  const [ex,ey,ez]=eyeOf(a);const tx=b.x,tz=b.z,dx=tx-ex,dz=tz-ez,d=Math.hypot(dx,dz);
  if(fovDeg&&d>2.5){const ang=Math.abs(angDiff(a.yaw,Math.atan2(-dx,-dz)));if(ang>fovDeg*D2R*.5)return 0}

function rayActor(ox,oy,oz,dx,dy,dz,a,maxT){
  // 머리(구) → 몸통(원기둥)
  const hy=a.y+eyeH(a)-.04,hr=.22;let best=null;
  {const lx=ox-a.x,ly=oy-hy,lz=oz-a.z,b=lx*dx+ly*dy+lz*dz,c=lx*lx+ly*ly+lz*lz-hr*hr,disc=b*b-c;if(disc>=0){const t=-b-Math.sqrt(disc);if(t>0&&t<maxT)best={t,part:0}}}
  const top=hy-.18,bot=a.y;{const lx=ox-a.x,lz=oz-a.z,A=dx*dx+dz*dz;if(A>1e-6){const B=lx*dx+lz*dz,C=lx*lx+lz*lz-.34*.34,disc=B*B-A*C;if(disc>=0){const t=(-B-Math.sqrt(disc))/A;if(t>0&&t<maxT&&(!best||t<best.t)){const y=oy+dy*t;if(y>=bot&&y<=top)best={t,part:y<a.y+.78?2:1}}}}}
  return best;
}
function fallMul(w,d){const f=w.fall;if(d<=f[0][0])return f[0][1];for(let i=1;i<f.length;i++)if(d<=f[i][0]){const t=(d-f[i-1][0])/(f[i][0]-f[i-1][0]);return lerp(f[i-1][1],f[i][1],t)}return f[f.length-1][1]}
function aimDir(a){return fwd(a.yaw+a.kickY*D2R,a.pitch+a.kickP*D2R)}
function curSpread(a,w){
  let s=w.sp[0];const mov=clamp(a.spd/RUN,0,1.3);
  s+=w.sp[1]*mov*(a.walking?.25:1)*(a.crouchT>.5?.7:1);
  if(!a.onGround)s+=3.2;if(a.crouchT>.5)s*=.78;
  s+=Math.min(a.ws.shot*w.sp[2],w.sp[3]||0);
  if(w.unsc&&!(a.isP?scopeLvl>0:false)&&!(!a.isP&&a.ai&&a.ai.scoped))s+=w.unsc;
  if(a.isP&&scopeLvl>0)s*=.5;
  return s;
}
function fireWeapon(a){
  const w=curW(a),id=curId(a),am=a.ammo[id],now=G.t;
  a.ws.next=now+1/(w.rate*(a.rampT>0?1.3:1));
  if(a.rampT<=0)am.mag--;
  const[ox,oy,oz]=eyeOf(a);const f=aimDir(a);
  const rx=Math.cos(a.yaw),rz=-Math.sin(a.yaw);
  const ux=-rz*f[1],uy=rz*f[0]-rx*f[2],uz=rx*f[1];
  const spread=curSpread(a,w);
  const n=w.pel||1;let anyHit=0,anyHead=0;
  const muz=a.isP?[ox+rx*.2+f[0]*.9,oy-.14+f[1]*.9,oz+rz*.2+f[2]*.9]:[ox+rx*.25+f[0]*.6,oy-.3+f[1]*.6,oz+rz*.25+f[2]*.6];
  for(let p=0;p<n;p++){
    const th=rnd(0,TAU),rr=Math.tan(spread*D2R*Math.sqrt(Math.random()));
    let dx=f[0]+rr*(Math.cos(th)*rx+Math.sin(th)*ux),dy=f[1]+rr*Math.sin(th)*uy,dz=f[2]+rr*(Math.cos(th)*rz+Math.sin(th)*uz);
    const L=Math.hypot(dx,dy,dz);dx/=L;dy/=L;dz/=L;
    const mh=rayGrid(ox,oy,oz,dx,dy,dz,180);const maxT=mh?mh.t:180;
    let hit=null,hv=null;
    for(const e of G.actors){if(!e.alive||e.team===a.team)continue;const r=rayActor(ox,oy,oz,dx,dy,dz,e,maxT);if(r&&(!hit||r.t<hit.t)){hit=r;hv=e}}
    const T=hit?hit.t:maxT,hx=ox+dx*T,hy=oy+dy*T,hz=oz+dz*T;
    if(p===0||n<4||p%4===0)FX.tracer(muz[0],muz[1],muz[2],hx,hy,hz,w.kind==='sniper'?0x9fe8ff:0xffe9a8);
    if(hit){
      const mul=fallMul(w,T);let dmg=w.dmg[hit.part]*mul;
      dealDamage(hv,a,dmg,hit.part===0,w);anyHit=1;if(hit.part===0)anyHead=1;
      FX.blood(hx,hy,hz,hit.part===0?7:4);
    }else if(mh){FX.sparks(hx,hy,hz,4,0xffd080,3);if(mh.n){FX.decal(hx,hy,hz,mh.n);if(n<4||p===0)FX.puff(hx,hy,hz,2,.6,.6,.6,.25,.6)}}
  }

  const rc=w.rc,k=a.ws.shot;a.ws.shot++;a.ws.last=now;

  if(a.isP){vm.kick=Math.min(1.6,vm.kick+.55);showMuzzle(w)}
  // 효과
  const p={x:a.x,z:a.z,v:a.isP?.85:1};
  if(!a.isP||true)AU.shot(w.kind,a.isP?null:p,w.sil);
  FX.glow(muz[0],muz[1],muz[2],0,0,0,.06,.45,w.sil?0xaaccff:0xffd27a,0,1);
  FX.flashLight(0,muz[0],muz[1],muz[2],0xffb060,w.sil?1.5:3.5,12);
  makeNoise(a.x,a.z,w.sil?18:48,a.team,true);
  if(a.model&&!a.isP)a.model.userData.flashT=.06;
  if(!a.isP&&a.model){}
  if(w.kind==='sniper'){a.ws.bolt=.0}
  return{hit:anyHit,head:anyHead};
}

  const[ox,oy,oz]=eyeOf(a),f=fwd(a.yaw,a.pitch);

}

function dealDamage(v,atk,dmg,head,w,ignoreArmor){
  if(!v.alive||G.phase==='buy'||(G.phase==='post'&&false))return;
  dmg=Math.round(dmg);let sh=0;
  if(!ignoreArmor&&v.armor>0){sh=Math.min(v.armor,Math.round(dmg*.66));v.armor-=sh}
  v.hp-=dmg-sh;v.lastDmgT=G.t;
  if(atk&&atk!==v){v.dmgBy[atk.id]=G.t}
  if(atk&&atk.isP){hitMarker(head);if(!ignoreArmor)AU.hit(head)}
  if(v.isP){AU.hurt();G.shake=Math.max(G.shake,.25);flashVig(Math.min(1,dmg/60));if(atk&&atk!==v)dmgDir(atk)}
  if(v.ai&&atk&&atk.team!==v.team){const ai=v.ai;ai.alert={x:atk.x,z:atk.z,t:G.t};ai.alertShot=true;if(!ai.tgt||G.t-ai.seen>1){ai.tgtNext=atk}}
  if(v.hp<=0)killActor(v,atk,w,head);
}
function killActor(v,atk,w,head){
  v.alive=false;v.hp=0;v.d++;v.deadT=0;v.deathPos={x:v.x,y:v.y,z:v.z};v.chan=null;v.abSel=null;
  if(atk&&atk!==v&&atk.team!==v.team){atk.k++;atk.round.k++;atk.creds=Math.min(9000,atk.creds+200);atk.ult=Math.min(atk.agent.ultCost,atk.ult+1);
    for(const id in v.dmgBy){if(+id!==atk.id&&G.t-v.dmgBy[id]<8){const o=G.actors.find(q=>q.id===+id);if(o&&o.team===atk.team)o.as++}}
    if(atk.isP){AU.kill();updateHUD()}}
  if(v.hasSpike){dropSpike(v)}
  addFeed(atk,v,w,head);
  if(v.isP){vm.rel=0;scopeLvl=0;setScope();G.spec=null;G.P.chan=null;$('prog').style.display='none';vmRebuild()}
  makeNoise(v.x,v.z,22,v.team,false);
  FX.blood(v.x,v.y+1.2,v.z,12);
  v.model.userData.fall=0;

function aiStrategy(a,dt){
  const ai=a.ai,pl=G.plan,sp=G.spike;if(!pl)return;
  const idle=!ai.path||ai.pi>=ai.path.length;
  if(ai.mode==='back'){if(G.t>(ai.backT||0))ai.mode=isAtk(a)?'guard':'hold';return}
  if(isAtk(a)){
    if(sp.state==='planted'){
      if(ai.mode!=='guard'&&ai.mode!=='fight'){aiOnPlant(a)}
      if(ai.mode==='guard'&&idle&&Math.random()<.01){const c=aiPickCell(sp.site);aiGoto(a,c.x,c.z)}
      return}
    if(a.hasSpike){
      if(['start','fetch','guard','lurk','hold','investigate','exec'].includes(ai.mode)){ai.mode='stage';aiGoto(a,pl.stage.x,pl.stage.z)}
      if(ai.mode==='stage'&&G.roundT>pl.execT){ai.mode='execute';const c=aiPickCell(pl.site);ai.planCell=c;aiGoto(a,c.x,c.z)}
      if(ai.mode==='execute'&&siteOf(a.x,a.z)===pl.site&&idle){ai.mode='plantnow'}
      if(ai.mode==='execute'&&idle&&!siteOf(a.x,a.z)){const c=aiPickCell(pl.site);aiGoto(a,c.x,c.z)}
      if(ai.mode==='plantnow'&&!a.chan&&a.spd<1&&!canPlant(a)&&!siteOf(a.x,a.z)){ai.mode='execute'}
      return}
    // 스파이크가 없는 공격수
    if(sp.state==='dropped'&&G.roundT>3){const near=G.actors.filter(q=>q.alive&&isAtk(q)&&q.ai).sort((p,q)=>Math.hypot(p.x-sp.x,p.z-sp.z)-Math.hypot(q.x-sp.x,q.z-sp.z))[0];
      if(near===a&&ai.mode!=='fetch'){ai.mode='fetch';aiGoto(a,sp.x,sp.z)}}
    if(ai.mode==='fetch'){if(idle&&sp.state==='dropped')aiGoto(a,sp.x,sp.z);if(sp.state!=='dropped')ai.mode='stage';return}
    if(ai.mode==='start'){ai.mode=ai.role==='lurk'?'lurk':'stage';const t=ai.role==='lurk'?pl.mid:pl.stage;const o=rnd(-3,3);aiGoto(a,t.x+o,t.z+o)}
    if(ai.mode==='stage'&&G.roundT>pl.execT+rnd(0,2)){ai.mode='execute';const c=aiPickCell(pl.site);aiGoto(a,c.x,c.z)}
    if(ai.mode==='lurk'&&G.roundT>pl.execT+8&&idle){ai.mode='execute';const c=aiPickCell(pl.site);aiGoto(a,c.x,c.z)}
    if(ai.mode==='execute'&&idle){if(siteOf(a.x,a.z)===pl.site){ai.mode='guard';}else{const c=aiPickCell(pl.site);aiGoto(a,c.x,c.z)}}
    if(ai.mode==='guard'&&idle&&Math.random()<.008){const c=aiPickCell(pl.site);aiGoto(a,c.x,c.z)}
    return;
  }
  if(ai.mode==='back'){if(G.t>(ai.backT||0))ai.mode=isAtk(a)?'guard':'hold';return}
  // 수비
  if(sp.state==='planted'){
    if(ai.mode!=='retake'&&ai.mode!=='defuse')aiOnPlant(a);
    if(ai.mode==='retake'){ai.wait-=dt;if(ai.wait<=0){
      if(!ai.goal||idle){aiGoto(a,sp.x,sp.z)}
      const d=Math.hypot(a.x-sp.x,a.z-sp.z);
      if(d<1.9&&!G.actors.some(e=>e.alive&&e.team!==a.team&&canSee(a,e,360))){ai.mode='defuse'}}}
    if(ai.mode==='defuse'&&G.actors.some(e=>e.alive&&e.team!==a.team&&Math.hypot(e.x-a.x,e.z-a.z)<20&&canSee(a,e,360))&&Math.random()<.02){ai.mode='retake';ai.wait=.2}
    return}
  if(ai.mode==='start'){const h=ai.holdSpot;if(h){ai.mode='hold';aiGoto(a,h.p.x,h.p.z);ai.lookAt=h.look}}
  if(ai.mode==='hold'){ if(idle&&ai.lookAt){aiAim(a,ai.lookAt.x,1.5,ai.lookAt.z,dt,false)}
    // 오래 지나면 일부 수비수가 전진
    if(G.roundT>55&&idle&&Math.random()<.002){ai.mode='investigate';const o=cellPos(14,pl.site==='A'?4:30);aiGoto(a,o.x,o.z);ai.invT=G.t+10}}
  if(ai.mode==='investigate'){if(idle||G.t>ai.invT){ai.mode='hold';const h=ai.holdSpot;if(h)aiGoto(a,h.p.x,h.p.z)}}
  // 정보 기반 로테이션: 한쪽 사이트에서 총소리가 많이 나면 지원
  if(ai.holdSpot&&ai.holdSpot.site==='M'&&ai.alert&&G.t-ai.alert.t<2&&ai.mode==='hold'){const s=ai.alert.x<0?'A':'B';const c=aiPickCell(s);aiGoto(a,c.x,c.z);ai.mode='investigate';ai.invT=G.t+8}
}

}

/* ======================= 입력 ======================= */
const KEYMAP={KeyW:'f',KeyS:'b',KeyA:'l',KeyD:'r',Space:'jump',ShiftLeft:'walk',ShiftRight:'walk',ControlLeft:'crouch',KeyZ:'crouch',KeyF:'use'};
addEventListener('keydown',e=>{
  if(G.state!=='play'||e.repeat&&e.code!=='x')return;
  const k=KEYMAP[e.code];
  if(k){IN[k]=1;if(e.code==='Space'||e.code==='ControlLeft')e.preventDefault()}
  if(G.state!=='play')return;
  const P=G.P;
  switch(e.code){
    case'Digit1':switchWeapon(1);break;case'Digit2':switchWeapon(2);break;case'Digit3':switchWeapon(3);break;case'Digit4':switchWeapon(4);break;
    case'KeyR':IN.rel=1;break;case'KeyB':openBuy(!buyOpen);break;
    case'KeyC':selectAbility('C');break;case'KeyQ':selectAbility('Q');break;case'KeyE':selectAbility('E');break;case'KeyX':selectAbility('X');break;
    case'Tab':e.preventDefault();showScore(true);break;
    case'Escape':if(buyOpen){openBuy(false)}break;
  }
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)IN[k]=0;if(e.code==='Tab')showScore(false)});
addEventListener('mousedown',e=>{if(G.state!=='play'||G.paused||buyOpen)return;if(!document.pointerLockElement&&!IS_TOUCH){relock();return}if(e.button===0){IN.fire=1;IN.fireEdge=1}else if(e.button===2){IN.adsEdge=1}});
addEventListener('mouseup',e=>{if(e.button===0)IN.fire=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement){IN.mx+=e.movementX;IN.my+=e.movementY}});
addEventListener('wheel',e=>{if(G.state!=='play'||!document.pointerLockElement)return;const P=G.P,order=['primary','side','knife'].filter(c=>c!=='primary'||P.inv.primary);let i=order.indexOf(P.cur);if(i<0)i=0;i=(i+(e.deltaY>0?1:-1)+order.length)%order.length;switchWeapon({primary:1,side:2,knife:3}[order[i]])},{passive:true});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&G.state==='play'&&!buyOpen&&!G.paused&&!G.over&&!IS_TOUCH){pauseGame(true)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.over)pauseGame(true)});
function pauseGame(on){if(on===G.paused)return;G.paused=on;overlay('pause',on);if(on){for(const k in IN)IN[k]=0;if(document.pointerLockElement)document.exitPointerLock()}}

/* ---------- 터치 ---------- */
function initTouch(){
  const hold=(id,fn,up)=>{const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('dn');fn()},{passive:false});const end=e=>{e.preventDefault();el.classList.remove('dn');up&&up()};el.addEventListener('touchend',end);el.addEventListener('touchcancel',end)};
  hold('tFire',()=>{IN.fire=1;IN.fireEdge=1},()=>IN.fire=0);hold('tJump',()=>IN.jump=1,()=>IN.jump=0);hold('tRel',()=>IN.rel=1);hold('tAds',()=>IN.adsEdge=1);
  hold('tC',()=>selectAbility('C'));hold('tQ',()=>selectAbility('Q'));hold('tE',()=>selectAbility('E'));hold('tX',()=>selectAbility('X'));
  hold('tUse',()=>IN.use=1,()=>IN.use=0);hold('tBuy',()=>openBuy(!buyOpen));hold('tPause',()=>pauseGame(true));hold('tCr',()=>IN.crouch=IN.crouch?0:1);
  hold('tSwap',()=>{const P=G.P;switchWeapon(P.cur==='primary'?2:P.inv.primary?1:(P.cur==='side'?3:2))});
  const joy=$('joy'),kn=$('knob');let jid=null,cx=0,cy=0;
  joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid){let dx=(t.clientX-cx)/50,dy=(t.clientY-cy)/50;const L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}IN.jx=dx;IN.jy=dy;kn.style.transform=`translate(${dx*30}px,${dy*30}px)`}},{passive:false});
  const je=e=>{IN.jx=IN.jy=0;kn.style.transform='';jid=null};joy.addEventListener('touchend',je);joy.addEventListener('touchcancel',je);
  const lp=$('lookpad');let lid=null,lx=0,ly=0;
  lp.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];lid=t.identifier;lx=t.clientX;ly=t.clientY},{passive:false});
  lp.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lid){IN.mx+=(t.clientX-lx)*1.5;IN.my+=(t.clientY-ly)*1.5;lx=t.clientX;ly=t.clientY}},{passive:false});
  lp.addEventListener('touchend',()=>lid=null);
}

/* ======================= 메인 루프 / 부팅 ======================= */
let lastT=performance.now(),menuA=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-lastT)/1000);lastT=now;fps=lerp(fps,1/Math.max(dt,.001),.05);
  if(G.state==='play'||G.state==='over'){
    if(!G.paused)gameUpdate(dt);
    if(G.state!=='menu'&&G.P){const d=G.paused?0:dt;if(!G.paused){FX.update(dt);vmUpdate(dt);hudTick(dt)}updateModels(d);updateCamera(d)}
  }else{ // 메뉴 배경: 맵 위를 천천히 선회
    menuA+=dt*.08;camera.position.set(Math.cos(menuA)*30,13,Math.sin(menuA)*30);camera.lookAt(0,1,0);FX.update(dt);
    AU.L.x=camera.position.x;AU.L.z=camera.position.z;sun.target.position.set(0,0,0);sun.position.set(-30,40,40);
    if(camera.fov!==60){camera.fov=60;camera.updateProjectionMatrix();FX.resize()}
  }
  renderer.clear();renderer.render(scene,camera);
  if(G.state==='play'&&G.P&&G.P.alive&&vm.g&&vm.g.visible){renderer.clearDepth();renderer.render(vmScene,vmCam)}
}
function boot(){
  initGL();FX.init();buildMenu();
  $('mPlay').onclick=()=>{AU.init();newMatch()};
  $('mSet').onclick=openSettings;$('mHelp').onclick=openHelp;$('mBack').onclick=()=>{location.href='world.html'};
  $('pResume').onclick=()=>{pauseGame(false);relock()};$('pSet').onclick=openSettings;$('pHelp').onclick=openHelp;$('pHome').onclick=()=>{overlay('pause',false);G.paused=false;toMenu()};
  $('buyGo').onclick=()=>{openBuy(false)};
  if(IS_TOUCH){document.body.classList.add('touch');initTouch()}
  // 디버그/테스트 훅
  window.__G=G;window.__dbg={newMatch,gameUpdate,IN,startRound,goLive};
  requestAnimationFrame(frame);
}
boot();
