<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뇌절 RPG 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--pur:#b78cff;--pur2:#7b4dff;--red:#ff4d6d;--grn:#4ef0a0;--yel:#ffd84d;--cy:#5ee7ff;--glass:rgba(22,14,48,.62);--line:rgba(190,150,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0614;color:#fff;font-family:"Jua","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
#ui>*{pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 20px rgba(160,110,255,.08)}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{padding:6px 12px;font-size:14px;letter-spacing:.5px}
.gauge{display:flex;align-items:center;gap:8px}
.gauge span{font-size:13px;color:var(--pur)}
.pips{display:flex;gap:4px}
.pip{width:20px;height:10px;border-radius:5px;background:rgba(255,255,255,.12);transition:.2s}
.pip.on{background:linear-gradient(90deg,#ff7be5,#9d6bff);box-shadow:0 0 12px #c58bff,0 0 4px #fff}
#mute{pointer-events:auto;cursor:pointer;width:38px;height:34px;display:grid;place-items:center;font-size:16px}
.ebar{position:absolute;left:50%;top:max(52px,calc(env(safe-area-inset-top) + 46px));transform:translateX(-50%);width:min(440px,86vw);padding:8px 12px}
.nm{display:flex;justify-content:space-between;font-size:16px;margin-bottom:5px}
.nm b{font-family:"Black Han Sans","Jua",sans-serif;font-weight:400;letter-spacing:1px}
.nm i{font-style:normal;font-size:12px;color:var(--yel)}
.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12)}
.bar>div{height:100%;border-radius:7px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar>.lag{position:absolute;left:0;top:0;background:rgba(255,255,255,.55);transition:width 1s .25s}
.he{background:linear-gradient(90deg,#ff3d6e,#ff9a5c)}
.hp{background:linear-gradient(90deg,#16c97a,#6dffb2)}
.sub{font-size:11px;color:#cdbdf5;margin-top:3px;display:flex;justify-content:space-between}
.bottom{display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;margin:0 auto}
#log{display:flex;flex-direction:column;gap:2px;font-size:15px;min-height:86px;justify-content:flex-end;text-shadow:0 1px 4px #000,0 0 8px #000;padding:0 4px}
#log div{animation:in .25s}
#log div:nth-last-child(n+4){opacity:.35}
#log div:nth-last-child(n+5){display:none}
#log .e{color:#ff9fb4}#log .p{color:#a8dcff}#log .s{color:var(--yel)}#log .b{color:#e0b8ff;font-size:19px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hbar{padding:8px 12px}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:auto}
.cmds button{pointer-events:auto}
@media(max-width:520px){.cmds{grid-template-columns:1fr 1fr}}
button{font:inherit;color:#fff;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:11px 6px;font-size:17px;background:linear-gradient(180deg,rgba(120,80,230,.55),rgba(50,28,110,.7));backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s,filter .15s,box-shadow .15s}
button:hover:not(:disabled){filter:brightness(1.25)}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.35;cursor:default}
button small{display:block;font-size:11px;color:#d6c6ff;opacity:.85;margin-top:2px}
button kbd{font-family:inherit;opacity:.6;margin-right:4px;font-size:13px}
.cmds .again{background:linear-gradient(180deg,#ff6bd6,#8a3dff);border-color:#ffb3ef;box-shadow:0 0 22px rgba(255,100,220,.5),inset 0 1px 0 rgba(255,255,255,.4)}
#bubble{position:fixed;transform:translate(-50%,-100%);max-width:240px;padding:8px 12px;background:#fff;color:#1a1030;border-radius:14px;font-size:15px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:5}
#bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fl{position:absolute;font-family:"Black Han Sans","Jua",sans-serif;font-size:34px;transform:translate(-50%,-50%);animation:fl 1.1s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 14px currentColor;-webkit-text-stroke:1.5px rgba(0,0,0,.55)}
@keyframes fl{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}15%{transform:translate(-50%,-70%) scale(1.35);opacity:1}100%{transform:translate(-50%,-190%) scale(.9);opacity:0}}
.big{position:absolute;font-family:"Black Han Sans","Jua",sans-serif;color:#fff;white-space:nowrap;text-shadow:0 0 18px #c070ff,0 0 40px #ff49d8,0 4px 0 #3a0a6a;-webkit-text-stroke:2px #5a1fb0;animation:bg 1.3s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes bg{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.1);opacity:0}12%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.3);opacity:1}25%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.25);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20;padding:20px;background:radial-gradient(ellipse at center,rgba(10,5,25,.25),rgba(5,2,14,.82));text-align:center}
#scr.on{display:flex;animation:fadein .5s}
@keyframes fadein{from{opacity:0}}
.ttl{font-family:"Black Han Sans","Jua",sans-serif;font-size:clamp(46px,13vw,92px);line-height:1;margin:0;background:linear-gradient(180deg,#fff,#ffb6f3 40%,#8b5bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(190,110,255,.75)) drop-shadow(0 6px 0 rgba(40,10,90,.9));animation:tt 1.6s ease-in-out infinite alternate}
@keyframes tt{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.05) rotate(1deg)}}
.desc{max-width:440px;font-size:16px;line-height:1.6;color:#e5d8ff;text-shadow:0 2px 8px #000}
.desc b{color:var(--yel)}
.go{pointer-events:auto;font-size:24px;padding:14px 38px;border-radius:40px;background:linear-gradient(180deg,#ff7be5,#7b4dff);border:2px solid #ffd1f6;box-shadow:0 0 34px rgba(255,100,225,.6);animation:pu .7s infinite alternate}
@keyframes pu{to{transform:scale(1.07)}}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.card{width:150px;min-height:150px;padding:14px 10px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:1.35;animation:cardin .5s backwards}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}
.card .ic{font-size:44px;filter:drop-shadow(0 0 10px rgba(200,150,255,.8))}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.8)}}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.55);z-index:3}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(20,10,44,.85);border:1px solid var(--line);font-size:18px;text-align:center;white-space:nowrap;animation:ts 3.2s forwards;max-width:94vw;white-space:normal}
@keyframes ts{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#wui{position:fixed;inset:0;pointer-events:none;z-index:4}
#quest{position:absolute;left:12px;top:56px;padding:8px 12px;font-size:13px;line-height:1.5;max-width:210px;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
#mm{position:absolute;right:12px;top:56px;width:112px;height:112px;border-radius:50%;border:2px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#act{position:absolute;right:18px;bottom:max(26px,env(safe-area-inset-bottom));pointer-events:auto;font-size:19px;padding:16px 22px;border-radius:40px;background:linear-gradient(180deg,#ffd84d,#ff9a3d);color:#3a2008;border:2px solid #fff3b0;box-shadow:0 0 26px rgba(255,200,80,.6);animation:pu .6s infinite alternate}
#joyzone{position:absolute;left:0;bottom:0;width:55%;height:55%;pointer-events:auto;touch-action:none}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(200,160,255,.65);box-shadow:0 0 14px rgba(200,160,255,.8)}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;color:#e8dcff;text-shadow:0 1px 4px #000;opacity:.8;white-space:nowrap}
@media(max-width:700px){#hint{display:none}}
#dlg{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(580px,92vw);padding:14px 18px 22px;display:none;z-index:15;pointer-events:auto;cursor:pointer}
#dlg.on{display:block;animation:in .25s}
#dname{color:var(--yel);font-size:19px;margin-bottom:6px;font-family:"Black Han Sans","Jua",sans-serif}
#dtext{min-height:3.4em;font-size:18px;line-height:1.55}
#dnext{position:absolute;right:16px;bottom:8px;color:var(--pur);animation:pu .5s infinite alternate}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0614;z-index:50;font-size:20px;color:var(--pur);transition:opacity .6s}
</style>
<script type="importmap">

</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div id="ui">
  <div class="hdr">
    <div class="glass pill" id="stage">STAGE 1</div>
    <div class="glass pill gauge" id="gpill" style="display:none"><span>뇌절</span><div class="pips" id="pips"></div></div>
    <div class="glass" id="mute" title="소리">🔊</div>
  </div>
  <div class="glass ebar" id="ebar" style="display:none">
    <div class="nm"><b id="en">-</b><i id="et"></i></div>
    <div class="bar"><div class="lag" id="elag" style="width:100%"></div><div class="he" id="eh" style="width:100%"></div></div>
    <div class="sub"><span id="ehn"></span><span id="ehit"></span></div>
  </div>
  <div class="bottom" id="bottom" style="display:none">
    <div id="log"></div>
    <div class="glass hbar">
      <div class="nm"><b>용사</b><i id="pt"></i></div>
      <div class="bar"><div class="hp" id="ph" style="width:100%"></div></div>
      <div class="sub"><span id="phn"></span><span id="pat"></span></div>
    </div>
    <div class="cmds" id="cmds">
      <button data-c="atk"><kbd>1</kbd>칼질<small>기본 공격</small></button>
      <button data-c="joke"><kbd>2</kbd>드립<small>약함 · 썰렁 확률</small></button>
      <button data-c="guard"><kbd>3</kbd>방어<small>피해↓ 회복</small></button>
      <button data-c="again" class="again" id="again"><kbd>4</kbd>한번 더!<small>직전 행동 +50%</small></button>
    </div>
  </div>
</div>
<div id="wui" style="display:none">
  <div id="quest"></div><canvas id="mm" width="112" height="112"></canvas>
  <button id="act" style="display:none"></button>
  <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
  <div id="hint">WASD / 방향키 이동 · Shift 달리기 · E / Space 대화</div>
</div>
<div class="glass" id="dlg"><div id="dname"></div><div id="dtext"></div><div id="dnext">▶</div></div>
<div id="bubble"></div>
<div id="fx"></div>
<div id="flash"></div>
<div id="scr"></div>
<div id="load">로딩 중... 🌀</div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=THREE.MathUtils.lerp, clamp=THREE.MathUtils.clamp;
const easeOut=t=>1-Math.pow(1-t,3), easeIn=t=>t*t*t, easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{const c=1.70158+1;return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2)};

/* ================= AUDIO ================= */
const AU={ctx:null,on:true,music:null};
function ac(){if(!AU.ctx){try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ctx.destination);AU.nb=AU.ctx.createBuffer(1,AU.ctx.sampleRate,AU.ctx.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}}if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}
function tone(f,d=.15,type='square',v=.08,to=null,delay=0){const c=ac();if(!c||!AU.on)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+.02)}
function noise(d=.2,v=.2,f=1200,type='lowpass',to=null,delay=0){const c=ac();if(!c||!AU.on)return;const t=c.currentTime+delay,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t);s.stop(t+d+.02)}
const SFX={
 ui(){tone(660,.07,'triangle',.06)},
 slash(){noise(.18,.25,3000,'bandpass',500);tone(300,.12,'sawtooth',.05,80)},
 hit(){noise(.2,.4,900,'lowpass',120);tone(140,.18,'square',.12,40)},
 hurt(){noise(.25,.45,600,'lowpass',90);tone(90,.25,'sawtooth',.14,35)},
 joke(){tone(600,.12,'triangle',.08,900);tone(900,.12,'triangle',.08,500,.1);tone(500,.2,'triangle',.08,1000,.2)},
 guard(){tone(220,.25,'sine',.14,440);noise(.25,.12,2500,'highpass')},
 heal(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'sine',.08,null,i*.06))},
 freeze(){noise(.5,.15,6000,'highpass',1500);tone(1500,.4,'sine',.05,300)},
 boom(){noise(1.2,.8,2500,'lowpass',40);tone(160,1,'sawtooth',.2,22);tone(80,1.2,'sine',.3,20)},
 chant(i){tone(300+i*70,.1,'sawtooth',.07)},
 win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.1,null,i*.09))},
 lose(){[392,330,262,196].forEach((f,i)=>tone(f,.4,'sawtooth',.09,null,i*.22))},
 die(){noise(.7,.4,1800,'lowpass',60);tone(300,.6,'sawtooth',.1,40)},
 spawn(){tone(100,.5,'sine',.2,400);noise(.5,.15,500,'bandpass',3000)},
};
function startMusic(){const c=ac();if(!c||AU.music)return;const bass=[55,55,65.4,49],arp=[220,261.6,329.6,392,329.6,261.6,440,329.6];let step=0;
 AU.music=setInterval(()=>{if(!AU.on||document.hidden)return;const bar=Math.floor(step/16)%4;if(step%4===0)tone(bass[bar],.38,'triangle',.07);
  const n=arp[step%8]*(bar===2?1.19:bar===3?.89:1);tone(n,.14,'square',.018,null);if(step%8===4)noise(.06,.03,5000,'highpass');step++},150)}
$('#mute').onclick=()=>{AU.on=!AU.on;$('#mute').textContent=AU.on?'🔊':'🔇'};

/* ================= RENDERER ================= */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const PR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x160b2e,.03);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(40,1,.1,200);

/* ---------- helpers ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
const glowTex=canvasTex(64,64,(g,w,h)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.1,envMapIntensity:1,...o});
const P=(c,o={})=>new THREE.MeshPhysicalMaterial({color:c,roughness:.4,metalness:.1,envMapIntensity:1.2,...o});
const E=(c,i=2,o={})=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i,roughness:.5,...o});
const ADD=(c,o={})=>new THREE.MeshBasicMaterial({color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,...o});
function mk(geo,mat,x=0,y=0,z=0,par=null,sh=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(sh){m.castShadow=true;m.receiveShadow=true}if(par)par.add(m);return m}
function grp(par,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);if(par)par.add(g);return g}
function sprite(tex,s=1,o={}){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,...o}));m.scale.set(s,s,1);return m}
function textTex(txt,{font='bold 80px Jua, sans-serif',color='#fff',bg=null,w=256,h=128,stroke=null}={}){return canvasTex(w,h,(g,W,H)=>{if(bg){g.fillStyle=bg;g.beginPath();g.roundRect(4,4,W-8,H-8,24);g.fill()}g.font=font;g.textAlign='center';g.textBaseline='middle';if(stroke){g.lineWidth=8;g.strokeStyle=stroke;g.strokeText(txt,W/2,H/2+4)}g.fillStyle=color;g.fillText(txt,W/2,H/2+4)})}

/* ================= WORLD ================= */
// sky dome with nebula shader
const sky=new THREE.Mesh(new THREE.SphereGeometry(90,48,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{t:{value:0},boost:{value:0},day:{value:1}},
 vertexShader:`varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 v;uniform float t,boost,day;
 float h(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
 float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}

function enemyBubble(t,ms=2000){bubble.textContent=t;bubble.style.opacity=1;bubbleUntil=performance.now()+ms}
const hp3=()=>worldOf(hero,1.4),ep3=()=>{const p=enemyObj.g.position.clone();p.y+=enemyObj.hy*.5;return p};

async function startBattle(ei){curE=ei;
 const b=ENEMIES[ei];E_={...b,max:b.hp,skip:false,li:0};G.last=null;G.count=0;G.stun=0;G.guard=0;turn=1;over=false;busy=true;
 dizzy.visible=false;shieldMesh.visible=false;ice.visible=false;$('#log').innerHTML='';$('#scr').className='';
 $('#ebar').style.display='';$('#bottom').style.display='';
 spawnEnemy(ei);enemyObj.g.visible=false;ui();setShot('wide');
 await sleep(300);SFX.spawn();enemyObj.g.visible=true;
 // drop-in
 const e=enemyObj,sc=e.sc;ring(ENEMY_POS,{color:0xff6bd6,max:9,life:1});burst(worldOf(e.g,1.5),{color:0xff77ee,n:60,speed:5,life:1});addShake(.5);lightPulse(0xff66ee,30,.6,new THREE.Vector3(ENEMY_POS.x,2,ENEMY_POS.z));
 await tween(.7,t=>{e.g.scale.setScalar(sc*(.05+.95*t));e.g.position.y=(1-t)*4;e.g.rotation.y=-Math.PI/2*.92+(1-t)*5},easeBack);e.g.position.y=0;e.g.rotation.y=-Math.PI/2*.92;
 say(`${E_.n}이(가) 나타났다!`,'s');
 if(E_.boss){say('뇌절왕: 이 게임의 모든 개그를 끝까지 우려먹어주마.','b');enemyBubble('이 게임의 모든 개그를 끝까지 우려먹어주마',2600);bigText('뇌절왕',1,false);addShake(.8);SFX.boom()}
 busy=false;ui();
}
async function heroMoveTo(x,dur,z=0){const sx=hero.position.x,sz=hero.position.z;await tween(dur,t=>{hero.position.x=lerp(sx,x,t);hero.position.z=lerp(sz,z,t)},easeOut)}
async function swing(power=1){heroBusy=true;const a=H.armR;
 await tween(.14,t=>{a.rotation.x=lerp(-.2,-2.7,t)},easeOut);
 SFX.slash();slashFx(hero.localToWorld(new THREE.Vector3(.7,1.7,.4)).add(new THREE.Vector3(.6,0,0)),rand(-.4,.4),0xbff4ff,1.8+power*.3,pick([-1,1]));
 const imp=tween(.1,t=>{a.rotation.x=lerp(-2.7,.6,t)},easeIn);await imp;heroBusy=false}
async function swingBack(){heroBusy=true;await tween(.25,t=>{H.armR.rotation.x=lerp(.6,-.2,t)},easeOut);heroBusy=false}
function enemyHurt(d,{crit=false,color='#fff'}={}){E_.hp-=d;const p=ep3();fxFloat('-'+d,p,crit?'#ffd84d':color);
 burst(p,{color:crit?0xffd84d:0xffffff,n:crit?60:26,speed:crit?8:5,life:.7});SFX.hit();addShake(crit?.9:.35);hitstop(crit?160:90);fxPass.uniforms.amt.value=crit?1.6:.8;bloomKick=crit?.5:.15;lightPulse(0xffffff,crit?25:10,.25,p);
 flashMats(enemyObj,0xffffff,crit?4:2.6,.3);
 const e=enemyObj,bx=e.base.x;tween(.3,t=>{e.g.position.x=bx+Math.sin(t*Math.PI)*.5*(1-t)*(crit?2:1)+(Math.random()-.5)*(1-t)*.15},easeOut).then(()=>{e.g.position.x=bx});
 ui()}
async function heroAttack(mult,again){
 setShot('hero');await heroMoveTo(ENEMY_POS.x-2.3,.2);await swing(mult);
 enemyHurt(Math.round(G.atk*mult),{crit:mult>=2.5});await sleep(60);await Promise.all([swingBack(),heroMoveTo(HERO_POS.x,.35,HERO_POS.z)]);setShot('wide')}
async function heroJoke(mult){
 setShot('hero');SFX.joke();
 await tween(.35,t=>{heroY=Math.sin(t*Math.PI)*.8;hero.rotation.y=Math.PI/2*.92+t*Math.PI*2},easeIO);heroY=0;hero.rotation.y=Math.PI/2*.92;
 const base=hero.position.clone().add(new THREE.Vector3(0,2.6,0));
 for(let i=0;i<5;i++){floatSprite(pick(['ㅋㅋㅋ','드립!','ㅎㅎ','아재!','ㅋ']),base.clone().add(new THREE.Vector3(rand(-.5,1.5),rand(0,.6),rand(-.4,.4))),{size:rand(1,1.5),rise:rand(1,2)});await sleep(40)}
 ring(hero.position,{color:0xffe066,max:6,life:.7,y:.1});
 // laugh wave travels to enemy
 await tween(.35,t=>{fxPass.uniforms.warp.value=2*(1-t)},easeOut);
 enemyHurt(Math.round(G.atk*.7*mult));setShot('enemy');
 if(Math.random()<G.joke+.08*(G.count-1)){await sleep(250);E_.skip=true;SFX.freeze();ice.visible=true;ice.position.copy(enemyObj.g.position);burst(ep3(),{color:0x9ee9ff,n:50,speed:4,life:1});fxPass.uniforms.tint.value.set(0,.04,.1);floatSprite('썰렁...',worldOf(enemyObj.g,enemyObj.hy*.8),{color:'#bff3ff',stroke:'#1b6a9a',size:1.6});say(`${E_.n}: ...(썰렁)`,'e')}
 await sleep(200);setShot('wide')}
async function heroGuard(count,again){
 SFX.guard();shieldMesh.visible=true;shieldMat.uniforms.c.value.set(0x66ddff);
 G.guard=Math.min(.9,G.guardPow+.1*(count-1));
 tween(.5,t=>{shieldMat.uniforms.o.value=t;shieldMesh.scale.setScalar(.3+.7*t)},easeBack);
 const h=Math.round(3*count*(again?1.5:1));G.hp=Math.min(G.max,G.hp+h);fxFloat('+'+h,hp3(),'#4ef0a0');SFX.heal();burst(hero.position.clone().add(new THREE.Vector3(0,.3,0)),{color:0x66ffb2,n:40,speed:1.5,up:3,grav:-1,life:1});ring(hero.position,{color:0x66ddff,max:5,life:.8,y:.1});
 await tween(.25,t=>{H.armL.rotation.x=lerp(0,-.8,t)});await sleep(300);ui()}
async function boomMove(c){
 setShot('boom');screenFlash(.6,400);bigText('뇌절!!!',1,false);say('🌀🌀 뇌절 폭발!!! 🌀🌀','b');SFX.boom();addShake(.7);boomBoost=2;
 const ghosts=[];
 if(c==='guard'){
  for(let i=0;i<6;i++){say(CMD[c].say.repeat(i+3),'s');SFX.chant(i);bigText('방어!',1);ring(hero.position,{color:0xffe066,max:4+i*2,life:.6,y:.1+i*.05});await sleep(130)}
  shieldMesh.visible=true;shieldMat.uniforms.c.value.set(0xffd54d);shieldMat.uniforms.o.value=1;G.guard=.9;
  tween(.5,t=>shieldMesh.scale.setScalar(1+t*.7),easeBack);const h=Math.round(G.max*.5);G.hp=Math.min(G.max,G.hp+h);fxFloat('+'+h,hp3(),'#4ef0a0');SFX.heal();
  burst(hero.position.clone().add(new THREE.Vector3(0,1,0)),{color:0xffd54d,n:120,speed:7,life:1.3});ring(hero.position,{color:0xffd54d,max:14,life:1.1,y:.1});fxPass.uniforms.amt.value=2;lightPulse(0xffd54d,40,.8);
  say('방어를 너무 많이 해서 오히려 안 아프다.','p');await sleep(500);
 }else{
  // echo ghosts of the hero, each strikes in sequence = 뇌절
  for(let i=0;i<6;i++){
   say(CMD[c].say.repeat(i+3),'s');SFX.chant(i);
   const gh=buildHero(scene,true);gh.g.position.copy(hero.position).add(new THREE.Vector3(i*.5+.3,0,(i%2?1:-1)*(.5+i*.3)));gh.g.rotation.y=hero.rotation.y;gh.g.scale.setScalar(1);ghosts.push(gh);
   const tx=ENEMY_POS.x-2-i*.1;const sx=gh.g.position.x,sz=gh.g.position.z;
   gh.armR.rotation.x=-2.6;gh.g.position.set(sx,0,sz);
   tween(.14,t=>{gh.g.position.x=lerp(sx,tx,t);gh.g.position.z=lerp(sz,ENEMY_POS.z+(i%2?1:-1)*.9,t);gh.armR.rotation.x=lerp(-2.6,.6,t)},easeIn);
   bigText(CMD[c].say,1);slashFx(new THREE.Vector3(ENEMY_POS.x-1,1.6+rand(-.3,.6),ENEMY_POS.z+rand(-.8,.8)),rand(-.8,.8),pick([0xbff4ff,0xffa8f2,0xfff2a8]),2.2+i*.15,pick([-1,1]));
   burst(ep3(),{color:0xffffff,n:20,speed:6,life:.6});addShake(.35+i*.08);SFX.slash();SFX.hit();hitstop(50);fxPass.uniforms.amt.value=1+i*.2;flashMats(enemyObj,0xff88ee,2.5,.2);
   await sleep(150-i*10)}
  await sleep(150);
  // finisher
  const d=Math.round(G.atk*(c==='joke'?7:6)*(1+G.boom));
  screenFlash(1,700);ring(ENEMY_POS,{color:0xff66ee,max:18,life:1.2});ring(ENEMY_POS,{color:0xffffff,max:11,life:.9,w:.1});ring(ENEMY_POS,{color:0x66ccff,max:24,life:1.5,w:.5});
  burst(ep3(),{color:0xff77ee,n:200,speed:11,life:1.4});burst(ep3(),{color:0xffffff,n:100,speed:6,life:1});lightPulse(0xff88ff,80,1,ep3());
  fxPass.uniforms.amt.value=3;fxPass.uniforms.warp.value=4;bloomKick=1.2;fovPunch=-9;addShake(1.2);SFX.boom();bigText('뇌절',9);
  enemyHurt(d,{crit:true});say(`${d} 피해! 그리고 모두가 조용해졌다.`,'p');
  tween(.9,t=>{enemyObj.g.rotation.y=-Math.PI/2*.92+Math.sin(t*Math.PI)*.5},easeOut);
  await sleep(700);
  ghosts.forEach(gh=>{tween(.5,t=>{gh.g.traverse(o=>{if(o.isMesh)o.material.opacity=.5*(1-t)})}).then(()=>scene.remove(gh.g))});
 }
 G.stun=1;G.count=0;G.last=null;dizzy.visible=true;setShot('wide')}

async function act(c){
 if(busy||over)return;ac();busy=true;ui();let again=false;
 if(G.stun>0){G.stun--;dizzy.visible=G.stun>0;say('😳 아까 일이 너무 민망해서 아무것도 못 한다...','p');G.last=null;G.count=0;await sleep(700)}
 else{
  if(c==='again'){if(!G.last){busy=false;return}c=G.last;again=true}
  G.count=(G.last===c)?G.count+1:1;G.last=c;ui();
  const mult=(1+.5*(G.count-1))*(again?1.5:1);
  if(again){say('한번 더!!','p');bigText('한번 더!',1,false)}
  if(G.count>=G.thr){await boomMove(c)}
  else{
   say(CMD[c].say.concat(' ').repeat(G.count).trim()+(G.count>1?` (${G.count}연속 x${mult.toFixed(1)})`:''),'p');
   if(G.count>1)bigText(CMD[c].say,G.count-1);
   if(c==='atk')await heroAttack(mult,again);else if(c==='joke')await heroJoke(mult);else await heroGuard(G.count,again);
  }
 }
 ui();await sleep(250);
 if(E_.hp<=0)return win();
 await enemyTurn();
}
async function enemyTurn(){
 const e=enemyObj;
 if(E_.skip){E_.skip=false;ice.visible=false;burst(ep3(),{color:0x9ee9ff,n:60,speed:5,life:.9});SFX.hit();say(`${E_.n}은(는) 썰렁함에 얼어붙어 행동하지 못했다.`,'e');G.guard=0;shieldMesh.visible=false;turn++;await sleep(500);return nextTurn()}
 const h=hitsNow();const line=E_.lines[E_.li++%E_.lines.length];say(`${E_.n}: "${line}" (${h}연타!)`,'e');enemyBubble(line,1700);setShot('enemy');await sleep(500);setShot('wide');
 for(let i=0;i<h;i++){
  const sx=e.base.x;
  await tween(.18,t=>{e.g.position.x=lerp(sx,HERO_POS.x+2.6,t);e.g.rotation.z=-t*.15},easeIn);
  let d=Math.round(E_.atk*.5*rand(.8,1.2));const blocked=G.guard>0;if(blocked)d=Math.round(d*(1-G.guard));
  G.hp-=d;fxFloat('-'+d,hp3(),blocked?'#8fe8ff':'#ff4d6d');
  burst(hp3(),{color:blocked?0x66ddff:0xff4d6d,n:blocked?30:40,speed:5,life:.6});SFX.hurt();addShake(blocked?.25:.55);hitstop(70);fxPass.uniforms.amt.value=blocked?.6:1.2;fxPass.uniforms.tint.value.set(blocked?0:.14,blocked?.03:0,0);
  if(blocked){shieldMat.uniforms.o.value=3;setTimeout(()=>shieldMat.uniforms.o.value=1,120)}
  flashMats(heroObj,0xff3355,blocked?.8:2.8,.3);const hx=HERO_POS.x;tween(.25,t=>{hero.position.x=hx-Math.sin(t*Math.PI)*.5*(blocked?.3:1)},easeOut).then(()=>hero.position.x=hx);
  say(`  ${i+1}타! ${d} 피해${blocked?' (방어)':''}`,'e');ui();
  await tween(.22,t=>{e.g.position.x=lerp(HERO_POS.x+2.6,sx,t);e.g.rotation.z=-.15*(1-t)},easeOut);
  if(G.hp<=0)break;await sleep(90)}
 e.g.rotation.z=0;e.g.position.x=e.base.x;
 G.guard=0;shieldMesh.visible=false;shieldMat.uniforms.o.value=0;H.armL.rotation.x=0;turn++;nextTurn()}
async function nextTurn(){if(G.hp<=0)return lose();busy=false;ui()}
async function win(){
 over=true;busy=true;SFX.die();say(`${E_.n}을(를) 쓰러뜨렸다!`,'s');ui();setShot('enemy');
 const e=enemyObj;flashMats(e,0xffffff,5,.5);burst(ep3(),{color:0xffffff,n:150,speed:9,life:1.4});burst(ep3(),{color:0xff77ee,n:100,speed:6,life:1.6});ring(ENEMY_POS,{color:0xffffff,max:14,life:1});addShake(1);hitstop(250,.05);screenFlash(.6,600);
 await tween(1,t=>{e.g.scale.setScalar(e.sc*(1-t*.97));e.g.rotation.y=-Math.PI/2*.92+t*8;e.g.position.y=Math.sin(t*3)*.4*(1-t)},easeIn);
 e.g.visible=false;ice.visible=false;bubble.style.opacity=0;SFX.win();
 // victory pose
 setShot('hero');heroBusy=true;tween(.5,t=>{H.armR.rotation.x=lerp(-.2,-3.0,t)},easeOut);await tween(.6,t=>{heroY=Math.sin(t*Math.PI)*.6;hero.rotation.y=Math.PI/2*.92+t*Math.PI*2},easeIO);heroY=0;hero.rotation.y=Math.PI/2*.92;
 burst(worldOf(hero,2.4),{color:0xffd84d,n:80,speed:5,life:1.4,up:3});bigText('승리!',1,false);await sleep(900);
 heroBusy=false;onBattleWon()}
async function lose(){
 over=true;busy=true;ui();SFX.lose();setShot('hero');addShake(.8);fxPass.uniforms.tint.value.set(.2,0,0);
 await tween(1,t=>{hero.rotation.z=-t*1.5},easeIn);
 const s=$('#scr');s.innerHTML=`<h2 class="ttl" style="font-size:clamp(40px,11vw,72px)">쓰러졌다...</h2><div class="desc">${E_.n}에게 패배...<br>"사실 너도 뇌절하고 있었어."<br>마을 사람들이 당신을 업어 왔습니다.</div><button class="go">마을에서 깨어나기</button>`;s.className='on';
 s.querySelector('.go').onclick=()=>{SFX.ui();G.hp=Math.round(G.max*.6);G.stun=0;G.count=0;enterWorld(new THREE.Vector3(-4,0,2))}}
function victory(){
 mode='dialog';setShot('top');SFX.win();bigText('CLEAR!!',6);
 const s=$('#scr');s.innerHTML=`<h2 class="ttl">🏆 CLEAR!</h2><div class="desc">뇌절왕을 쓰러뜨렸다!<br>세계는 평화를 되찾았다.<br><b>...정말? 이장님께 보고하러 가자.</b></div><button class="go" id="vback">마을로 돌아가기</button><button id="vre" style="pointer-events:auto">처음부터 다시</button>`;s.className='on';
 $('#vback').onclick=()=>{SFX.ui();G.stun=0;enterWorld(new THREE.Vector3(-4,0,2))};$('#vre').onclick=()=>{SFX.ui();resetGame()}}
function resetGame(){Object.assign(G,{max:100,hp:100,atk:12,thr:5,joke:.3,guardPow:.5,boom:0,stun:0,last:null,count:0,guard:0});qi=0;qstate='none';qprog=0;wmons.forEach(m=>respawnWM(m));$('#pips').innerHTML='';
 enterWorld(new THREE.Vector3(-4,0,2)).then(()=>talk(chief))}
function title(){
 mode='title';setShot('title');showUI('title');
 const s=$('#scr');s.innerHTML=`<h1 class="ttl">뇌절<br>RPG</h1><div class="desc"><b>오픈월드 마을</b>을 돌아다니며 이장님의 <b>퀘스트</b>를 받고,<br>몬스터와 닿으면 3D 전투!<br><b>같은 행동을 연속으로</b> 하면 점점 강해지고 게이지가 차면 <b style="color:#ff9bf0">뇌절 폭발!</b><br>(폭발 후엔 민망해서 한 턴 쉽니다)</div><button class="go" id="start">모험 시작</button><div class="desc" style="font-size:13px;opacity:.7">PC: WASD 이동 · E 대화 · 전투 1~4 / 모바일: 화면 왼쪽 드래그로 이동</div>`;s.className='on';
 $('#start').onclick=async()=>{ac();startMusic();SFX.ui();s.className='';mode='world';showUI('world');setShot('follow');updateQuestUI();await sleep(500);talk(chief)}}
document.querySelectorAll('#cmds button').forEach(b=>b.onclick=()=>{SFX.ui();act(b.dataset.c)});
$('#act').onclick=interact;$('#dlg').onclick=()=>{dlgNext&&dlgNext()};
const jz=$('#joyzone'),jb=$('#joy'),jk=$('#knob');let jid=null,jo=null;
jz.addEventListener('pointerdown',e=>{jid=e.pointerId;jo={x:e.clientX,y:e.clientY};jb.style.display='block';jb.style.left=(jo.x-55)+'px';jb.style.top=(jo.y-55)+'px';jz.setPointerCapture(e.pointerId)});
jz.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;jk.style.left=(30+dx)+'px';jk.style.top=(30+dy)+'px'});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;jb.style.display='none';jk.style.left='30px';jk.style.top='30px'};
jz.addEventListener('pointerup',jend);jz.addEventListener('pointercancel',jend);
const kn=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{const k=kn(e);keys[k]=true;
 if(mode==='dialog'&&dlgNext&&(k==='e'||k===' '||k==='Enter')){dlgNext();e.preventDefault();return}
 if(mode==='world'&&(k==='e'||k===' '||k==='Enter')){interact();e.preventDefault();return}
 const m={1:'atk',2:'joke',3:'guard',4:'again'};if(mode==='battle'&&m[k])act(m[k]);
 if(k===' '||k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[kn(e)]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

/* boot */
spawnEnemy(0);enemyObj.g.visible=false;
hero.position.set(-4,0,2);hero.rotation.set(0,-2.6,0);groundY=hgt(-4,2);
arenaG.visible=false;worldG.visible=true;setEnv('world');sky.material.uniforms.day.value=1;
setShot('title');snapCam();updateQuestUI();$('#stage').textContent=stageLabel();
frame();title();
const ld=$('#load');ld.style.opacity=0;setTimeout(()=>ld.remove(),700);
window.__game={hero,camera,snap:snapCam,spawnEnemy,setShot,act,G,tp(x,z){hero.position.set(x,0,z)},talk,chief,get mode(){return mode},get stage(){return stage},get over(){return over},get busy(){return busy},get qi(){return qi},get qprog(){return qprog},get qstate(){return qstate},get wmons(){return wmons}};
</script>
