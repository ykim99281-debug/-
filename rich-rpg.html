<title>1998 꼬마 투자왕 - 부자 RPG</title>
<style>
:root{--bg:#0e1424;--card:#172038;--card2:#1e2a4a;--tx:#e8ecf8;--mut:#8b97b8;--up:#ff5b6e;--dn:#4f9dff;--gold:#ffd24a;--ok:#46d39a;--line:#2a375c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.45}
#app{max-width:760px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:800;color:var(--gold)}
.up{color:var(--up)}.dn{color:var(--dn)}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--gold);color:#241a00;font-weight:800;border-color:var(--gold)}
button.buy{background:#5a1f2a;border-color:var(--up)}
button.sell{background:#1c3560;border-color:var(--dn)}
input{background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;width:90px;font-family:inherit}
input.name{width:100%;font-size:16px}
.bar{height:8px;background:#0b1020;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%}
.stock{border-top:1px solid var(--line);padding:10px 0}
.stock:first-child{border-top:0}
.ev{background:var(--card2);border-left:4px solid var(--gold);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.ev.r{border-color:var(--ok)}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
svg{display:block}
</style>

function interp(ix,vals,t){
 if(t<=ix[0])return vals[0];if(t>=ix[ix.length-1])return vals[vals.length-1];

 const f=(t-ix[i])/(ix[i+1]-ix[i]);
 return Math.exp(Math.log(vals[i])*(1-f)+Math.log(vals[i+1])*f);
}

 return n.toLocaleString()+'원'}
const ymOf=t=>({y:1998+Math.floor(t/12),m:t%12+1});
const ageOf=t=>11+Math.floor(t/12);
const wage=t=>Math.pow(1.04,Math.floor(t/12));
function stage(t){const a=ageOf(t);return a<=13?'초등학생':a<=16?'중학생':a<=19?'고등학생':a<=25?'대학생':'직장인'}
function income(t){const a=ageOf(t),w=wage(t);
 const v=a<=13?5000:a<=16?15000:a<=19?25000:a<=25?150000:700000;return Math.round(v*w/100)*100}
function workPay(t){const a=ageOf(t),w=wage(t);
 const v=a<=13?3000:a<=19?30000:a<=25?400000:500000;return Math.round(v*w/100)*100}
const WORKNAME=t=>{const a=ageOf(t);return a<=13?'심부름':a<=19?'전단지 알바':a<=25?'과외·알바':'야근 수당'};
const TITLES=[[0,'용돈 투자 꿈나무'],[1e5,'저금통 개미'],[1e6,'동네 소문난 꼬마 개미'],[1e7,'학교의 전설'],[1e8,'억대 개미 (1억)'],[5e8,'큰손 후보 (5억)'],[1e9,'10억 부자'],[5e9,'슈퍼 개미 (50억)'],[1e10,'백억 자산가'],[5e10,'증권가의 전설'],[1e11,'재계 거물 (1000억)']];
function rank(n){let r=0;TITLES.forEach((x,i)=>{if(n>=x[0])r=i});return r}
/* ============ 상태 ============ */
const KEY='richrpg98_v1';
let S=null,toastT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function newGame(name){
 S={name:name||'나',t:0,cash:30000,dep:0,h:{},int:5,mental:80,acted:false,tips:[],log:[],nw:[30000],q:{},locked:false,contrib:30000,over:false,msg:''};
 save();
}
function price(id,t){return P[id][t==null?S.t:t]}
function holdVal(){let v=0;for(const id in S.h)v+=S.h[id].q*(price(id)||0);return v}
function nw(){return S.cash+S.dep+holdVal()}
function toast(m){S.msg=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.msg='';render()},2400)}
/* ============ 행동 ============ */
const BUYFEE=0.003,SELLFEE=0.005;
function maxBuy(id){const p=price(id);return p?Math.floor(S.cash/(p*(1+BUYFEE))):0}
function buy(id){
 if(S.locked)return toast('멘탈 붕괴! 이번 달은 거래할 수 없다.');
 const p=price(id);if(!p)return toast('아직 상장 전이야.');
 const q=Math.max(1,parseInt(S.q[id])||1),cost=Math.ceil(p*q*(1+BUYFEE));
 if(cost>S.cash)return toast('돈이 부족해! 필요 '+won(cost)+' / 보유 '+won(S.cash));
 S.cash-=cost;const h=S.h[id]||(S.h[id]={q:0,cost:0});h.q+=q;h.cost+=cost;
 save();toast(ST[id].name+' '+q+'주 매수 ('+won(cost)+')');
}
function sell(id){
 if(S.locked)return toast('멘탈 붕괴! 이번 달은 거래할 수 없다.');
 const h=S.h[id];if(!h||!h.q)return toast('보유 수량이 없어.');
 const q=Math.min(h.q,Math.max(1,parseInt(S.q[id])||1)),p=price(id),get=Math.floor(p*q*(1-SELLFEE));
 const cst=h.cost*q/h.q;S.cash+=get;h.cost-=cst;h.q-=q;if(h.q<=0)delete S.h[id];
 save();toast(ST[id].name+' '+q+'주 매도 → '+won(get)+' ('+(get>=cst?'+':'')+won(get-cst)+')');
}
function act(kind){
 if(S.acted)return;S.acted=true;
 if(kind==='read'){
  S.int=Math.min(100,S.int+1);
  const a=STOCKS.filter(s=>P[s.id][S.t]!=null&&S.t<N-1);
  const picks=[];while(picks.length<Math.min(2,a.length)){const x=a[Math.floor(Math.random()*a.length)];if(!picks.includes(x))picks.push(x)}
  const acc=Math.min(.9,.5+S.int*.008);
  picks.forEach(x=>{const real=RAW[x.id][S.t+1]>RAW[x.id][S.t];S.tips.push({id:x.id,up:Math.random()<acc?real:!real,acc,src:'경제신문 전문가'})});
  toast('📰 신문을 읽었다. 분석력 +1');
 }else if(kind==='work'){
  const p=workPay(S.t);S.cash+=p;S.contrib+=p;S.mental=Math.max(1,S.mental-5);toast('💪 '+WORKNAME(S.t)+'로 '+won(p)+' 벌었다. 멘탈 -5');
 }else{
  S.mental=Math.min(100,S.mental+25);S.locked=false;toast('😴 푹 쉬었다. 멘탈 +25');
 }
 save();
}
function advance(){
 if(S.over)return;
 if(S.t>=N-1){S.over=true;save();return render()}
 const prev=nw();S.locked=false;S.tips=[];
 S.t++;const t=S.t,{y,m}=ymOf(t),ev=[];
 STOCKS.forEach(s=>(s.splits||[]).forEach(([d,n])=>{if(ti(d)===t&&S.h[s.id]){S.h[s.id].q*=n;ev.push({txt:'✂ '+s.name+' '+n+':1 액면분할! 보유 주식이 '+n+'배로 늘었다.',r:1})}}));
 S.dep=Math.round(S.dep*(1+(RATE[y]||2)/1200));
 const inc=income(t);S.cash+=inc;S.contrib+=inc;
 const h=HIST[y*100+m];if(h)ev.push({txt:h});
 if(m===2&&ageOf(t)<=25){const g=Math.round(wage(t)*(30000+Math.random()*70000)/1000)*1000;S.cash+=g;S.contrib+=g;ev.push({txt:'🧧 설날 세뱃돈 +'+won(g),r:1})}
 else if(Math.random()<.2){const r=RANDOM[Math.floor(Math.random()*RANDOM.length)].f(S);ev.push({txt:r[0],r:1})}
 const now=nw(),pct=prev>0?(now-inc-prev)/prev:0;
 S.mental=Math.min(100,S.mental+3);
 if(pct<=-.15){S.mental-=15;ev.push({txt:'😱 자산이 한 달 새 '+Math.round(-pct*100)+'% 증발! 멘탈 -15',r:1})}
 else if(pct>=.15){S.mental=Math.min(100,S.mental+8);ev.push({txt:'🤩 자산이 한 달 새 '+Math.round(pct*100)+'% 상승! 멘탈 +8',r:1})}
 if(S.mental<=0){S.locked=true;S.mental=25;ev.push({txt:'🌀 멘탈 붕괴… 이번 달은 거래할 수 없다.',r:1})}
 S.log=ev;S.acted=false;S.nw.push(nw());
 save();
}
function skip(n){for(let i=0;i<n&&!S.over;i++){advance();if(S.t>=N-1)break}render()}
/* ============ 렌더 ============ */
function spark(id){
 const t=S.t,from=Math.max(0,t-12),arr=[];
 for(let i=from;i<=t;i++){const v=RAW[id][i];if(v!=null)arr.push(v)}
 if(arr.length<2)return'';
 const mn=Math.min(...arr),mx=Math.max(...arr),w=84,h=26;
 const pts=arr.map((v,i)=>(i/(arr.length-1)*w).toFixed(1)+','+(h-2-(mx===mn?.5:(v-mn)/(mx-mn))*(h-4)).toFixed(1)).join(' ');
 const up=arr[arr.length-1]>=arr[0];
 return'<svg width="'+w+'" height="'+h+'"><polyline fill="none" stroke="'+(up?'#ff5b6e':'#4f9dff')+'" stroke-width="2" points="'+pts+'"/></svg>'
}
function chart(){
 const a=S.nw,w=700,h=120;if(a.length<2)return'';
 const L=a.map(v=>Math.log(Math.max(v,1000))),mn=Math.min(...L),mx=Math.max(...L);
 const pts=L.map((v,i)=>(i/(N-1)*w).toFixed(1)+','+(h-6-(mx===mn?.5:(v-mn)/(mx-mn))*(h-12)).toFixed(1)).join(' ');
 return'<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="none" style="height:90px"><polyline fill="none" stroke="#ffd24a" stroke-width="2.5" points="'+pts+'"/></svg><div class="mut">내 총자산 추이 (로그 눈금) · 1998 → 2025</div>'
}
function stockRow(s){
 const p=price(s.id),t=S.t;
 if(p==null){const y=ymOf(s.first);return'<div class="stock"><b>'+s.emoji+' '+s.name+'</b> <span class="mut">상장 전 ('+y.y+'년 '+y.m+'월 상장 예정)</span></div>'}
 const prev=t>0&&RAW[s.id][t-1]!=null?RAW[s.id][t-1]:null,ch=prev?RAW[s.id][t]/prev-1:0;
 const h=S.h[s.id],hv=h?h.q*p:0,pl=h&&h.cost?(hv/h.cost-1):0;
 const tip=S.tips.filter(x=>x.id===s.id).map(x=>'<span class="tag">'+x.src+': '+(x.up?'▲ 오를 것':'▼ 내릴 것')+' ('+Math.round(x.acc*100)+'%)</span>').join(' ');
 return'<div class="stock"><div class="row sp"><div><b>'+s.emoji+' '+s.name+'</b><div class="big" style="font-size:19px;color:var(--tx)">'+p.toLocaleString()+'원 <span class="'+(ch>=0?'up':'dn')+'" style="font-size:13px">'+(ch>=0?'▲':'▼')+Math.abs(ch*100).toFixed(1)+'%</span></div></div>'+spark(s.id)+'</div>'
 +(tip?'<div style="margin:4px 0">'+tip+'</div>':'')
 +(h?'<div class="mut">보유 '+h.q.toLocaleString()+'주 · 평가 '+won(hv)+' · <span class="'+(pl>=0?'up':'dn')+'">'+(pl>=0?'+':'')+(pl*100).toFixed(1)+'%</span></div>':'')
 +'<div class="row" style="margin-top:6px"><input type="number" min="1" data-q="'+s.id+'" value="'+(S.q[s.id]||1)+'">'
 +'<button class="buy" data-a="buy" data-id="'+s.id+'">매수</button><button class="sell" data-a="sell" data-id="'+s.id+'">매도</button>'
 +'<button data-a="maxbuy" data-id="'+s.id+'">최대매수('+maxBuy(s.id).toLocaleString()+')</button>'+(h?'<button data-a="maxsell" data-id="'+s.id+'">전량</button>':'')+'</div></div>'
}
function render(){
 const app=$('app');
 if(!S){
  app.innerHTML='<h1>💰 1998 꼬마 투자왕</h1><div class="card"><p>1998년 1월, IMF 외환위기가 한창인 대한민국. 설날 세뱃돈 <b class="up">3만원</b>으로 증권계좌를 연 11살 꼬마.<br>한 턴은 <b>한 달</b>. 실제 코스피와 종목의 흐름(근사치)을 따라 2025년까지 28년을 살아남아 <b>부자</b>가 되어보자!</p><p class="mut">※ 주가는 실제 역사적 흐름을 바탕으로 한 근사치이며, 구간 사이 값은 보간했습니다. 게임이며 투자 조언이 아닙니다.</p><p>이름</p><input class="name" id="nm" value="나" maxlength="10"><div style="margin-top:12px" class="row"><button class="pri" data-a="start">1998년으로 출발 🚀</button></div></div>';
  return;
 }
 const {y,m}=ymOf(S.t),total=nw(),r=rank(total),age=ageOf(S.t);
 if(S.over){
  const kp=30000*kospi[N-1]/kospi[0];
  app.innerHTML='<h1>🏁 엔딩 — '+S.name+'의 28년</h1><div class="card"><div class="mut">2025년 12월 최종 자산</div><div class="big">'+won(total)+'</div><p>칭호: <b>'+TITLES[r][1]+'</b></p><p>쓴 돈 빼고 모은 원금(용돈·알바·월급 저축 합계): '+won(S.contrib)+'<br>순수 투자 증식: <b>'+won(total-S.contrib)+'</b></p><p>30,000원을 코스피 지수에 가만히 넣어뒀다면 → '+won(kp)+' (코스피 '+kospi[0]+' → '+kospi[N-1]+')</p>'+chart()+'<div class="row" style="margin-top:12px"><button class="pri" data-a="restart">다시 도전</button></div></div>';
  return;
 }
 const kc=S.t>0?kospi[S.t]/kospi[S.t-1]-1:0;
 let html='<h1>💰 1998 꼬마 투자왕</h1>'
 +'<div class="card"><div class="row sp"><div><span class="tag">'+y+'년 '+m+'월</span> <span class="tag">'+S.name+' · '+age+'세 '+stage(S.t)+'</span></div><span class="tag">Lv.'+(r+1)+' '+TITLES[r][1]+'</span></div>'
 +'<div class="big" style="margin-top:8px">'+won(total)+'</div>'
 +'<div class="mut">현금 '+won(S.cash)+' · 예금 '+won(S.dep)+' · 주식 '+won(holdVal())+'</div>'
 +'<div class="mut" style="margin-top:4px">코스피 <b>'+kospi[S.t].toLocaleString()+'</b> <span class="'+(kc>=0?'up':'dn')+'">'+(kc>=0?'▲':'▼')+Math.abs(kc*100).toFixed(1)+'%</span> · 예금금리 연 '+(RATE[y]||2)+'%</div>'
 +'<div class="grid2" style="margin-top:10px"><div><div class="mut">🧠 분석력 '+S.int+'</div><div class="bar"><i style="width:'+S.int+'%;background:var(--dn)"></i></div></div><div><div class="mut">💚 멘탈 '+S.mental+'</div><div class="bar"><i style="width:'+Math.max(0,S.mental)+'%;background:var(--ok)"></i></div></div></div></div>';
 html+='<div class="card"><b>📅 이달의 소식</b>';
 const hv=HIST[y*100+m];
 if(S.log.length)S.log.forEach(e=>html+='<div class="ev '+(e.r?'r':'')+'">'+e.txt+'</div>');
 else html+='<div class="ev">'+(hv||'큰 사건은 없는 평범한 한 달.')+'</div>';
 html+='</div>';
 html+='<div class="card"><b>이번 달 행동 (한 번)</b><div class="row" style="margin-top:8px"><button data-a="read" '+(S.acted?'disabled':'')+'>📰 경제신문 읽기</button><button data-a="work" '+(S.acted?'disabled':'')+'>💪 '+WORKNAME(S.t)+' (+'+won(workPay(S.t))+')</button><button data-a="rest" '+(S.acted?'disabled':'')+'>😴 쉬기</button></div><div class="mut" style="margin-top:6px">신문을 읽으면 분석력이 오르고 종목 전망(실제 다음 달 방향에 정확도 확률 적용)을 볼 수 있어요. 매달 용돈/월급 '+won(income(S.t))+' 자동 입금.'+(S.locked?' <b class="up">⚠ 멘탈 붕괴로 거래 불가</b>':'')+'</div></div>';
 html+='<div class="card"><b>📈 종목 시장</b> <span class="mut">(수수료 매수 0.3% / 매도 0.5%)</span>'+STOCKS.map(stockRow).join('')+'</div>';
 html+='<div class="card"><b>🏦 은행 예금</b> <span class="mut">(연 '+(RATE[y]||2)+'%, 안전자산)</span><div class="row" style="margin-top:8px"><input type="number" min="1" id="dq" value="'+(S.dq||10000)+'"><button data-a="dep">입금</button><button data-a="wd">출금</button><button data-a="depall">현금 전액 입금</button></div></div>';
 html+='<div class="card">'+chart()+'</div>';
 html+='<div class="card"><div class="row"><button class="pri" data-a="next">▶ 다음 달로</button><button data-a="skip3">3개월 건너뛰기</button><button data-a="skip12">1년 건너뛰기</button><button data-a="restart" style="margin-left:auto">처음부터</button></div></div>';
 if(S.msg)html+='<div class="toast">'+S.msg+'</div>';
 app.innerHTML=html;
}
document.addEventListener('input',e=>{const q=e.target.getAttribute&&e.target.getAttribute('data-q');if(q)S.q[q]=e.target.value;if(e.target.id==='dq')S.dq=e.target.value});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='start'){newGame($('nm').value.trim());return render()}
 if(a==='restart'){if(S.over||confirm('처음부터 다시 시작할까요?')){try{localStorage.removeItem(KEY)}catch(x){}S=null;return render()}return}
 if(!S)return;
 if(a==='buy')return buy(id);
 if(a==='sell')return sell(id);
 if(a==='maxbuy'){S.q[id]=Math.max(1,maxBuy(id));return render()}
 if(a==='maxsell'){S.q[id]=S.h[id]?S.h[id].q:1;return render()}
 if(a==='read'||a==='work'||a==='rest'){act(a);return render()}
 if(a==='dep'||a==='wd'||a==='depall'){
  let v=Math.floor(parseInt(S.dq)||0);if(a==='depall')v=S.cash;
  if(a==='wd'){v=Math.min(v,S.dep);S.dep-=v;S.cash+=v}else{if(v>S.cash)return toast('현금이 부족해!');S.cash-=v;S.dep+=v}
  save();return toast((a==='wd'?'출금 ':'입금 ')+won(v));
 }
 if(a==='next'){advance();return render()}
 if(a==='skip3')return skip(3);
 if(a==='skip12')return skip(12);
});
S=load();render();
</script>
</body>
</html>
