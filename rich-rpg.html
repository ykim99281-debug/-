<style>
:root{--bg:#0e1424;--card:#172038;--card2:#1e2a4a;--tx:#e8ecf8;--mut:#8b97b8;--up:#ff5b6e;--dn:#4f9dff;--gold:#ffd24a;--ok:#46d39a;--line:#2a375c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.45}
#app{max-width:760px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:800;color:var(--gold)}
.up{color:var(--up)}.dn{color:var(--dn)}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--gold);color:#241a00;font-weight:800;border-color:var(--gold)}
button.buy{background:#5a1f2a;border-color:var(--up)}
button.sell{background:#1c3560;border-color:var(--dn)}
input{background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;width:90px;font-family:inherit}
select{background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;width:100%;font-family:inherit}
input.name{width:100%;font-size:16px}
.bar{height:8px;background:#0b1020;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%}
.stock{border-top:1px solid var(--line);padding:10px 0}
.stock:first-child{border-top:0}
.ev{background:var(--card2);border-left:4px solid var(--gold);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.ev.r{border-color:var(--ok)}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
svg{display:block}
</style>

  app.innerHTML='<h1>🏁 엔딩 — '+S.name+'의 '+(2026-ymOf(S.t0).y)+'년</h1><div class="card"><div class="mut">2025년 12월 최종 자산</div><div class="big">'+won(total)+'</div><p>칭호: <b>'+TITLES[r][1]+'</b> · 업적 '+Object.keys(S.ach).length+'/'+ACH.length+'개</p><p>🧾 낸 세금 합계 <b>'+won(totalTax())+'</b> · 난이도 '+D().name+' · '+ymOf(S.t0).y+'년 시작</p><p>쓴 돈 빼고 모은 원금(용돈·알바·월급 저축 합계): '+won(S.contrib)+'<br>저축 대비 증감(결혼·양육비·대출이자 포함): <b>'+won(total-S.contrib)+'</b></p><p>30,000원을 코스피 지수에 가만히 넣어뒀다면 → '+won(kp)+' (코스피 '+kospi[S.t0]+' → '+kospi[N-1]+')</p><p>💴 물가 반영: 최종 자산은 '+ymOf(S.t0).y+'년 원화로 약 <b>'+won(total*100/cpiR(N-1))+'</b>. 처음의 3만원은 2025년 가치로 약 '+won(30000*cpiR(N-1)/100)+'이었고, 짜장면 한 그릇은 '+won(JJ(S.t0))+' → '+won(JJ(N-1))+'가 되었다.</p>'+chart()+'<div class="row" style="margin-top:12px"><button class="pri" data-a="restart">다시 도전</button></div></div>';
  return;
 }
 const kc=S.t>0?kospi[S.t]/kospi[S.t-1]-1:0;
 let html='<h1>💰 꼬마 투자왕 RPG</h1>'
 +'<div class="card"><div class="row sp"><div><span class="tag">'+y+'년 '+m+'월</span> <span class="tag">'+S.name+' · '+age+'세 '+(S.army>0?'군인 🪖':stage(S.t))+(S.married?' 💍':'')+'👶'.repeat(S.kids||0)+'</span></div><span class="tag">'+D().name+'</span> <span class="tag">Lv.'+(r+1)+' '+TITLES[r][1]+'</span></div>'
 +'<div class="big" style="margin-top:8px">'+won(total)+'</div>'
 +'<div class="mut">현금 '+won(S.cash)+' · 예금 '+won(S.dep)+' · 주식 '+won(holdVal())+(altVal()?' · 금·달러·코인 '+won(altVal()):'')+(propVal()?' · 부동산 '+won(propVal()):'')+(S.co?' · 회사지분 '+won(coVal()):'')+(S.loan?' · <span class="up">대출 -'+won(S.loan)+'</span>':'')+'</div>'
 +'<div class="mut" style="margin-top:4px">코스피 <b>'+kospi[S.t].toLocaleString()+'</b> <span class="'+(kc>=0?'up':'dn')+'">'+(kc>=0?'▲':'▼')+Math.abs(kc*100).toFixed(1)+'%</span> · 예금금리 연 '+(RATE[y]||2)+'%</div>'
 +'<div class="mut" style="margin-top:2px">💴 물가지수 '+cpiR(S.t).toFixed(0)+' ('+ymOf(S.t0).y+'.1=100) · '+ymOf(S.t0).y+'년 원화로 환산한 내 자산 <b>'+won(total*100/cpiR(S.t))+'</b> · 짜장면 '+won(JJ(S.t))+' · 최저시급 '+won(MW[y])+'</div>'
 +'<div class="grid2" style="margin-top:10px"><div><div class="mut">🧠 분석력 '+S.int+'</div><div class="bar"><i style="width:'+S.int+'%;background:var(--dn)"></i></div></div><div><div class="mut">💚 멘탈 '+S.mental+'</div><div class="bar"><i style="width:'+Math.max(0,S.mental)+'%;background:var(--ok)"></i></div></div><div><div class="mut">🤝 인맥 '+netStat()+'</div><div class="bar"><i style="width:'+netStat()+'%;background:var(--gold)"></i></div></div></div></div>';
 html+='<div class="card"><b>📅 이달의 소식</b>';
 const hv=HIST[y*100+m];
 if(S.log.length)S.log.forEach(e=>html+='<div class="ev '+(e.r?'r':'')+'">'+e.txt+'</div>');
 else html+='<div class="ev">'+(hv||'큰 사건은 없는 평범한 한 달.')+'</div>';
 html+='</div>';
 html+='<div class="card"><b>이번 달 행동 (한 번)</b><div class="row" style="margin-top:8px"><button data-a="read" '+(S.acted?'disabled':'')+'>📰 경제신문 읽기</button><button data-a="work" '+(S.acted?'disabled':'')+'>💪 '+WORKNAME(S.t)+' (+'+won(workPay(S.t))+')</button><button data-a="rest" '+(S.acted?'disabled':'')+'>😴 쉬기</button></div><div class="mut" style="margin-top:6px">신문을 읽으면 분석력이 오르고 종목 전망(실제 다음 달 방향에 정확도 확률 적용)을 볼 수 있어요. 매달 용돈/월급 '+won(income(S.t))+' 자동 입금.'+(S.locked?' <b class="up">⚠ 멘탈 붕괴로 거래 불가</b>':'')+'</div></div>';
 html+=tabBar()+tabBody();
 
 html+='<div class="card">'+chart()+'</div>';
 html+='<div class="card"><div class="row"><button class="pri" data-a="next">▶ 다음 달로</button><button data-a="skip3">3개월 건너뛰기</button><button data-a="skip12">1년 건너뛰기</button>'+installBtn()+'<button data-a="restart" style="margin-left:auto">처음부터</button></div></div>';
 if(S.msg)html+='<div class="toast">'+S.msg+'</div>';
 app.innerHTML=html;
}
document.addEventListener('input',e=>{const q=e.target.getAttribute&&e.target.getAttribute('data-q');if(q)S.q[q]=e.target.value;if(e.target.id==='dq')S.dq=e.target.value;if(e.target.id==='cq')S.cq=e.target.value});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='install')return install();
 if(a==='start'){newGame($('nm').value.trim(),+$('sy').value,$('df').value);return render()}
 if(a==='restart'){if(S.over||confirm('처음부터 다시 시작할까요?')){try{localStorage.removeItem(KEY)}catch(x){}S=null;return render()}return}
 if(!S)return;
 if(a==='buy')return buy(id);
 if(a==='sell')return sell(id);
 if(a==='maxbuy'){S.q[id]=Math.max(1,maxBuy(id));return render()}
 if(a==='maxsell'){S.q[id]=S.h[id]?S.h[id].q:1;return render()}
 if(a==='read'||a==='work'||a==='rest'){act(a);return render()}
 if(a==='dep'||a==='wd'||a==='depall'){
  let v=Math.floor(parseInt(S.dq)||0);if(a==='depall')v=S.cash;
  if(a==='wd'){v=Math.min(v,S.dep);S.dep-=v;S.cash+=v}else{if(v>S.cash)return toast('현금이 부족해!');S.cash-=v;S.dep+=v}
  save();return toast((a==='wd'?'출금 ':'입금 ')+won(v));
 }
 if(a==='buya')return altBuy(id);
 if(a==='sella')return altSell(id);
 if(a==='maxbuya'){S.q[id]=Math.max(1,Math.floor(S.cash));return render()}
 if(a==='maxsella'){S.q[id]=S.alt[id]?Math.ceil(S.alt[id].q*price(id)):1;return render()}
 if(a==='tab'){S.tab=id;save();return render()}
 if(a==='buyp')return buyProp(id);
 if(a==='sellp')return sellProp(id);
 if(a==='loantoggle'){S.useLoan=!S.useLoan;save();return render()}
 if(a==='repay'){const v=Math.min(S.cash,S.loan);S.cash-=v;S.loan-=v;save();return toast('대출 상환 '+won(v))}
 if(a==='meet')return meet(id);
 if(a==='found')return found(id);
 if(a==='hire')return hire();
 if(a==='coinv')return coInvest();
 if(a==='cosell')return coSell();
 if(a==='ipo')return coIpo();
 if(a==='next'){advance();return render()}
 if(a==='skip3')return skip(3);
 if(a==='skip12')return skip(12);
});
S=load();render();
</script>
</body>
</html>
