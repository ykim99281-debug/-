<div class="box" id="feedBox" data-guest="1">
<h3>💬 의견 보내기</h3>
<p class="small">버그, 아이디어, 하고 싶은 말을 보내 주세요. 만든 사람이 읽고 업데이트에 반영해요. (개인정보는 적지 마세요)</p>
<select id="fbCat"><option value="bug">🐞 버그·이상한 점</option><option value="idea">💡 이런 게 있으면 좋겠어요</option><option value="etc">💬 기타</option></select>
<textarea id="fbMsg" maxlength="400" rows="4" placeholder="여기에 적어 주세요 (최대 400자)" style="width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px"></textarea>
<button class="green" onclick="sendFeedback()">보내기</button>
</div>
