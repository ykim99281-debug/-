<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>편의점 사장 키우기</title>
<link rel="manifest" href="convenience.webmanifest">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="cvs-icon-192.png">
<link rel="apple-touch-icon" href="cvs-icon-192.png">
<style>
:root{--bg:#0b1020;--card:#232a3b;--card2:#2f384d;--tx:#f5f7fa;--mut:#a0aabf;--pri:#00b06f;--acc:#ffd23f;--red:#e2483b;--blue:#3aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Gotham","Gotham SSm",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#view{position:fixed;inset:0;background:#6fc3ff;touch-action:none}
#gl{width:100%;height:100%;display:block;touch-action:none}
.pn{background:rgba(18,20,28,.62);border:1px solid rgba(255,255,255,.12);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));width:min(290px,64vw);pointer-events:none;padding:8px 10px;z-index:3}
.rank{display:inline-block;background:var(--acc);color:#2a2000;font-weight:800;border-radius:6px;padding:2px 9px;font-size:12px}
.money{font-size:24px;font-weight:900;color:#7dff9a;text-shadow:0 2px 0 #0a3a1a;line-height:1.15;margin-top:4px}
.sub{font-size:11px;color:#e6ebf5}
.bar{height:7px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden;margin:5px 0 2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#00d27f,#3aa0ff);width:0;transition:width .3s}
#lb{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 134px);width:150px;padding:6px 8px;font-size:11px;z-index:3;pointer-events:none}
#lb b{display:block;margin-bottom:3px}#lb div{display:flex;justify-content:space-between;gap:6px;line-height:1.5}#lb .me{color:#ffe066;font-weight:800}#lb span{color:#b8f5c8}
#side{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:3}
#side button{width:46px;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(18,20,28,.62);font-size:20px;color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
#side button:active{transform:scale(.94)}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);z-index:3;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px #0006}
#acts{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;z-index:3}
#acts button{border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#jump{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.25);font-size:26px}
#tap{width:92px;height:92px;border-radius:50%;background:linear-gradient(180deg,#34d46f,#14a13d);font-size:13px;line-height:1.25}
#acts button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#hint{position:fixed;left:50%;bottom:max(172px,calc(env(safe-area-inset-bottom) + 160px));transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;text-align:center;width:90vw;z-index:2;transition:opacity 1s}
#log{position:fixed;left:50%;top:92px;transform:translateX(-50%);font-size:13px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:99px;padding:4px 12px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;z-index:3}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:22px;color:#7dff9a;animation:fl 1s forwards;text-shadow:0 2px 0 #0a3a1a;z-index:6}
@keyframes fl{to{transform:translateY(-80px) scale(1.2);opacity:0}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1020;font-weight:800;z-index:50;transition:opacity .5s}
#nogl{display:none;position:fixed;inset:0;padding:60px 24px;text-align:center;font-size:14px;color:var(--mut);background:var(--bg);z-index:1}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:72vh;background:#171c2b;border-radius:18px 18px 0 0;z-index:15;display:none;flex-direction:column;box-shadow:0 -10px 40px #000a;border:1px solid rgba(255,255,255,.1)}
#sheet.open{display:flex}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;font-weight:900}
.shead button{border:0;background:var(--card2);color:#fff;width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
.tabs{display:flex;gap:5px;margin:10px 12px}
.tabs button{flex:1;padding:9px 0;white-space:nowrap;border:0;border-radius:8px;background:var(--card);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#06233d}
#list{overflow:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.item .ic{font-size:28px;width:38px;text-align:center}
.item .in{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.item button{border:0;border-radius:8px;padding:8px 10px;font-weight:900;font-size:12px;background:var(--pri);color:#fff;cursor:pointer;min-width:84px}
.item button:disabled{background:var(--card2);color:#64748b}
.stats{background:var(--card);border-radius:10px;padding:12px;font-size:13px;line-height:1.9}
.btn2{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer}
.prest{background:linear-gradient(90deg,#f59e0b,#e2483b);color:#fff}
.reset{background:var(--card2);color:var(--mut)}
.ach{opacity:.45}.ach.done{opacity:1;border:1px solid var(--acc)}
#event{position:fixed;left:50%;bottom:max(180px,calc(env(safe-area-inset-bottom) + 170px));transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;background:#fff;color:#111;border-radius:12px;padding:12px;display:none;z-index:20;box-shadow:0 6px 24px #000a}
#event b{display:block;margin-bottom:8px}
#event .row{display:flex;gap:8px}
#event button{flex:1;padding:10px;border:0;border-radius:8px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff}
#event button.no{background:#e2e8f0;color:#334155}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:30;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div id="view"><canvas id="gl"></canvas></div>
<div id="hud" class="pn">
  <span class="rank" id="rank"></span>
  <div class="money" id="money"></div>
  <div class="sub" id="rate"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="sub" id="progt"></div>
</div>
<div id="lb" class="pn"></div>
<div id="side">
  <button id="menu" aria-label="메뉴">🛒</button>
  <button id="cam" aria-label="시간대">🌗</button>
  <button id="snd" aria-label="소리">🔊</button>
</div>
<div id="hint">조이스틱/WASD로 이동 · 초록 패드를 밟으면 구매! · 계산대 파란 패드를 밟으면 응대</div>
<div id="log"></div>
<div id="joy"><i id="knob"></i></div>
<div id="acts"><button id="jump" aria-label="점프">⬆</button><button id="tap">🧾<br>응대</button></div>
<div id="load">🏪 매장 여는 중…</div>
<div id="nogl">이 기기에서는 3D를 표시할 수 없어요. 🛒 메뉴에서 게임은 계속 즐길 수 있어요.</div>
<div id="sheet">
  <div class="shead"><span>🏪 편의점 상점</span><button id="close">✕</button></div>
  <div class="tabs">
    <button data-t="staff" class="on">👥 직원</button>
    <button data-t="goods">📦 상품</button>
    <button data-t="store">🏬 매장</button>
    <button data-t="look">👕 꾸미기</button>
    <button data-t="ach">🏆 업적</button>
    <button data-t="info">📊 정보</button>
  </div>
  <div id="list"></div>
</div>
<div id="event"></div>
<div id="toast"></div>
