 const mult=3+7*clamp(g/2,0,1)+G.brand/40;
 const live=G.products.filter(p=>p.state==='live'),dev=G.products.filter(p=>p.state==='dev');
 let v=G.cash*.9+assets()+(G.fin.dep+G.fin.re+G.fin.stk)*.95+ar*mult+Math.max(0,ap)*6+Object.keys(G.techs).length*6e7+G.brand*2.5e7;
 live.forEach(p=>v+=1.5e8*p.q/70);v+=dev.length*4e7+G.emps.length*4e6-debt();

function roundOffer(k){const R=ROUNDS[k];if(G.rounds[k])return {ok:0,why:'이미 완료'};

 if(R.need&&avgRev3()<R.need)return {ok:0,why:R.d};
 if(k==='ipo'&&!(G.hist.slice(-3).length===3&&G.hist.slice(-3).every(h=>h.profit>0)))return {ok:0,why:'최근 3개월 흑자 필요'};
 const val=Math.max(G.val*R.prem,R.min);if(k==='ipo'&&G.val<R.min/3)return {ok:0,why:'기업가치 부족'};

const slotInfo=i=>{try{const x=JSON.parse(localStorage.getItem(SAVE_KEY+(i>1?'_'+i:''))||'null');return x?x.name+' · '+fmtDate(x.d).slice(0,7):'비어 있음'}catch(e){return '비어 있음'}};
 modalQ=[];modalOpen=true;$('#ov').classList.add('on');
 $('#md').innerHTML='<h2>🏢 스타트업 타이쿤</h2><p class="mu">차고에서 시작해 제품을 만들고, 사람을 뽑고, 투자를 받아 시총 1조 기업을 만드세요.</p>'+
 '<label>회사 이름</label><input type="text" id="nm" value="나의 스타트업" maxlength="14">'+
 '<label>창업자 특기</label><select id="sp"><option value="dev">개발자형 (개발 속도↑)</option><option value="design">디자이너형 (품질↑)</option><option value="sales">영업형 (인지도↑)</option><option value="researcher">연구형 (기술↑)</option></select>'+
 '<label>난이도 (시작 자금)</label><select id="df"><option value="0">쉬움 2.5억</option><option value="1" selected>보통 1.5억</option><option value="2">어려움 8천만</option><option value="3">하드코어 6천만 (적자 1개월 즉시 파산)</option></select>'+
 '<label>저장 슬롯</label><select id="sl">'+[1,2,3].map(i=>'<option value="'+i+'"'+(i===SLOT?' selected':'')+'>슬롯 '+i+' — '+slotInfo(i)+'</option>').join('')+'</select>'+
 '<div class="row"><button class="b" id="go">🚀 창업하기</button>'+'<button class="b g" id="ct">이어하기</button>'+'</div>';
 $('#md').onclick=e=>{
  if(e.target.id==='go'||e.target.id==='ct'){SLOT=+$('#sl').value;try{localStorage.setItem('ct_slot',SLOT)}catch(x){}}
  if(e.target.id==='go'){if(localStorage.getItem(sk())&&!confirm('슬롯 '+SLOT+'의 저장 데이터를 덮어쓸까요?'))return;newGame($('#nm').value.trim()||'나의 스타트업',$('#sp').value,+$('#df').value);begin();}
  else if(e.target.id==='ct'){if(load())begin();else toast('불러오기 실패',1);}};}
function begin(){$('#md').onclick=null;modalOpen=false;$('#ov').classList.remove('on');paused=false;speed=1;dirty=true;render();}
let acc=0,lastT=performance.now();
function loop(now){const dt=now-lastT;lastT=now;
 if(G&&!paused&&!modalOpen&&!G.over){acc+=dt;const step=[0,500,220,90,30][speed];let n=0;
  while(acc>=step&&n<8&&!modalOpen&&!G.over){acc-=step;tickDay();n++;dirty=true;} if(n>=8)acc=0;}
 requestAnimationFrame(loop);}
setInterval(()=>{if(dirty&&!pressed&&G){dirty=false;render();}},250);
document.addEventListener('mousedown',()=>pressed=true);document.addEventListener('mouseup',()=>{pressed=false});
document.addEventListener('touchstart',()=>pressed=true,{passive:true});document.addEventListener('touchend',()=>{pressed=false});
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-sp]');if(s){const v=+s.dataset.sp;if(v===0)paused=true;else{paused=false;speed=v;}render();return;}
 const b=e.target.closest('[data-a]');if(!b||b.disabled||!G)return;const f=ACT[b.dataset.a];if(f){f(b.dataset);render();}});
document.addEventListener('keydown',e=>{if(!G||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.code==='Space'){e.preventDefault();paused=!paused;render();}
 else if(e.key>='1'&&e.key<='4'){paused=false;speed=+e.key;render();}});
window.addEventListener('beforeunload',()=>{if(G&&!G.over)save()});
showStart();requestAnimationFrame(loop);
</script>
</body>
</html>
