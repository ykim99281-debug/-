<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON SURVIVOR</title>
<style>
  :root{--bg:#07070f;--c1:#00f0ff;--c2:#ff2fb3;--c3:#ffe14d;--ui:#cfd8ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ui);touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(ellipse at center,rgba(7,7,15,.55),rgba(7,7,15,.9))}
  .layer.on{display:flex}
  h1{margin:0;font-size:clamp(40px,10vw,84px);letter-spacing:.12em;font-weight:900;color:#fff;text-shadow:0 0 12px var(--c1),0 0 34px var(--c1),0 0 70px var(--c2)}
  h1 span{color:var(--c2);text-shadow:0 0 12px var(--c2),0 0 34px var(--c2)}
  h2{margin:0;font-size:clamp(26px,6vw,44px);letter-spacing:.1em;color:#fff;text-shadow:0 0 18px var(--c1)}
  p{margin:0;opacity:.8;line-height:1.5;max-width:520px}
  .btn{font:inherit;font-weight:800;letter-spacing:.2em;font-size:18px;padding:14px 40px;color:#fff;background:rgba(0,240,255,.08);border:2px solid var(--c1);border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(0,240,255,.5),inset 0 0 18px rgba(0,240,255,.2);transition:.15s}
  .btn:hover,.btn:focus-visible{background:rgba(0,240,255,.25);transform:scale(1.05);outline:none}
  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px}
  .card{width:200px;padding:16px 14px;border-radius:12px;cursor:pointer;background:rgba(15,15,35,.9);border:2px solid var(--cc,#00f0ff);box-shadow:0 0 18px var(--cc,#00f0ff);transition:.15s;text-align:center}
  .card:hover{transform:translateY(-6px) scale(1.04)}
  .card .ic{font-size:34px;filter:drop-shadow(0 0 8px var(--cc))}
  .card b{display:block;margin:6px 0 4px;color:#fff;letter-spacing:.06em}
  .card small{opacity:.75;display:block;line-height:1.4}
  .card i{position:absolute;margin:-12px 0 0 -6px;font-style:normal;font-size:11px;opacity:.5}
  .stats{font-size:18px;line-height:1.8}
  .stats b{color:var(--c3)}
  .hint{font-size:13px;opacity:.55}
  #hud{position:fixed;left:0;right:0;top:0;padding:10px 14px;pointer-events:none;display:none}
  #hud.on{display:block}
  .bar{height:12px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
  .bar>div{height:100%;width:100%;transition:width .12s}
  #hp>div{background:linear-gradient(90deg,#ff2f6b,#ff7a9b)}
  #xp>div{background:linear-gradient(90deg,#00f0ff,#7affd1)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;font-weight:700;letter-spacing:.1em;text-shadow:0 0 8px #000}
  #pauseBtn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:2px 10px;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="bar" id="hp"><div></div></div>
  <div class="bar" id="xp" style="margin-top:5px;height:8px"><div style="width:0"></div></div>
  <div class="row"><span id="lv">LV 1</span><span id="time">0:00</span><span><span id="kills">0</span> ☠ &nbsp;<span id="pauseBtn">⏸</span></span></div>
</div>

<div class="layer on" id="title">
  <h1>NEON <span>SURVIVOR</span></h1>
  <p>끝없이 몰려오는 네온 군단 속에서 살아남으세요.<br>무기는 자동 발사 — 당신은 <b>움직이기만</b> 하면 됩니다.</p>
  <button class="btn" id="startBtn">START</button>
  <div class="hint">이동: WASD / 방향키 / 터치 드래그 · 대시(무적+돌진 피해): SPACE / 마우스 클릭 / 더블탭 · 일시정지: ESC · 최고 기록 <span id="best">0:00</span></div>
</div>

<div class="layer" id="levelup">
  <h2>LEVEL UP!</h2>
  <div class="cards" id="cards"></div>
  <div class="hint">1 / 2 / 3 키로도 선택할 수 있어요</div>
</div>

<div class="layer" id="pause">
  <h2>PAUSED</h2>
  <button class="btn" id="resumeBtn">RESUME</button>
</div>

<div class="layer" id="over">
  <h2 id="overTitle">GAME OVER</h2>
  <div class="stats" id="overStats"></div>
  <button class="btn" id="retryBtn">RETRY</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- util ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let best = 0;
try { best = +localStorage.getItem('neonSurvivorBest') || 0; } catch (e) {}
$('best').textContent = fmt(best);

/* ---------- audio (synth, no assets) ---------- */
let AC = null, master = null, muted = false;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .25; master.connect(AC.destination);
  } catch (e) {}
}
let lastSfx = {};
function sfx(type, f0, f1, dur, vol = .3, gap = 0){
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (gap && lastSfx[f0 + type] && now - lastSfx[f0 + type] < gap) return;
  lastSfx[f0 + type] = now;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, now);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), now + dur);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(.001, now + dur);
  o.connect(g); g.connect(master); o.start(now); o.stop(now + dur);
}
const S = {
  shoot: () => sfx('square', 620, 220, .08, .06, .05),
  hit:   () => sfx('sawtooth', 220, 90, .07, .08, .03),
  kill:  () => sfx('triangle', 440, 120, .14, .12, .03),
  gem:   () => sfx('sine', 900 + Math.random() * 300, 1500, .08, .08, .04),
  hurt:  () => sfx('sawtooth', 160, 40, .3, .3, .1),
  level: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx('square', f, f, .15, .15), i * 70)); },
  nova:  () => sfx('sawtooth', 120, 600, .3, .2),
  boss:  () => { sfx('sawtooth', 80, 40, .9, .4); },
};

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'ShiftLeft') && state === 'play') tryDash();
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (state === 'levelup' && ['Digit1','Digit2','Digit3'].includes(e.code)) pickUpgrade(+e.code.slice(-1) - 1);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { if (state === 'play') togglePause(); });
const joy = { on: false, id: null, sx: 0, sy: 0, x: 0, y: 0 };
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || e.pointerType === 'mouse') return;
  joy.on = true; joy.id = e.pointerId; joy.sx = joy.x = e.clientX; joy.sy = joy.y = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (e.pointerId === joy.id) joy.on = false; };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);

let lastTap = 0;
cv.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse'){ const n = performance.now(); if (n - lastTap < 280) tryDash(); lastTap = n; } else if (state === 'play') tryDash(); });
function tryDash(){
  if (dashCd > 0 || state !== 'play') return;
  dashT = .18; dashCd = 1.1; P.inv = Math.max(P.inv, .3); sfx('sawtooth', 200, 900, .15, .15);
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (joy.on){ ix = joy.x - joy.sx; iy = joy.y - joy.sy; }
  if (!ix && !iy){ ix = Math.cos(P.face); iy = Math.sin(P.face); }
  const m = Math.hypot(ix, iy) || 1; P.dx = ix / m; P.dy = iy / m;
}
/* ---------- game state ---------- */
let state = 'title'; // title | play | levelup | pause | over
let P, enemies, bullets, ebullets, gems, parts, texts, rings;
let combo = 0, comboT = 0, maxCombo = 0, dashT = 0, dashCd = 0, swarmT = 40, pickups = [], hitstop = 0, chainT = 0, missT = 0, bolts = [], missiles = [];
let t, kills, spawnT, bossT, shake, cam, flashT, orbAngle, novaT, fireT, offered, bossAlive;

const ENEMY = {
  grunt:  { r: 11, hp: 14,  spd: 62,  dmg: 8,  col: '#ff2fb3', xp: 1, sides: 3 },
  dart:   { r: 8,  hp: 8,   spd: 130, dmg: 6,  col: '#ffe14d', xp: 1, sides: 4 },
  tank:   { r: 20, hp: 70,  spd: 38,  dmg: 16, col: '#ff7a2f', xp: 4, sides: 6 },
  split:  { r: 14, hp: 26,  spd: 55,  dmg: 10, col: '#8a5bff', xp: 2, sides: 5 },
  shooter:{ r: 12, hp: 22,  spd: 70,  dmg: 8,  col: '#4dff88', xp: 3, sides: 5 },
  charger:{ r: 15, hp: 40,  spd: 50,  dmg: 18, col: '#ff4d4d', xp: 3, sides: 4 },
  mini:   { r: 7,  hp: 6,   spd: 95,  dmg: 5,  col: '#b69bff', xp: 0, sides: 3 },
  boss:   { r: 46, hp: 900, spd: 42,  dmg: 25, col: '#ff2f6b', xp: 40, sides: 8 },
};

function reset(){
  P = { x: 0, y: 0, vx: 0, vy: 0, r: 10, hp: 100, maxhp: 100, speed: 190, magnet: 90, regen: 0,
        lvl: 1, xp: 0, next: 4, dmgMul: 1, inv: 0, face: 0,
        bolt: { rate: 0, count: 1, pierce: 0 }, blades: 0, nova: 0, chain: 0, missile: 0 };
  enemies = []; bullets = []; ebullets = []; gems = []; parts = []; texts = []; rings = [];
  combo = 0; comboT = 0; maxCombo = 0; dashT = 0; dashCd = 0; swarmT = 40; pickups = []; hitstop = 0; chainT = 1; missT = 2; bolts = []; missiles = [];
  t = 0; kills = 0; spawnT = 0; bossT = 90; shake = 0; flashT = 0; orbAngle = 0; novaT = 2; fireT = 0; bossAlive = false;
  cam = { x: 0, y: 0 };
  updateHUD();
}

function startGame(){
  initAudio(); reset();
  ['title','over','pause','levelup'].forEach(id => $(id).classList.remove('on'));
  $('hud').classList.add('on');
  state = 'play';
}
function togglePause(){
  if (state === 'play') { state = 'pause'; $('pause').classList.add('on'); }
  else if (state === 'pause') { state = 'play'; $('pause').classList.remove('on'); last = performance.now(); }
}
$('startBtn').onclick = startGame; $('retryBtn').onclick = startGame;
$('resumeBtn').onclick = togglePause; $('pauseBtn').onclick = togglePause;

/* ---------- upgrades ---------- */
const UPG = [
  { id: 'rate',   ic: '⚡', col: '#00f0ff', name: 'OVERCLOCK',   desc: '발사 속도 +20%',           max: 6, ok: () => true,         fn: () => P.bolt.rate++ },
  { id: 'multi',  ic: '✦',  col: '#00f0ff', name: 'MULTISHOT',   desc: '탄환 +1',                  max: 5, ok: () => true,         fn: () => P.bolt.count++ },
  { id: 'pierce', ic: '➶',  col: '#00f0ff', name: 'PIERCING',    desc: '탄환이 적 1명 더 관통',     max: 4, ok: () => true,         fn: () => P.bolt.pierce++ },
  { id: 'dmg',    ic: '💥', col: '#ffe14d', name: 'HI-YIELD',    desc: '모든 피해량 +25%',          max: 8, ok: () => true,         fn: () => P.dmgMul += .25 },
  { id: 'blade',  ic: '✴',  col: '#ff2fb3', name: 'ORBIT BLADES',desc: '몸 주위를 도는 칼날 +1',    max: 6, ok: () => true,         fn: () => P.blades++ },
  { id: 'nova',   ic: '◎',  col: '#8a5bff', name: 'PULSE NOVA',  desc: '주기적 충격파 (강화 시 더 빠르고 넓게)', max: 5, ok: () => true, fn: () => P.nova++ },
  { id: 'chain',  ic: '⚡', col: '#ffe14d', name: 'CHAIN LIGHTNING', desc: '번개가 적 사이를 튀며 연쇄 (강화 시 더 많이 튐)', max: 5, ok: () => true, fn: () => P.chain++ },
  { id: 'missile',ic: '🚀', col: '#ff7a2f', name: 'HOMING MISSILES', desc: '유도 미사일 발사 후 범위 폭발', max: 5, ok: () => true, fn: () => P.missile++ },
  { id: 'speed',  ic: '»',  col: '#7affd1', name: 'THRUSTERS',   desc: '이동 속도 +12%',            max: 5, ok: () => true,         fn: () => P.speed *= 1.12 },
  { id: 'hp',     ic: '♥',  col: '#ff2f6b', name: 'ARMOR CORE',  desc: '최대 체력 +30, 전체 회복',   max: 6, ok: () => true,         fn: () => { P.maxhp += 30; P.hp = P.maxhp; } },
  { id: 'magnet', ic: '◉',  col: '#7affd1', name: 'MAGNET',      desc: '경험치 흡수 범위 +40%',      max: 5, ok: () => true,         fn: () => P.magnet *= 1.4 },
  { id: 'regen',  ic: '✚',  col: '#ff7a9b', name: 'NANOBOTS',    desc: '초당 체력 +1.2 회복',        max: 5, ok: () => true,         fn: () => P.regen += 1.2 },
];
const taken = {};
function levelOf(id){ return taken[id] || 0; }

function openLevelUp(){
  state = 'levelup'; S.level();
  const pool = UPG.filter(u => levelOf(u.id) < u.max);
  offered = [];
  while (offered.length < 3 && pool.length) offered.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  const box = $('cards'); box.innerHTML = '';
  offered.forEach((u, i) => {
    const d = document.createElement('div'); d.className = 'card'; d.style.setProperty('--cc', u.col);
    d.innerHTML = `<i>${i + 1}</i><div class="ic">${u.ic}</div><b>${u.name}</b><small>${u.desc}</small><small style="margin-top:6px;color:${u.col}">Lv ${levelOf(u.id)} → ${levelOf(u.id) + 1}</small>`;
    d.onclick = () => pickUpgrade(i);
    box.appendChild(d);
  });
  $('levelup').classList.add('on');
}
function pickUpgrade(i){
  const u = offered && offered[i]; if (!u || state !== 'levelup') return;
  u.fn(); taken[u.id] = levelOf(u.id) + 1;
  $('levelup').classList.remove('on'); state = 'play'; last = performance.now();
  ring(P.x, P.y, 70, u.col); updateHUD();
}
const _reset = reset;
reset = function(){ for (const k in taken) delete taken[k]; _reset(); };

/* ---------- spawning ---------- */
function spawnEnemy(kind){
  const d = ENEMY[kind], a = Math.random() * TAU, dist = Math.hypot(W, H) / 2 + 60;
  const hpMul = 1 + t / 60 * .3;
  enemies.push({ kind, x: P.x + Math.cos(a) * dist, y: P.y + Math.sin(a) * dist, r: d.r,
    hp: d.hp * hpMul * (kind === 'boss' ? 1 + t / 200 : 1), mhp: 0, spd: d.spd * (1 + Math.min(t / 600, .5)) * rnd(.92, 1.08),
    dmg: d.dmg, col: d.col, xp: d.xp, sides: d.sides, flash: 0, rot: rnd(0, TAU), kx: 0, ky: 0, shootT: 2 });
  const e = enemies[enemies.length - 1]; e.mhp = e.hp;
}
function pickKind(){
  const r = Math.random();
  if (t < 15) return r < .8 ? 'grunt' : 'dart';
  if (t < 45) return r < .55 ? 'grunt' : r < .8 ? 'dart' : r < .92 ? 'shooter' : 'split';
  if (t < 90) return r < .4 ? 'grunt' : r < .6 ? 'dart' : r < .75 ? 'shooter' : r < .88 ? 'charger' : 'split';
  if (t < 120) return r < .5 ? 'grunt' : r < .75 ? 'dart' : r < .9 ? 'split' : 'tank';
  return r < .25 ? 'grunt' : r < .45 ? 'dart' : r < .6 ? 'shooter' : r < .75 ? 'charger' : r < .9 ? 'split' : 'tank';
}

/* ---------- fx ---------- */
function burst(x, y, col, n, spd = 160, life = .5){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = rnd(.2, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.5, 1) * life, max: life, col, sz: rnd(1.5, 3.5) });
  }
}
function ring(x, y, r, col){ rings.push({ x, y, r: 0, mr: r, col, life: .4, max: .4 }); }
function text(x, y, s, col = '#fff'){ texts.push({ x: x + rnd(-8, 8), y, s, col, life: .6 }); }

function damageEnemy(e, dmg, kx = 0, ky = 0){
  dmg *= P.dmgMul * (1 + Math.min(combo, 100) * .005);
  e.hp -= dmg; e.flash = .08; e.kx += kx; e.ky += ky;
  text(e.x, e.y - e.r, Math.round(dmg), '#fff'); S.hit();
  if (e.hp <= 0 && !e.dead){
    e.dead = true; kills++; S.kill();
    combo++; comboT = 2.2; maxCombo = Math.max(maxCombo, combo);
    if (combo % 25 === 0){ text(P.x, P.y - 40, combo + ' COMBO!', '#ffe14d'); ring(P.x, P.y, 160, '#ffe14d'); shake = Math.max(shake, 5); }
    if (Math.random() < (e.kind === 'boss' ? 0 : .02)) pickups.push({ x: e.x, y: e.y, type: ['heal', 'bomb', 'magnet'][(Math.random() * 3) | 0], life: 14 });
    burst(e.x, e.y, e.col, e.kind === 'boss' ? 60 : 12, e.kind === 'boss' ? 400 : 170);
    ring(e.x, e.y, e.r * 2.5, e.col);
    if (e.kind === 'split') for (let i = 0; i < 3; i++){ spawnEnemy('mini'); const m = enemies[enemies.length - 1]; m.x = e.x + rnd(-10, 10); m.y = e.y + rnd(-10, 10); }
    if (e.xp > 0) dropGem(e.x, e.y, e.xp);
    if (e.kind === 'boss'){ bossAlive = false; shake = 18; hitstop = .25; P.hp = Math.min(P.maxhp, P.hp + 40); for (let i = 0; i < 10; i++) dropGem(e.x + rnd(-50, 50), e.y + rnd(-50, 50), 4); }
  }
}
function dropGem(x, y, v){ gems.push({ x, y, v, vx: rnd(-40, 40), vy: rnd(-40, 40), pulled: false }); }
function hurtPlayer(d){
  if (P.inv > 0 || dashT > 0) return;
  P.hp -= d; P.inv = .5; combo = Math.floor(combo / 2); shake = Math.max(shake, 8); flashT = .18; S.hurt();
  burst(P.x, P.y, '#ff2f6b', 14, 200);
  if (P.hp <= 0) gameOver();
}
function gameOver(){
  state = 'over'; $('hud').classList.remove('on');
  const nb = t > best;
  if (nb){ best = t; try { localStorage.setItem('neonSurvivorBest', String(t)); } catch (e) {} }
  $('best').textContent = fmt(best);
  $('overTitle').textContent = nb ? 'NEW RECORD!' : 'GAME OVER';
  $('overStats').innerHTML = `생존 시간 <b>${fmt(t)}</b><br>최대 콤보 <b>${maxCombo}</b><br>처치 <b>${kills}</b> · 레벨 <b>${P.lvl}</b><br>최고 기록 <b>${fmt(best)}</b>`;
  setTimeout(() => $('over').classList.add('on'), 700);
}
function updateHUD(){
  $('hp').firstElementChild.style.width = clamp(P.hp / P.maxhp * 100, 0, 100) + '%';
  $('xp').firstElementChild.style.width = clamp(P.xp / P.next * 100, 0, 100) + '%';
  $('lv').textContent = 'LV ' + P.lvl;
  $('kills').textContent = kills;
  $('time').textContent = fmt(t);
}

/* ---------- update ---------- */
function nearest(x, y, maxD = 1e9){
  let b = null, bd = maxD * maxD;
  for (const e of enemies){ const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd){ bd = d; b = e; } }
  return b;
}

function update(dt){
  t += dt;
  // movement
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  if (m > .1) P.face = Math.atan2(iy, ix);

  if (Math.random() < .5 && m > .1) parts.push({ x: P.x - ix * 8, y: P.y - iy * 8, vx: -ix * 30, vy: -iy * 30, life: .3, max: .3, col: '#00f0ff', sz: 2 });

  spawnT -= dt;
  if (spawnT <= 0 && enemies.length < 420){
    const n = 2 + Math.floor(t / 18);
    for (let i = 0; i < n; i++) spawnEnemy(pickKind());
    spawnT = Math.max(.1, .5 - t * .003);
  }
  bossT -= dt;
  if (bossT <= 0){ bossT = 90; bossAlive = true; spawnEnemy('boss'); S.boss(); shake = 12; text(P.x, P.y - 60, '⚠ BOSS ⚠', '#ff2f6b'); }

  // weapon: bolt
  fireT -= dt;
  const cd = .65 * Math.pow(.8, P.bolt.rate);
  if (fireT <= 0){
    const tg = nearest(P.x, P.y, 520);
    if (tg){
      fireT = cd;
      const base = Math.atan2(tg.y - P.y, tg.x - P.x), n = P.bolt.count, spread = .16;
      for (let i = 0; i < n; i++){
        const a = base + (i - (n - 1) / 2) * spread;
        bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 1.1, pierce: P.bolt.pierce, dmg: 9, hit: new Set() });
      }
      S.shoot();
    }
  }

  const blades = [];
  for (let i = 0; i < P.blades; i++){
    const a = orbAngle + i / P.blades * TAU, rr = 62;
    blades.push({ x: P.x + Math.cos(a) * rr, y: P.y + Math.sin(a) * rr, a });
  }
  // weapon: nova
  if (P.nova > 0){
    novaT -= dt;
    if (novaT <= 0){
      novaT = Math.max(1.6, 4.2 - P.nova * .5);
      const R = 120 + P.nova * 28; S.nova(); ring(P.x, P.y, R, '#8a5bff'); shake = Math.max(shake, 4);
      for (const e of enemies){ const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < R + e.r){ const k = 260 / Math.max(d, 1); damageEnemy(e, 14 + P.nova * 6, (e.x - P.x) * k, (e.y - P.y) * k); } }
    }
  }

  // weapon: chain lightning
  if (P.chain > 0){
    chainT -= dt;
    if (chainT <= 0){
      const tg = nearest(P.x, P.y, 420);
      if (tg){
        chainT = Math.max(.7, 1.9 - P.chain * .25); S.nova();
        let cur = tg, from = { x: P.x, y: P.y }, left = 3 + P.chain * 2; const hit = new Set(), path = [from];
        while (cur && left-- > 0){
          hit.add(cur); path.push({ x: cur.x, y: cur.y }); damageEnemy(cur, 16);
          let nx = null, nd = 190 * 190;
          for (const o of enemies) if (!hit.has(o) && !o.dead){ const d = (o.x - cur.x) ** 2 + (o.y - cur.y) ** 2; if (d < nd){ nd = d; nx = o; } }

        }
        bolts.push({ path, life: .18 });
      }
    }
  }
  // weapon: missiles
  if (P.missile > 0){
    missT -= dt;
    if (missT <= 0){
      missT = Math.max(1, 2.8 - P.missile * .3);
      for (let i = 0; i < P.missile + 1; i++){ const a = rnd(0, TAU); missiles.push({ x: P.x, y: P.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 2.5, tg: null }); }
    }
  }
  for (const m of missiles){
    if (!m.tg || m.tg.dead) m.tg = nearest(m.x, m.y, 700);
    if (m.tg){ const a = Math.atan2(m.vy, m.vx), ta = Math.atan2(m.tg.y - m.y, m.tg.x - m.x); let da = ta - a; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU; const na = a + clamp(da, -dt * 6, dt * 6); m.vx = Math.cos(na) * 380; m.vy = Math.sin(na) * 380; }
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt;
    parts.push({ x: m.x, y: m.y, vx: 0, vy: 0, life: .3, max: .3, col: '#ff7a2f', sz: 3 });
    let boom = m.life <= 0;
    for (const e of enemies) if (!e.dead && (e.x - m.x) ** 2 + (e.y - m.y) ** 2 < (e.r + 7) ** 2){ boom = true; break; }
    if (boom){
      m.life = 0; const R = 70 + P.missile * 8; ring(m.x, m.y, R, '#ff7a2f'); burst(m.x, m.y, '#ff7a2f', 16, 220); sfx('sawtooth', 140, 40, .25, .15, .04);
      for (const e of enemies) if (!e.dead && Math.hypot(e.x - m.x, e.y - m.y) < R + e.r) damageEnemy(e, 22 + P.missile * 5, (e.x - m.x) * 2, (e.y - m.y) * 2);

  }
  missiles = missiles.filter(m => m.life > 0);
  for (const b of bolts) b.life -= dt; bolts = bolts.filter(b => b.life > 0);

  // pickups
  for (const k of pickups){
    k.life -= dt;
    if ((k.x - P.x) ** 2 + (k.y - P.y) ** 2 < 28 ** 2){
      k.life = 0; sfx('square', 500, 1400, .25, .2);
      if (k.type === 'heal'){ P.hp = Math.min(P.maxhp, P.hp + 35); text(P.x, P.y - 30, '+HP', '#ff7a9b'); }
      else if (k.type === 'magnet'){ for (const g of gems) g.pulled = true; text(P.x, P.y - 30, 'MAGNET!', '#7affd1'); }
      else { shake = 14; hitstop = .12; ring(P.x, P.y, 600, '#ffe14d'); S.boss(); for (const e of enemies) if (e.kind !== 'boss') damageEnemy(e, 9999); else damageEnemy(e, 150); text(P.x, P.y - 30, 'NUKE!', '#ffe14d'); }
    }
  }
  pickups = pickups.filter(k => k.life > 0);
  // swarm event
  swarmT -= dt;
  if (swarmT <= 0){
    swarmT = 45; text(P.x, P.y - 60, '⚠ SWARM ⚠', '#ffe14d'); S.boss();
    const n = 28 + Math.floor(t / 10), rad = Math.hypot(W, H) / 2 + 40;
    for (let i = 0; i < n; i++){ spawnEnemy('dart'); const e = enemies[enemies.length - 1], a = i / n * TAU; e.x = P.x + Math.cos(a) * rad; e.y = P.y + Math.sin(a) * rad; e.spd *= 1.1; }
  }

  // bullets
  for (const b of bullets){
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies){
      if (e.dead || b.hit.has(e)) continue;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < (e.r + 5) ** 2){
        b.hit.add(e); damageEnemy(e, b.dmg, b.vx * .25, b.vy * .25);
        burst(b.x, b.y, '#00f0ff', 3, 90, .25);
        if (b.pierce-- <= 0){ b.life = 0; break; }
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  // enemies
  for (const e of enemies){
    if (e.dead) continue;
    let dx = P.x - e.x, dy = P.y - e.y; const d = Math.hypot(dx, dy) || 1;
    let mv = e.spd;
    if (e.kind === 'shooter'){
      if (d < 260) mv = -e.spd * .6;
      else if (d < 340) mv = 0;
      e.shootT -= dt;
      if (e.shootT <= 0 && d < 500){ e.shootT = 2.2; ebullets.push({ x: e.x, y: e.y, vx: dx / d * 210, vy: dy / d * 210, life: 4 }); }
    } else if (e.kind === 'charger'){

  for (const e of enemies){ if (e.dead) continue; const k = ((e.x / cell) | 0) * 100003 + ((e.y / cell) | 0); (grid.get(k) || grid.set(k, []).get(k)).push(e); }
  for (const e of enemies){
    if (e.dead) continue;
    const cx = (e.x / cell) | 0, cy = (e.y / cell) | 0;

/* ---------- render ---------- */
function poly(x, y, r, n, rot){ ctx.beginPath(); for (let i = 0; i < n; i++){ const a = rot + i / n * TAU; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }

function render(blades){
  const sx = shake > .3 ? rnd(-shake, shake) : 0, sy = shake > .3 ? rnd(-shake, shake) : 0;
  const ox = W / 2 - P.x + sx, oy = H / 2 - P.y + sy;
  // background
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, 'rgba(30,20,70,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0,240,255,.09)'; ctx.beginPath();
  for (let x = ((ox % gs) + gs) % gs; x < W; x += gs){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = ((oy % gs) + gs) % gs; y < H; y += gs){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.save(); ctx.translate(ox, oy);
  // gems
  for (const q of gems){
    ctx.fillStyle = q.v >= 4 ? '#ffe14d' : '#00f0ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    poly(q.x, q.y, 4 + Math.min(q.v, 6) * .5, 4, t * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  // enemies
  ctx.lineWidth = 2;
  for (const e of enemies){
    poly(e.x, e.y, e.r, e.sides, e.rot);
    ctx.fillStyle = e.flash > 0 ? '#fff' : 'rgba(10,8,25,.92)'; ctx.fill();
    ctx.strokeStyle = e.col; ctx.stroke();
    if (e.kind === 'boss'){
      ctx.strokeStyle = e.col; poly(e.x, e.y, e.r * .55, e.sides, -e.rot * 1.5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(e.x - 40, e.y - e.r - 14, 80, 5);
      ctx.fillStyle = e.col; ctx.fillRect(e.x - 40, e.y - e.r - 14, 80 * clamp(e.hp / e.mhp, 0, 1), 5);
    }
  }

  // pickups

  for (const k of pickups){ ctx.globalAlpha = k.life < 3 ? (Math.floor(k.life * 8) % 2 ? .3 : 1) : 1; ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; ctx.fillText(k.type === 'heal' ? '💖' : k.type === 'bomb' ? '💣' : '🧲', k.x, k.y + 7 + Math.sin(t * 5) * 3); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // lightning
  ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 16; ctx.lineWidth = 3;
  for (const b of bolts){ ctx.strokeStyle = `rgba(255,240,130,${b.life / .18})`; ctx.beginPath(); b.path.forEach((q, i) => { const jx = rnd(-6, 6), jy = rnd(-6, 6); ctx[i ? 'lineTo' : 'moveTo'](q.x + jx, q.y + jy); }); ctx.stroke(); }
  // missiles
  ctx.fillStyle = '#ffb27a'; ctx.shadowColor = '#ff7a2f';
  for (const m of missiles){ ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, TAU); ctx.fill(); }
  // enemy bullets
  ctx.fillStyle = '#ff2f6b'; ctx.shadowColor = '#ff2f6b'; ctx.shadowBlur = 12;
  for (const b of ebullets){ ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, TAU); ctx.fill(); }
  // player bullets
  ctx.fillStyle = '#aef9ff'; ctx.shadowColor = '#00f0ff';
  for (const b of bullets){ ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, TAU); ctx.fill(); }
  // blades

  for (const bl of blades){ poly(bl.x, bl.y, 11, 4, bl.a * 3); ctx.fill(); }
  // player

  ctx.lineWidth = 3;
  for (const r of rings){ ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }

  for (const x of texts){ ctx.globalAlpha = clamp(x.life / .3, 0, 1); ctx.fillStyle = x.col; ctx.fillText(x.s, x.x, x.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // combo
  if (combo >= 3){
    const sc = 1 + Math.min(combo, 150) / 150 * .8, pulse = 1 + (comboT > 2 ? (comboT - 2) * 1.5 : 0);
    ctx.save(); ctx.textAlign = 'center'; ctx.font = `900 ${34 * sc * pulse}px sans-serif`; ctx.fillStyle = combo >= 50 ? '#ffe14d' : '#fff';
    ctx.shadowColor = combo >= 50 ? '#ff2fb3' : '#00f0ff'; ctx.shadowBlur = 18; ctx.fillText(combo + ' COMBO', W / 2, 110);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(W / 2 - 60, 120, 120 * clamp(comboT / 2.2, 0, 1), 3);
    ctx.font = '600 12px sans-serif'; ctx.shadowBlur = 0; ctx.fillText('피해 +' + Math.round(Math.min(combo, 100) * .5) + '%', W / 2, 146); ctx.restore();
  }
  // damage vignette
  if (flashT > 0){
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
    v.addColorStop(0, 'rgba(255,0,60,0)'); v.addColorStop(1, `rgba(255,0,60,${flashT * 3})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(0,240,255,.5)'; ctx.beginPath(); ctx.arc(joy.sx + Math.cos(a) * m, joy.sy + Math.sin(a) * m, 22, 0, TAU); ctx.fill();

}

/* ---------- main loop ---------- */
let last = performance.now(), idleBlades = [];
function frame(now){
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (state === 'play'){ if (hitstop > 0){ hitstop -= dt; render(idleBlades); requestAnimationFrame(frame); return; } idleBlades = update(dt); render(idleBlades); }
  else if (state === 'title'){
    // attract mode: drifting particles over grid
    t += dt; P.x = Math.cos(t * .3) * 200; P.y = Math.sin(t * .2) * 200; P.vx = P.vy = 0;
    if (Math.random() < .25) parts.push({ x: P.x + rnd(-W / 2, W / 2), y: P.y + rnd(-H / 2, H / 2), vx: rnd(-20, 20), vy: rnd(-40, -10), life: 2, max: 2, col: Math.random() < .5 ? '#00f0ff' : '#ff2fb3', sz: 3 });
    for (const p of parts){ p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0);
    render([]);
  }
  else if (state === 'over'){
    for (const p of parts){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93; p.life -= dt; } parts = parts.filter(p => p.life > 0);
    for (const r of rings){ r.life -= dt; r.r = r.mr * (1 - r.life / r.max); } rings = rings.filter(r => r.life > 0);
    shake *= Math.pow(.001, dt); render([]);
  }
  requestAnimationFrame(frame);
}
reset(); state = 'title'; P.x = P.y = 0; parts = [];
requestAnimationFrame(frame);
window.__game = { get state(){ return state; }, get P(){ return P; }, get enemies(){ return enemies; }, get t(){ return t; }, set t(v){ t = v; }, start: startGame };
})();
