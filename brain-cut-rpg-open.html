<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뇌절 RPG - 타락공주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--pur:#b78cff;--pur2:#7b4dff;--red:#ff4d6d;--grn:#4ef0a0;--yel:#ffd84d;--cy:#5ee7ff;--glass:rgba(22,14,48,.62);--line:rgba(190,150,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0614;color:#fff;font-family:"Jua","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 20px rgba(160,110,255,.08)}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.5);z-index:3}
#wui{position:fixed;inset:0;pointer-events:none;z-index:4}
#wui>*{pointer-events:none}
#tl{position:absolute;left:12px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;max-width:220px}
.pill{padding:6px 12px;font-size:14px}
#quest{padding:8px 12px;font-size:13px;line-height:1.5;pointer-events:auto}#quest .q{cursor:pointer;border-radius:8px;padding:3px 5px;margin:0 -5px 5px}#quest .q small{opacity:.7;font-size:10px}#quest .q.g{background:rgba(124,240,255,.18);outline:1px solid rgba(124,240,255,.6)}
#gdist{padding:5px 10px;font-size:12px;color:#7cf0ff;cursor:pointer;pointer-events:auto;display:none}
#quest .q{margin-bottom:5px}#quest .q:last-child{margin:0}
#quest b{color:var(--yel)}
#hud{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(340px,calc(100vw - 380px));min-width:230px;padding:8px 12px}
@media(max-width:760px){#hud,#hudmini{position:static!important;transform:none!important;left:auto!important;top:auto!important;width:auto!important;min-width:0!important}#qbtn,#who{padding:0 8px!important;font-size:11px!important}#who{max-width:60px!important}}
.hrow{display:flex;align-items:center;gap:8px}
#lv{font-family:"Black Han Sans","Jua",sans-serif;color:var(--yel);font-size:17px;white-space:nowrap}
.bar{flex:1;height:13px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12)}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .3s}
.bar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;text-shadow:0 1px 2px #000}
.hp{background:linear-gradient(90deg,#16c97a,#6dffb2)}.xp{background:linear-gradient(90deg,#6a5cff,#b78cff)}.he{background:linear-gradient(90deg,#ff3d6e,#ff9a5c)}
.thin{height:6px;margin-top:5px}
#gold{font-size:13px;color:var(--yel);white-space:nowrap}
.gauge{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:var(--pur)}
.pips{display:flex;gap:4px}
.pip{width:18px;height:8px;border-radius:5px;background:rgba(255,255,255,.14);transition:.2s}
.pip.on{background:linear-gradient(90deg,#ff7be5,#9d6bff);box-shadow:0 0 12px #c58bff,0 0 4px #fff}
#hudx{position:absolute;right:5px;top:3px;padding:0 7px;height:18px;font-size:11px;border-radius:8px;pointer-events:auto;line-height:1}
#hudmini{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);padding:6px 14px;font-size:13px;cursor:pointer;pointer-events:auto;display:none;white-space:nowrap}
#viewm{position:absolute;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 42px);padding:8px;display:none;flex-direction:column;gap:6px;z-index:9;pointer-events:auto;min-width:170px}
#viewm button{font-size:13px;padding:7px 10px;text-align:left;border-radius:10px}
#viewm .t{font-size:12px;color:var(--yel);padding:0 4px}
#tr{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mm{pointer-events:auto;cursor:pointer;width:112px;height:112px;border-radius:50%;border:2px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#mm.xl{width:260px;height:260px}
#mute{pointer-events:auto;cursor:pointer;width:38px;height:34px;display:grid;place-items:center;font-size:16px}
#boss{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);width:min(460px,70vw);padding:8px 12px;display:none}
#boss .nm{display:flex;justify-content:space-between;font-size:16px;margin-bottom:5px}
#boss .nm b{font-family:"Black Han Sans","Jua",sans-serif;font-weight:400;letter-spacing:1px}
#ebars{position:fixed;inset:0;pointer-events:none;z-index:2}
.eb{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 6px #000;display:none}
.eb .en{margin-bottom:2px}.eb .eh{width:84px;height:7px;margin:0 auto;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.eb .eh i{display:block;height:100%;background:linear-gradient(90deg,#ff3d6e,#ff9a5c);transition:width .2s}
.eb .sp{display:none;margin-top:4px;background:#fff;color:#1a1030;padding:4px 10px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:relative}
.eb .sp:after{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#fff}
button{font:inherit;color:#fff;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:11px 6px;font-size:17px;background:linear-gradient(180deg,rgba(120,80,230,.55),rgba(50,28,110,.7));backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.25)}button:active:not(:disabled){transform:scale(.95)}button:disabled{opacity:.4;cursor:default}
#acts{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:62px 62px 62px 86px;grid-template-rows:62px 62px 86px;gap:8px;align-items:end;justify-items:end;grid-template-areas:"s3 s4 s1 s2" ". roll guard joke" ". pot again atk";pointer-events:none}
.sk{pointer-events:auto;position:relative;width:62px;height:62px;border-radius:50%;padding:0;display:grid;place-items:center;overflow:hidden;touch-action:manipulation}
.sk i{font-style:normal;font-size:26px;line-height:1}
.sk kbd{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:inherit;font-size:10px;opacity:.7}
.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.sk u{position:absolute;right:7px;top:3px;text-decoration:none;font-size:12px;color:var(--yel)}
.sk em{position:absolute;left:0;right:0;bottom:2px;font-size:9px;font-style:normal;text-align:center;opacity:.9;white-space:nowrap}
.sk.s{background:linear-gradient(180deg,#ff9a3d,#c2381f);border-color:#ffd9a0;box-shadow:0 0 18px rgba(255,150,60,.45),inset 0 1px 0 rgba(255,255,255,.35)}.sk.s u{right:auto;left:8px;font-size:11px}.sk.s i{font-size:24px;margin-top:-6px}
#danger{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 50%,rgba(230,0,40,.6));opacity:0}
.sk.atk{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#ff9be8,#7b4dff);border:2px solid #ffd1f6;box-shadow:0 0 26px rgba(255,100,225,.5)}.sk.atk i{font-size:36px}
.sk.again{background:linear-gradient(180deg,#ff6bd6,#8a3dff);border-color:#ffb3ef}
@media(max-width:520px){.sk kbd{display:none}}
@media(max-height:460px){
 #acts{grid-template-columns:50px 50px 50px 66px;grid-template-rows:50px 50px 66px;gap:5px;bottom:max(6px,env(safe-area-inset-bottom))}
 .sk{width:50px;height:50px}.sk i{font-size:20px}.sk em{font-size:8px}.sk.atk{width:66px;height:66px}.sk.atk i{font-size:28px}.sk kbd{display:none}
 #mm{width:78px;height:78px}#tr{gap:3px}#clock,#pkb{font-size:10px;padding:3px 8px}
 #act{bottom:calc(max(6px,env(safe-area-inset-bottom)) + 190px)}
 #quest{max-width:170px;padding:5px 8px;font-size:11px}#hud{top:6px}#log{display:none}
}
#tut{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 92px);transform:translateX(-50%);width:min(460px,92vw);padding:10px 14px;border-color:#ffd84d;box-shadow:0 0 24px rgba(255,216,77,.35);pointer-events:none}
#tut #tutS{color:var(--yel);font-size:12px;margin-bottom:3px}#tut #tutT{font-size:16px;line-height:1.45}
#tutSkip{pointer-events:auto;position:absolute;right:8px;top:6px;padding:3px 9px;font-size:11px;border-radius:10px}
#act{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 248px);pointer-events:auto;font-size:18px;padding:13px 20px;border-radius:40px;background:linear-gradient(180deg,#ffd84d,#ff9a3d);color:#3a2008;border:2px solid #fff3b0;box-shadow:0 0 26px rgba(255,200,80,.6);animation:pu .6s infinite alternate;display:none}
@keyframes pu{to{transform:scale(1.07)}}
#joyzone{position:absolute;left:0;bottom:0;width:48%;height:52%;pointer-events:auto;touch-action:none}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(200,160,255,.65);box-shadow:0 0 14px rgba(200,160,255,.8)}
#hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#e8dcff;text-shadow:0 1px 4px #000;opacity:.75;white-space:nowrap}
@media(max-width:1180px){#hint{display:none}}
#dlg{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(580px,92vw);padding:14px 18px 22px;display:none;z-index:15;pointer-events:auto;cursor:pointer}
#dlg.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}
#dname{color:var(--yel);font-size:19px;margin-bottom:6px;font-family:"Black Han Sans","Jua",sans-serif}
#dtext{min-height:3.4em;font-size:18px;line-height:1.55}
#dnext{position:absolute;right:16px;bottom:8px;color:var(--pur);animation:pu .5s infinite alternate}
.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(20,10,44,.88);border:1px solid var(--line);font-size:18px;text-align:center;animation:ts 3.2s forwards;max-width:90vw}
@keyframes ts{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fl{position:absolute;font-family:"Black Han Sans","Jua",sans-serif;font-size:28px;transform:translate(-50%,-50%);animation:fl 1s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 14px currentColor;-webkit-text-stroke:1.2px rgba(0,0,0,.55);white-space:nowrap}
@keyframes fl{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}15%{transform:translate(-50%,-70%) scale(1.3);opacity:1}100%{transform:translate(-50%,-190%) scale(.9);opacity:0}}
.big{position:absolute;font-family:"Black Han Sans","Jua",sans-serif;color:#fff;white-space:nowrap;text-shadow:0 0 18px #c070ff,0 0 40px #ff49d8,0 4px 0 #3a0a6a;-webkit-text-stroke:2px #5a1fb0;animation:bg 1.3s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes bg{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.1);opacity:0}12%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.3);opacity:1}25%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.25);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#scr{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;flex-direction:column;gap:14px;z-index:30;padding:20px;background:radial-gradient(ellipse at center,rgba(10,5,25,.3),rgba(5,2,14,.85));text-align:center;overflow:auto}
#scr.on{display:flex;animation:fadein .5s}@keyframes fadein{from{opacity:0}}
.ttl{font-family:"Black Han Sans","Jua",sans-serif;font-size:clamp(46px,13vw,92px);line-height:1;margin:0;background:linear-gradient(180deg,#fff,#ffb6f3 40%,#8b5bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(190,110,255,.75)) drop-shadow(0 6px 0 rgba(40,10,90,.9));animation:tt 1.6s ease-in-out infinite alternate}
@keyframes tt{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.05) rotate(1deg)}}
.desc{max-width:460px;font-size:16px;line-height:1.6;color:#e5d8ff;text-shadow:0 2px 8px #000}.desc b{color:var(--yel)}
.go{pointer-events:auto;font-size:24px;padding:14px 38px;border-radius:40px;background:linear-gradient(180deg,#ff7be5,#7b4dff);border:2px solid #ffd1f6;box-shadow:0 0 34px rgba(255,100,225,.6);animation:pu .7s infinite alternate}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:150px;min-height:140px;padding:14px 10px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;line-height:1.35;animation:cardin .5s backwards}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}
.card .ic{font-size:40px;filter:drop-shadow(0 0 10px rgba(200,150,255,.8))}.card small{color:var(--yel);font-size:13px}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.8)}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0614;z-index:50;font-size:20px;color:var(--pur);transition:opacity .6s}
</style>
<script>window.addEventListener('error',function(e){var l=document.getElementById('load');if(l){l.style.opacity=1;l.style.flexDirection='column';l.style.padding='20px';l.style.textAlign='center';l.innerHTML='⚠️ 실행 중 오류가 발생했어요<br><small style="color:#fff;opacity:.8">'+(e.message||'')+'<br>크롬/사파리 등 최신 브라우저에서 열어 주세요 (WebGL 필요)</small>'}});</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div><div id="danger"></div>
<div id="ebars"></div>
<div id="wui" style="display:none">
  <div id="tl"><div class="glass pill" id="stage">-</div><div class="glass" id="quest"></div><div class="glass" id="gdist"></div><div class="glass" id="s2btn" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:none;place-items:center;justify-content:center;pointer-events:auto;;font-size:12px;white-space:nowrap;border-color:#ff7a93;color:#ffd0da;animation:pu .7s infinite alternate">🌑 시즌 2</div></div>
  <div class="glass" id="hudmini">Lv.1</div>
  <div class="glass" id="hud"><button id="hudx" title="닫기">✕</button>
    <div class="hrow"><div id="lv">Lv.1</div><div class="bar"><i class="hp" id="ph" style="width:100%"></i><span id="phn"></span></div><div id="gold">💰0</div></div>
    <div class="bar thin"><i class="xp" id="xpb" style="width:0%"></i></div>
    <div class="gauge"><span>뇌절</span><div class="pips" id="pips"></div></div>
  </div>
  <div id="tr"><div style="display:flex;gap:6px"><div class="glass" id="bagb" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:grid;place-items:center;font-size:12px;white-space:nowrap">🎒 가방</div><div class="glass" id="admb" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:none;place-items:center;font-size:12px;white-space:nowrap;border-color:#ffd84d">🛠 관리자</div><div class="glass" id="viewb" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:grid;place-items:center;font-size:12px">👁 보기</div><div class="glass" id="qbtn" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:grid;place-items:center;font-size:12px">화질</div><div class="glass" id="who" style="pointer-events:auto;cursor:pointer;padding:0 10px;height:34px;display:grid;place-items:center;font-size:12px;white-space:nowrap;max-width:110px;overflow:hidden">🚪</div><div class="glass" id="mute" style="pointer-events:auto">🔊</div></div><canvas id="mm" class="glass" width="112" height="112"></canvas><div class="glass pill" id="pkb" style="pointer-events:auto;cursor:pointer;font-size:12px;text-align:center">🕊️ PK OFF</div><div class="glass pill" id="clock" style="font-size:12px"></div></div>
  <div class="glass" id="evb" style="position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);padding:5px 14px;font-size:13px;display:none;border-color:#ffd84d;color:#ffe9a0;white-space:nowrap;z-index:3"></div>
  <div class="glass" id="boss"><div class="nm"><b id="bn">-</b><i id="bt" style="font-style:normal;color:var(--yel);font-size:12px"></i></div><div class="bar"><i class="he" id="bh" style="width:100%"></i></div></div>
  <div class="glass" id="viewm"></div>
  <button id="act"></button>
  <div class="glass" id="tut" style="display:none"><div id="tutS"></div><div id="tutT"></div><button id="tutSkip">건너뛰기</button></div>
  <div id="acts">
    <button class="sk s" data-a="s1" id="bs1" style="grid-area:s1"><i id="is1">💥</i><em id="es1"></em><u id="ls1">F</u><s class="cd"></s></button>
    <button class="sk s" data-a="s2" id="bs2" style="grid-area:s2"><i id="is2">⚡</i><em id="es2"></em><u id="ls2">G</u><s class="cd"></s></button>
    <button class="sk s" data-a="s3" id="bs3" style="grid-area:s3"><i id="is3">🌟</i><em id="es3"></em><u id="ls3">H</u><s class="cd"></s></button>
    <button class="sk s" data-a="s4" id="bs4" style="grid-area:s4"><i id="is4">💫</i><em id="es4"></em><u id="ls4">V</u><s class="cd"></s></button>
    <button class="sk" data-a="roll" style="grid-area:roll"><i>💨</i><kbd>Space</kbd><s class="cd"></s></button>
    <button class="sk" data-a="guard" style="grid-area:guard"><i>🛡️</i><kbd>K</kbd><s class="cd"></s></button>
    <button class="sk" data-a="joke" style="grid-area:joke"><i>🎭</i><kbd>L</kbd><s class="cd"></s></button>
    <button class="sk" data-a="pot" style="grid-area:pot"><i>🧪</i><kbd>Q</kbd><u id="npot">2</u><s class="cd"></s></button>
    <button class="sk again" data-a="again" style="grid-area:again"><i>🔁</i><kbd>R</kbd></button>
    <button class="sk atk" data-a="atk" style="grid-area:atk"><i>⚔️</i><kbd>J</kbd></button>
  </div>
  <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
  <div id="hint">WASD 이동 · 마우스 드래그 시점 · 클릭/J 공격 · L 드립 · K 방어 · Space 구르기 · R 한번 더 · Q 물약 · E 상호작용</div>
</div>
<div class="glass" id="dlg"><div id="dname"></div><div id="dtext"></div><div id="dnext">▶</div></div>
<div id="fx"></div>
<div id="flash"></div>
