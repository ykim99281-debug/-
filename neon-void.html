<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>네온 보이드</title>
<style>
  :root{--c:#37f0ff;--m:#ff3df2;--y:#ffe14a}
  html,body{margin:0;height:100%;background:#03030a;color:#fff;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#05060f;box-shadow:0 0 60px #1a2cff55;border-radius:6px}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#0a0a2acc,#02020aee);z-index:5}
  .ov.hide{display:none}
  h1{font-size:clamp(2.2rem,9vw,3.6rem);margin:0;letter-spacing:.08em;background:linear-gradient(90deg,var(--c),var(--m));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #6a5cff)}
  .sub{opacity:.8;margin:.6em 0 1.4em;line-height:1.7;font-size:.95rem}
  .sub b{color:var(--y)}
  button{font:inherit;font-weight:800;font-size:1.15rem;padding:.75em 2.2em;border:2px solid var(--c);color:var(--c);background:#0008;border-radius:3em;cursor:pointer;box-shadow:0 0 18px #37f0ff66,inset 0 0 14px #37f0ff33;letter-spacing:.1em}
  button:active{transform:scale(.96)}
  .stat{font-size:1.1rem;margin:.2em}
  .stat b{color:var(--y)}
  #pause{position:fixed;top:10px;right:10px;z-index:4;width:40px;height:40px;padding:0;font-size:1rem;border-radius:50%;opacity:.7}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="pause" aria-label="일시정지">❚❚</button>

<div id="menu" class="ov">
  <h1>NEON VOID</h1>
  <div class="sub">
    적을 격추하고 <b>콤보</b>를 이어가세요.<br>
    아이템으로 무기를 강화하고, 5웨이브마다 <b>보스</b>가 나타납니다.<br><br>
    <b>이동</b> 방향키 / WASD / 화면 드래그<br>
    <b>폭탄</b> Space / 두 손가락 탭 &nbsp; <b>일시정지</b> P<br>
    (자동 발사)
  </div>
  <div class="stat" id="bestline"></div>
  <button id="go">START</button>
</div>
<div id="over" class="ov hide">
  <h1 style="font-size:clamp(2rem,8vw,3rem)">GAME OVER</h1>
  <div class="sub" id="result"></div>
  <button id="again">다시 도전</button>
</div>
<div id="pz" class="ov hide">
  <h1 style="font-size:2.4rem">PAUSE</h1>
  <div class="sub">P 또는 버튼으로 재개</div>
  <button id="resume">계속</button>
</div>

<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=800;cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* ---------- audio (synth) ---------- */
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',vol=.06,slide=0){
  if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}
function noise(d,vol=.12,hp=400){
  if(!AC||muted)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=hp*4;
  s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start();
}
const sfx={
  shot:()=>tone(880,.06,'square',.018,-500),
  hit:()=>tone(260,.05,'sawtooth',.03,-120),
  boom:()=>{noise(.3,.14);tone(120,.25,'sawtooth',.05,-80)},
  big:()=>{noise(.7,.22,200);tone(80,.6,'sawtooth',.08,-50)},
  pick:()=>{tone(660,.08,'triangle',.07);setTimeout(()=>tone(990,.12,'triangle',.07),70)},
  hurt:()=>{noise(.35,.2,150);tone(180,.3,'sawtooth',.08,-120)},
  bomb:()=>{noise(1,.3,100);tone(60,.9,'sine',.15,-30)},
  wave:()=>{[440,554,660].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.06),i*90))},
};

/* ---------- state ---------- */
const $=id=>document.getElementById(id);
let best=0;try{best=+localStorage.getItem('nv_best')||0}catch(e){}
let S,keys={},touch=null,touchN=0,mode='menu';
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const TAU=Math.PI*2;

function newGame(){
  S={t:0,score:0,combo:0,comboT:0,mult:1,wave:0,waveT:0,toSpawn:[],spawnT:0,boss:null,
     p:{x:W/2,y:H-110,vx:0,vy:0,r:11,hp:3,inv:0,power:1,rapid:0,shield:0,bombs:2,fire:0,trail:[]},
     bul:[],ebul:[],en:[],fx:[],pu:[],shake:0,flash:0,msgs:[],kills:0,
     stars:Array.from({length:90},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.2,1)}))};
  nextWave();
}

/* ---------- waves ---------- */
const TYPES={
  drone:{hp:2,r:14,sp:90,pts:100,col:'#ff4d6d',shoot:0},
  zig:{hp:2,r:13,sp:110,pts:150,col:'#ffa63d',shoot:0},
  gun:{hp:4,r:16,sp:60,pts:250,col:'#c77dff',shoot:1.6},
  tank:{hp:12,r:24,sp:42,pts:600,col:'#4dffa6',shoot:1.1},
  swoop:{hp:3,r:12,sp:150,pts:200,col:'#4dd2ff',shoot:0},
};
function nextWave(){
  S.wave++;S.waveT=0;const w=S.wave;
  sfx.wave();
  if(w%5===0){msg('⚠ WARNING ⚠','BOSS');spawnBoss();return}
  msg('WAVE '+w);
  const n=6+w*2,list=[];
  for(let i=0;i<n;i++){
    let pool=['drone','zig'];
    if(w>=2)pool.push('swoop');
    if(w>=3)pool.push('gun');
    if(w>=4&&i%5===4)pool=['tank'];
    list.push(pick(pool));
  }
  S.toSpawn=list;S.spawnT=1.2;
}
function spawnEnemy(k){
  const T=TYPES[k],hpScale=1+S.wave*.08;
  const e={k,x:rnd(40,W-40),y:-30,hp:Math.ceil(T.hp*hpScale),max:0,r:T.r,sp:T.sp*(1+S.wave*.02),pts:T.pts,col:T.col,
           shoot:T.shoot,st:rnd(0,1.5),ph:rnd(0,TAU),t:0,hit:0,x0:0,dir:Math.random()<.5?-1:1};
  e.max=e.hp;e.x0=e.x;
  if(k==='swoop'){e.x=e.dir>0?-20:W+20;e.y=rnd(60,200)}
  S.en.push(e);
}
function spawnBoss(){
  const hp=60+S.wave*14;
  S.boss={k:'boss',x:W/2,y:-120,ty:130,hp,max:hp,r:48,col:'#ff3df2',pts:8000,t:0,hit:0,ph:0,atk:2,pat:0,enter:true};
  S.en.push(S.boss);
}

/* ---------- effects ---------- */
function msg(t,s){S.msgs.push({t,s,life:2.2,max:2.2})}
function burst(x,y,col,n=14,sp=220,life=.6,size=2.4){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(sp*.2,sp);S.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,1)*life,max:life,col,size:rnd(1,size),type:'p'})}
}
function ring(x,y,col,r=60,life=.5){S.fx.push({x,y,r:0,R:r,life,max:life,col,type:'r'})}
function floatText(x,y,t,col='#fff'){S.fx.push({x,y,t,col,life:.8,max:.8,type:'t',vy:-40})}
function shake(n){S.shake=Math.max(S.shake,n)}

/* ---------- logic ---------- */
function addScore(p,x,y){
  const g=p*S.mult;S.score+=g;floatText(x,y,'+'+g,'#ffe14a');
}
function killEnemy(e){
  S.kills++;
  S.combo++;S.comboT=2.4;S.mult=1+Math.min(9,Math.floor(S.combo/5));
  addScore(e.pts,e.x,e.y);
  burst(e.x,e.y,e.col,e.k==='boss'?80:18,e.k==='boss'?420:240,e.k==='boss'?1.4:.6,3);
  ring(e.x,e.y,e.col,e.k==='boss'?200:50);
  if(e.k==='boss'){sfx.big();shake(24);S.flash=1;S.en.forEach(o=>{if(o!==e)o.hp=0});S.ebul.length=0;
    for(let i=0;i<4;i++)dropPU(e.x+rnd(-50,50),e.y+rnd(-30,30),true);S.boss=null}
  else{sfx.boom();shake(e.k==='tank'?8:3);
    const ch=e.k==='tank'?1:.12;if(Math.random()<ch)dropPU(e.x,e.y)}
}
function dropPU(x,y,force){
  const roll=Math.random();let k;
  if(roll<.4)k='power';else if(roll<.62)k='rapid';else if(roll<.82)k='shield';else if(roll<.93)k='bomb';else k='heal';
  S.pu.push({k,x,y,vy:60,t:0});
}
const PU={power:{c:'#ff3df2',l:'P'},rapid:{c:'#ffe14a',l:'R'},shield:{c:'#37f0ff',l:'S'},bomb:{c:'#ff6b3d',l:'B'},heal:{c:'#4dff7a',l:'+'}};

function hurt(){
  const p=S.p;if(p.inv>0)return;
  if(p.shield>0){p.shield=0;p.inv=1;ring(p.x,p.y,'#37f0ff',90);sfx.pick();return}
  p.hp--;p.inv=2;S.combo=0;S.mult=1;shake(16);S.flash=.5;sfx.hurt();burst(p.x,p.y,'#fff',24,260);
  p.power=Math.max(1,p.power-1);
  if(p.hp<=0)gameOver();
}
function useBomb(){
  const p=S.p;if(p.bombs<=0||mode!=='play')return;
  p.bombs--;sfx.bomb();shake(20);S.flash=1;ring(p.x,p.y,'#ff6b3d',700,.8);ring(p.x,p.y,'#fff',500,.6);
  S.ebul.length=0;
  S.en.forEach(e=>{e.hp-=e.k==='boss'?25:999;e.hit=.1});
  p.inv=Math.max(p.inv,1.2);
}

function fireBullets(){
  const p=S.p,n=p.power;
  const add=(ang,dx=0,dmg=1)=>S.bul.push({x:p.x+dx,y:p.y-14,vx:Math.sin(ang)*760,vy:-Math.cos(ang)*760,dmg});
  if(n===1)add(0);
  else if(n===2){add(0,-7);add(0,7)}
  else if(n===3){add(0);add(-.14,-8);add(.14,8)}
  else if(n===4){add(0,-6);add(0,6);add(-.2,-10);add(.2,10)}
  else{add(0,-5,1.4);add(0,5,1.4);add(-.14,-10);add(.14,10);add(-.3,-14);add(.3,14)}
  sfx.shot();
}

function enemyShoot(e,aimed=true,speed=210){
  const p=S.p,a=aimed?Math.atan2(p.y-e.y,p.x-e.x):Math.PI/2;
  S.ebul.push({x:e.x,y:e.y+e.r*.5,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:5});
}
function bossAI(b,dt){
  b.t+=dt;
  if(b.enter){b.y+=(b.ty-b.y)*Math.min(1,dt*2.5);if(Math.abs(b.y-b.ty)<2)b.enter=false;return}
  b.x=W/2+Math.sin(b.t*.7)*150;b.y=b.ty+Math.sin(b.t*1.3)*18;
  const rage=b.hp<b.max*.5?1.5:1;
  b.atk-=dt*rage;
  if(b.atk<=0){
    b.pat=(b.pat+1)%3;
    if(b.pat===0){ // ring
      const n=22;for(let i=0;i<n;i++){const a=i/n*TAU+b.t;S.ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5})}
      b.atk=1.6;
    }else if(b.pat===1){ // aimed fan
      const base=Math.atan2(S.p.y-b.y,S.p.x-b.x);
      for(let i=-3;i<=3;i++){const a=base+i*.16;S.ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:5})}
      b.atk=1.2;
    }else{ // spiral burst (queued)
      b.spiral=14;b.sT=0;b.atk=2.4;
    }
  }
  if(b.spiral>0){b.sT-=dt;if(b.sT<=0){b.sT=.06;const a=b.spiral*.55+b.t;
    for(let k=0;k<2;k++){const aa=a+k*Math.PI;S.ebul.push({x:b.x,y:b.y,vx:Math.cos(aa)*200,vy:Math.sin(aa)*200,r:5})}b.spiral--}}
}

function update(dt){
  const p=S.p;S.t+=dt;
  // input
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.a||keys.A)ix--;if(keys.ArrowRight||keys.d||keys.D)ix++;
  if(keys.ArrowUp||keys.w||keys.W)iy--;if(keys.ArrowDown||keys.s||keys.S)iy++;
  const spd=(keys.Shift?200:330);
  if(ix||iy){const l=Math.hypot(ix,iy);p.x+=ix/l*spd*dt;p.y+=iy/l*spd*dt}
  if(touch){const tx=touch.x,ty=touch.y-70; // finger offset so ship is visible
    p.x+=(tx-p.x)*Math.min(1,dt*14);p.y+=(ty-p.y)*Math.min(1,dt*14)}
  p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(60,Math.min(H-30,p.y));
  p.trail.unshift({x:p.x,y:p.y+14});if(p.trail.length>10)p.trail.pop();
  p.inv=Math.max(0,p.inv-dt);p.rapid=Math.max(0,p.rapid-dt);
  // fire
  p.fire-=dt;if(p.fire<=0){fireBullets();p.fire=p.rapid>0?.06:.11}
  // combo
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0){S.combo=0;S.mult=1}}
  // waves
  if(S.toSpawn.length){S.spawnT-=dt;if(S.spawnT<=0){spawnEnemy(S.toSpawn.pop());S.spawnT=Math.max(.35,.9-S.wave*.03)}}
  else if(S.en.length===0){S.waveT+=dt;if(S.waveT>1.8)nextWave()}
  // bullets
  for(const b of S.bul){b.x+=b.vx*dt;b.y+=b.vy*dt}
  S.bul=S.bul.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  for(const b of S.ebul){b.x+=b.vx*dt;b.y+=b.vy*dt}
  S.ebul=S.ebul.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
  // enemies
  for(const e of S.en){
    e.t+=dt;e.hit=Math.max(0,e.hit-dt);
    if(e.k==='boss'){bossAI(e,dt)}
    else if(e.k==='zig'){e.y+=e.sp*dt;e.x=e.x0+Math.sin(e.t*3+e.ph)*90}
    else if(e.k==='swoop'){e.x+=e.dir*e.sp*dt*1.4;e.y+=Math.sin(e.t*2.5)*90*dt+e.sp*.35*dt;}
    else if(e.k==='gun'){e.y+=e.sp*dt*(e.y<170?1:.15);e.x+=Math.sin(e.t+e.ph)*40*dt;}
    else if(e.k==='tank'){e.y+=e.sp*dt*(e.y<130?1:.1);e.x+=Math.sin(e.t*.8+e.ph)*55*dt}
    else{e.y+=e.sp*dt}
    if(e.shoot){e.st-=dt;if(e.st<=0&&e.y>0&&e.y<H*.7){
      if(e.k==='tank'){for(let i=-1;i<=1;i++){const a=Math.atan2(p.y-e.y,p.x-e.x)+i*.25;S.ebul.push({x:e.x,y:e.y+10,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:5})}}
      else enemyShoot(e);
      e.st=e.shoot*rnd(.8,1.2)}}
    // hit by player bullets
    for(const b of S.bul){
      if(b.dead)continue;
      const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+4;
      if(dx*dx+dy*dy<rr*rr){b.dead=true;e.hp-=b.dmg;e.hit=.06;sfx.hit();S.fx.push({x:b.x,y:b.y,vx:rnd(-80,80),vy:rnd(40,160),life:.25,max:.25,col:'#fff',size:1.6,type:'p'})}
    }
    // ram player
    const dx=p.x-e.x,dy=p.y-e.y,rr=e.r+p.r-2;
    if(dx*dx+dy*dy<rr*rr&&e.k!=='boss'){e.hp=0;hurt()}
    else if(dx*dx+dy*dy<rr*rr)hurt();
  }
  S.bul=S.bul.filter(b=>!b.dead);
  for(const e of S.en){if(e.hp<=0)killEnemy(e)}
  S.en=S.en.filter(e=>e.hp>0&&e.y<H+60&&e.x>-80&&e.x<W+80);
  // enemy bullets hit player (smaller hitbox)
  for(const b of S.ebul){const dx=b.x-p.x,dy=b.y-p.y;if(dx*dx+dy*dy<(b.r+5)**2){b.dead=true;hurt()}
    else if(dx*dx+dy*dy<(b.r+26)**2&&!b.grazed){b.grazed=true;S.score+=5*S.mult;S.fx.push({x:b.x,y:b.y,vx:0,vy:0,life:.2,max:.2,col:'#37f0ff',size:2,type:'p'})}}
  S.ebul=S.ebul.filter(b=>!b.dead);
  // powerups
  for(const u of S.pu){u.t+=dt;u.y+=u.vy*dt;u.x+=Math.sin(u.t*3)*30*dt;
    const dx=u.x-p.x,dy=u.y-p.y;
    if(dx*dx+dy*dy<30*30||(dx*dx+dy*dy<110*110&&(u.mag=1))){ // magnet
      if(dx*dx+dy*dy<110*110){u.x-=dx*dt*4;u.y-=dy*dt*4}
    }
    if(dx*dx+dy*dy<24*24){u.dead=true;sfx.pick();ring(u.x,u.y,PU[u.k].c,40,.4);
      if(u.k==='power'){if(p.power<5){p.power++;msg('POWER UP')}else{S.score+=500;floatText(u.x,u.y,'+500')}}
      else if(u.k==='rapid'){p.rapid=8;msg('RAPID FIRE')}
      else if(u.k==='shield'){p.shield=1;msg('SHIELD')}
      else if(u.k==='bomb'){p.bombs=Math.min(5,p.bombs+1);msg('BOMB +1')}
      else if(u.k==='heal'){p.hp=Math.min(5,p.hp+1);msg('HP +1')}}
  }
  S.pu=S.pu.filter(u=>!u.dead&&u.y<H+30);
  // fx
  for(const f of S.fx){f.life-=dt;if(f.type==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.97;f.vy*=.97}else if(f.type==='t')f.y+=f.vy*dt;else if(f.type==='r')f.r=f.R*(1-f.life/f.max)}
  S.fx=S.fx.filter(f=>f.life>0);
  for(const m of S.msgs)m.life-=dt;S.msgs=S.msgs.filter(m=>m.life>0);
  S.shake=Math.max(0,S.shake-dt*40);S.flash=Math.max(0,S.flash-dt*2);
  for(const s of S.stars){s.y+=s.z*(60+S.wave*3)*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}}
}

/* ---------- render ---------- */
function glow(c,b=12){ctx.shadowColor=c;ctx.shadowBlur=b}
function noGlow(){ctx.shadowBlur=0}
function drawShip(p){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.inv>0&&((S.t*20)|0)%2)ctx.globalAlpha=.4;
  // thruster
  const fl=10+Math.random()*10;glow('#ff7a2e',16);ctx.fillStyle='#ffb347';
  ctx.beginPath();ctx.moveTo(-5,10);ctx.lineTo(0,10+fl);ctx.lineTo(5,10);ctx.fill();
  glow('#37f0ff',16);ctx.fillStyle='#0b1b33';ctx.strokeStyle='#37f0ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,12);ctx.lineTo(5,8);ctx.lineTo(0,14);ctx.lineTo(-5,8);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-2,2.5,0,TAU);ctx.fill();
  noGlow();
  if(p.shield>0){glow('#37f0ff',20);ctx.strokeStyle='#37f0ffaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,24+Math.sin(S.t*8)*1.5,0,TAU);ctx.stroke();noGlow()}
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  const col=e.hit>0?'#fff':e.col;glow(e.col,14);ctx.strokeStyle=col;ctx.fillStyle=e.hit>0?'#fff':'#0b0b1a';ctx.lineWidth=2.5;
  ctx.beginPath();
  if(e.k==='drone'){ctx.moveTo(0,e.r);ctx.lineTo(e.r,-e.r*.6);ctx.lineTo(0,-e.r*.2);ctx.lineTo(-e.r,-e.r*.6)}
  else if(e.k==='zig'){ctx.moveTo(0,e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,-e.r);ctx.lineTo(-e.r,0)}
  else if(e.k==='swoop'){ctx.rotate(e.dir>0?Math.PI/2:-Math.PI/2);ctx.moveTo(0,-e.r);ctx.lineTo(e.r,e.r);ctx.lineTo(0,e.r*.4);ctx.lineTo(-e.r,e.r)}
  else if(e.k==='gun'){for(let i=0;i<6;i++){const a=i/6*TAU+e.t;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}}
  else if(e.k==='tank'){ctx.rect(-e.r,-e.r*.7,e.r*2,e.r*1.4)}
  else if(e.k==='boss'){
    for(let i=0;i<8;i++){const a=i/8*TAU+e.t*.3,r=i%2?e.r*.8:e.r*1.15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  if(e.k==='boss'){ctx.fillStyle=e.hit>0?'#fff':'#ff3df2';ctx.beginPath();ctx.arc(0,0,12+Math.sin(e.t*5)*3,0,TAU);ctx.fill()}
  else if(e.k==='tank'){ctx.fillStyle=col;ctx.fillRect(-4,-4,8,8)}
  noGlow();
  if(e.k==='tank'||e.k==='gun'){ctx.fillStyle='#0008';ctx.fillRect(-e.r,-e.r-10,e.r*2,4);ctx.fillStyle=e.col;ctx.fillRect(-e.r,-e.r-10,e.r*2*e.hp/e.max,4)}
  ctx.restore();
}
function draw(){
  ctx.save();
  if(S.shake>0)ctx.translate(rnd(-S.shake,S.shake)*.5,rnd(-S.shake,S.shake)*.5);
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03030a');g.addColorStop(1,'#0c0a2a');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  // grid floor
  ctx.strokeStyle='#37f0ff14';ctx.lineWidth=1;const off=(S.t*40)%40;
  ctx.beginPath();for(let y=-40+off;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}for(let x=0;x<=W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}ctx.stroke();
  for(const s of S.stars){ctx.globalAlpha=.3+s.z*.7;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.z*2,s.z*2+s.z*3)}
  ctx.globalAlpha=1;
  // powerups
  for(const u of S.pu){const d=PU[u.k];glow(d.c,16);ctx.strokeStyle=d.c;ctx.lineWidth=2.5;ctx.fillStyle='#0008';
    ctx.beginPath();ctx.arc(u.x,u.y,13+Math.sin(u.t*6)*1.5,0,TAU);ctx.fill();ctx.stroke();noGlow();
    ctx.fillStyle=d.c;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.l,u.x,u.y+1)}
  for(const e of S.en)drawEnemy(e);
  // bullets
  glow('#37f0ff',10);ctx.fillStyle='#bff8ff';
  for(const b of S.bul){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vx,-b.vy));ctx.fillRect(-1.8,-9,3.6,16);ctx.restore()}
  glow('#ff3d6a',12);ctx.fillStyle='#ff9bb0';
  for(const b of S.ebul){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2,0,TAU);ctx.fill();ctx.fillStyle='#ff9bb0'}
  noGlow();
  // trail
  S.p.trail.forEach((t,i)=>{ctx.globalAlpha=.25*(1-i/10);ctx.fillStyle='#37f0ff';ctx.fillRect(t.x-3,t.y+i*2,6,6)});ctx.globalAlpha=1;
  if(mode!=='over'||S.p.hp>0)drawShip(S.p);
  // fx
  for(const f of S.fx){const a=Math.max(0,f.life/f.max);
    if(f.type==='p'){ctx.globalAlpha=a;ctx.fillStyle=f.col;glow(f.col,6);ctx.fillRect(f.x,f.y,f.size,f.size)}
    else if(f.type==='r'){ctx.globalAlpha=a;ctx.strokeStyle=f.col;ctx.lineWidth=3;glow(f.col,10);ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.stroke()}
    else{ctx.globalAlpha=a;ctx.fillStyle=f.col;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y)}
    noGlow()}
  ctx.globalAlpha=1;
  if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash*.5})`;ctx.fillRect(-20,-20,W+40,H+40)}
  ctx.restore();
  // HUD
  ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';
  glow('#6a5cff',8);ctx.fillText(String(Math.floor(S.score)).padStart(7,'0'),14,32);noGlow();
  ctx.font='12px system-ui';ctx.fillStyle='#9aa';ctx.fillText('BEST '+Math.max(best,S.score|0)+'  ·  WAVE '+S.wave,14,50);
  if(S.mult>1){ctx.fillStyle='#ffe14a';ctx.font='bold 18px system-ui';ctx.fillText('x'+S.mult+' COMBO '+S.combo,14,74);
    ctx.fillStyle='#ffe14a44';ctx.fillRect(14,80,90,4);ctx.fillStyle='#ffe14a';ctx.fillRect(14,80,90*Math.max(0,S.comboT/2.4),4)}
  // hp & bombs
  ctx.textAlign='left';
  for(let i=0;i<S.p.hp;i++){ctx.fillStyle='#ff3d6a';glow('#ff3d6a',8);heart(14+i*22,H-26)}
  noGlow();
  for(let i=0;i<S.p.bombs;i++){ctx.fillStyle='#ff6b3d';ctx.beginPath();ctx.arc(W-24-i*24,H-24,8,0,TAU);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('B',W-24-i*24,H-20.5)}
  if(S.p.rapid>0){ctx.fillStyle='#ffe14a';ctx.fillRect(14,H-52,60*S.p.rapid/8,4);ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText('RAPID',80,H-47)}
  // boss bar
  if(S.boss){const b=S.boss,w=300;ctx.fillStyle='#fff2';ctx.fillRect(W/2-w/2,64,w,8);ctx.fillStyle='#ff3df2';glow('#ff3df2',10);ctx.fillRect(W/2-w/2,64,w*Math.max(0,b.hp/b.max),8);noGlow()}
  // messages
  for(const m of S.msgs){const k=m.life/m.max,a=Math.min(1,k*3,(1-k)*6+.0);ctx.globalAlpha=Math.max(0,Math.min(1,k<.2?k*5:1));
    ctx.textAlign='center';ctx.fillStyle=m.s?'#ff3d6a':'#fff';glow(m.s?'#ff3d6a':'#6a5cff',18);ctx.font='bold 34px system-ui';ctx.fillText(m.t,W/2,H*.32);
    if(m.s){ctx.font='bold 22px system-ui';ctx.fillText(m.s,W/2,H*.32+34)}noGlow();ctx.globalAlpha=1}
}
function heart(x,y){ctx.beginPath();ctx.moveTo(x+8,y+14);ctx.bezierCurveTo(x-6,y+4,x+2,y-6,x+8,y+2);ctx.bezierCurveTo(x+14,y-6,x+22,y+4,x+8,y+14);ctx.fill()}

/* ---------- flow ---------- */
let last=0,raf=0;
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(mode==='play')update(dt);
  if(S)draw();
  raf=requestAnimationFrame(loop);
}
function start(){audio();newGame();mode='play';['menu','over','pz'].forEach(i=>$(i).classList.add('hide'))}
function gameOver(){
  mode='over';const s=Math.floor(S.score),nb=s>best;
  if(nb){best=s;try{localStorage.setItem('nv_best',best)}catch(e){}}
  burst(S.p.x,S.p.y,'#37f0ff',50,360,1.2,3);sfx.big();shake(20);
  setTimeout(()=>{
    $('result').innerHTML=`<div class="stat">SCORE <b>${s}</b>${nb?' 🏆 신기록!':''}</div><div class="stat">웨이브 <b>${S.wave}</b> · 격추 <b>${S.kills}</b></div><div class="stat">최고 <b>${best}</b></div>`;
    $('over').classList.remove('hide');
  },900);
  // keep animating fx during delay
  const t0=performance.now();(function f(){if(mode!=='over')return;if(performance.now()-t0<900){S.fx.forEach(x=>{});requestAnimationFrame(f)}})();
}
function togglePause(){
  if(mode==='play'){mode='pause';$('pz').classList.remove('hide')}
  else if(mode==='pause'){mode='play';$('pz').classList.add('hide')}
}
$('go').onclick=start;$('again').onclick=start;$('resume').onclick=togglePause;$('pause').onclick=e=>{e.stopPropagation();togglePause()};
$('bestline').textContent=best?'BEST '+best:'';
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();if(mode==='play')useBomb();else if(mode==='menu'||mode==='over')start()}
  if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  if(e.key==='m'||e.key==='M')muted=!muted;
  if(e.key==='Enter'&&(mode==='menu'||mode==='over'))start();
});
addEventListener('keyup',e=>{keys[e.key]=false});
addEventListener('blur',()=>{keys={};if(mode==='play')togglePause()});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{audio();touchN++;if(touchN>=2&&mode==='play'){useBomb()}touch=pt(e)});
cv.addEventListener('pointermove',e=>{if(touchN>0&&e.isPrimary)touch=pt(e)});
const up=e=>{touchN=Math.max(0,touchN-1);if(touchN===0)touch=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
newGame();mode='menu';requestAnimationFrame(t=>{last=t;loop(t)});
window.__nv={get S(){return S},start,get mode(){return mode}};
</script>
