<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>MERGE POP · 과일 합치기</title>
<style>
  :root{--bg1:#ffe8f1;--bg2:#e6f0ff}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#4a3a5c;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px 8px}
  #hud{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:10px 4px;box-sizing:border-box}
  .pill{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 4px 0 rgba(120,90,160,.15);font-weight:800;line-height:1.1}
  .pill small{display:block;font-size:10px;opacity:.55;letter-spacing:1px}
  .pill b{font-size:20px}
  #next{display:flex;align-items:center;gap:6px}
  #nextc{width:36px;height:36px}
  canvas#c{background:rgba(255,255,255,.55);border:4px solid #fff;border-radius:22px;box-shadow:0 8px 0 rgba(120,90,160,.18);max-width:100%;touch-action:none}
  #evo{display:flex;gap:2px;margin-top:8px;font-size:18px;opacity:.9}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,240,250,.88);text-align:center;z-index:5}
  #ov h1{font-size:44px;margin:0;color:#ff5fa2;text-shadow:0 4px 0 #fff}
  #ov p{margin:8px 0 0;line-height:1.5}
  button{font:inherit;font-weight:800;font-size:20px;padding:14px 36px;border:0;border-radius:40px;background:#ff5fa2;color:#fff;box-shadow:0 6px 0 #d63f82;margin-top:18px}
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #d63f82}
  #back{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);font-size:12px;padding:0;background:none;box-shadow:none;color:#4a3a5c;opacity:.5;margin:0;font-weight:600}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="pill"><small>SCORE</small><b id="sc">0</b></div>
    <div class="pill" id="next"><small>NEXT</small><canvas id="nextc" width="72" height="72"></canvas></div>
    <div class="pill"><small>BEST</small><b id="bs">0</b></div>
  </div>
  <canvas id="c" width="400" height="560"></canvas>
  <div id="evo"></div>
</div>
<div id="ov">
  <h1 id="ttl">MERGE POP</h1>
  <p id="msg">같은 과일 두 개를 부딪혀 합치세요!<br>👆 드래그로 위치 조절, 손을 떼면 떨어져요<br>🍉까지 만들어 보세요</p>
  <button id="go">시작</button>
</div>
<button id="back" onclick="location.href='arcade.html'">‹ 게임 목록</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const nc=document.getElementById('nextc').getContext('2d');
const W=400,H=560,LINE=90;
const TYPES=[
 {r:16,c:'#ff6b81',e:'🍒'},{r:23,c:'#ff9ff3',e:'🍓'},{r:31,c:'#a29bfe',e:'🍇'},
 {r:39,c:'#ffa94d',e:'🍊'},{r:48,c:'#ff7675',e:'🍎'},{r:58,c:'#ffeaa7',e:'🍐'},
 {r:69,c:'#fab1a0',e:'🍑'},{r:81,c:'#fdcb6e',e:'🍍'},{r:94,c:'#55efc4',e:'🍈'},{r:108,c:'#00b894',e:'🍉'}];
document.getElementById('evo').textContent=TYPES.map(t=>t.e).join('›');
let balls,score,best=+(localStorage.getItem('mp_best')||0),cur,nxt,dropX,cool,over,running=false,parts,over_t,shake;
const $=id=>document.getElementById(id);
$('bs').textContent=best;

// sound
let ac;function beep(f,d=.08,type='sine',v=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const vib=n=>navigator.vibrate&&navigator.vibrate(n);

function rnd(){return Math.random()*4|0}
function reset(){balls=[];parts=[];score=0;cur=rnd();nxt=rnd();dropX=W/2;cool=0;over=false;over_t=0;shake=0;$('sc').textContent=0;drawNext()}
function drawFruit(g,x,y,i,r,a=1){
  const t=TYPES[i];g.save();g.globalAlpha=a;
  const gr=g.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  gr.addColorStop(0,'#fff');gr.addColorStop(.25,t.c);gr.addColorStop(1,t.c);
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.8)';g.stroke();
  g.font=Math.round(r*1.15)+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t.e,x,y+r*.05);
  g.restore();
}
function drawNext(){nc.clearRect(0,0,72,72);const r=TYPES[nxt].r;const s=30/r;nc.save();nc.translate(36,36);nc.scale(s>1?1:s,s>1?1:s);drawFruit(nc,0,0,nxt,r);nc.restore()}

function addBall(x,y,i){const b={x,y,vx:0,vy:0,i,r:TYPES[i].r,age:0,pop:1};balls.push(b);return b}
function burst(x,y,c){for(let k=0;k<12;k++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,c})}}

function step(){
  const G=.45,DAMP=.995;
  for(const b of balls){b.vy+=G;b.vx*=DAMP;b.vy*=DAMP;b.x+=b.vx;b.y+=b.vy;b.age++;if(b.pop>0)b.pop-=.08}
  for(let it=0;it<4;it++){
    for(const b of balls){
      if(b.x<b.r+4){b.x=b.r+4;b.vx*=-.2}
      if(b.x>W-b.r-4){b.x=W-b.r-4;b.vx*=-.2}
      if(b.y>H-b.r-4){b.y=H-b.r-4;b.vy*=-.15;b.vx*=.95}
    }
    for(let a=0;a<balls.length;a++)for(let c=a+1;c<balls.length;c++){
      const p=balls[a],q=balls[c];if(p.dead||q.dead)continue;
      const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),m=p.r+q.r;
      if(d<m&&d>0){
        if(p.i===q.i&&p.i<TYPES.length-1&&it===0){merge(p,q);continue}
        const nx=dx/d,ny=dy/d,o=(m-d)/2;
        const mp=p.r*p.r,mq=q.r*q.r,t=mp+mq;
        p.x-=nx*o*(mq/t)*2;p.y-=ny*o*(mq/t)*2;q.x+=nx*o*(mp/t)*2;q.y+=ny*o*(mp/t)*2;
        const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
        if(rv<0){const j=-rv*1.15;p.vx-=nx*j*(mq/t);p.vy-=ny*j*(mq/t);q.vx+=nx*j*(mp/t);q.vy+=ny*j*(mp/t)}
      }
    }
  }
  balls=balls.filter(b=>!b.dead);
  // game over: resting ball above line
  let danger=false;for(const b of balls){if(b.age>60&&b.y-b.r<LINE&&Math.abs(b.vy)<1.5)danger=true}
  over_t=danger?over_t+1:Math.max(0,over_t-2);
  if(over_t>110)end();
}
function merge(p,q){
  p.dead=q.dead=true;const i=p.i+1;
  const n=addBall((p.x+q.x)/2,(p.y+q.y)/2,i);n.vx=(p.vx+q.vx)/2;n.vy=(p.vy+q.vy)/2;n.pop=1;n.age=100;
  score+=(i+1)*(i+1);$('sc').textContent=score;
  burst(n.x,n.y,TYPES[i].c);beep(300+i*70,.12,'triangle');vib(8);
  if(i===TYPES.length-1){shake=14;burst(n.x,n.y,'#fff');beep(900,.4,'square')}
}
function end(){
  over=true;running=false;vib([60,40,100]);beep(120,.5,'sawtooth');
  const nb=score>best;if(nb){best=score;localStorage.setItem('mp_best',best);$('bs').textContent=best}
  $('ttl').textContent=nb?'NEW BEST!':'GAME OVER';
  $('msg').innerHTML='점수 <b>'+score+'</b><br>최고 '+best;
  $('go').textContent='다시 하기';$('ov').style.display='flex';
}
function drop(){
  if(!running||cool>0)return;
  addBall(Math.max(TYPES[cur].r+4,Math.min(W-TYPES[cur].r-4,dropX)),50,cur);
  cur=nxt;nxt=rnd();drawNext();cool=28;beep(520,.05);
}
function render(){
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
  ctx.clearRect(-20,-20,W+40,H+40);
  // danger line
  ctx.setLineDash([10,8]);ctx.strokeStyle=over_t>0?'rgba(255,60,90,'+(.4+.4*Math.sin(Date.now()/80))+')':'rgba(120,90,160,.3)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
  for(const b of balls){const s=1+Math.max(0,b.pop)*.25;drawFruit(ctx,b.x,b.y,b.i,b.r*s)}
  if(running&&cool<=0){
    const r=TYPES[cur].r,x=Math.max(r+4,Math.min(W-r-4,dropX));
    ctx.strokeStyle='rgba(120,90,160,.25)';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x,50+r);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    drawFruit(ctx,x,50,cur,r);
  }
  for(const p of parts){ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4*p.l+1,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
}
function loop(){
  if(running){step();if(cool>0)cool--}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.03}parts=parts.filter(p=>p.l>0);
  render();requestAnimationFrame(loop);
}
function setX(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;dropX=(t.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{setX(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{setX(e)});
cv.addEventListener('pointerup',e=>{setX(e);drop()});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')dropX-=14;if(e.key==='ArrowRight')dropX+=14;
  if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();drop()}
});
function fit(){const h=innerHeight-150,w=innerWidth-16;const s=Math.min(h/H,w/W,1.3);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
$('go').onclick=()=>{reset();running=true;$('ov').style.display='none';beep(600,.08)};
reset();loop();
</script>
</body>
</html>
