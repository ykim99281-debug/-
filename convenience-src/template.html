<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>편의점 사장 키우기</title>
<link rel="manifest" href="convenience.webmanifest">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="cvs-icon-192.png">
<link rel="apple-touch-icon" href="cvs-icon-192.png">
<style>
:root{--bg:#0b1020;--card:#18213a;--card2:#222d4a;--tx:#f1f5f9;--mut:#94a3b8;--pri:#22c55e;--acc:#facc15;--red:#ef4444;--blue:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:0 0 90px}
#view{position:sticky;top:0;z-index:5;height:min(58vh,480px);min-height:260px;background:#7ab8e8;border-radius:0 0 22px 22px;overflow:hidden;box-shadow:0 10px 30px #0008;touch-action:none}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px;display:flex;flex-direction:column}
.glass{background:rgba(10,16,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rank{display:inline-block;background:var(--acc);color:#222;font-weight:800;border-radius:99px;padding:3px 12px;font-size:13px;box-shadow:0 2px 8px #0006}
.money{font-size:24px;font-weight:900;color:var(--acc);text-shadow:0 2px 8px #000a;line-height:1.1;margin-top:6px}
.sub{font-size:12px;color:#e2e8f0;text-shadow:0 1px 4px #000a}
.mbox{padding:4px 10px 6px;display:inline-block;margin-top:2px}
#snd,#cam{pointer-events:auto;border:0;background:rgba(10,16,32,.55);border-radius:99px;width:36px;height:36px;font-size:17px;cursor:pointer;color:var(--tx);backdrop-filter:blur(8px)}
.btns{display:flex;gap:6px}
.bar{height:7px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin:5px 0 2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--blue));width:0;transition:width .3s}
#hint{margin-top:auto;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 4px #000}
#log{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:99px;padding:4px 12px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:20px;color:var(--acc);animation:fl 1s forwards;text-shadow:0 2px 4px #000;z-index:6}
@keyframes fl{to{transform:translateY(-80px) scale(1.2);opacity:0}}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1020;font-weight:800;z-index:7;transition:opacity .5s}
#nogl{display:none;padding:30px;text-align:center;font-size:14px;color:var(--mut)}
.main{padding:0 12px}
#tap{width:100%;margin:12px 0 4px;padding:16px;font-size:18px;font-weight:900;border:0;border-radius:16px;background:linear-gradient(180deg,#34d46f,#16a34a);color:#04260f;cursor:pointer;box-shadow:0 5px 0 #0f7a36,0 10px 18px #0006;transition:transform .05s,box-shadow .05s}
#tap:active{transform:translateY(4px);box-shadow:0 1px 0 #0f7a36}
.tabs{display:flex;gap:5px;margin:12px 0 10px}
.tabs button{flex:1;padding:9px 0;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-weight:700;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#082f49}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.item .ic{font-size:28px;width:38px;text-align:center}
.item .in{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.item button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;background:var(--pri);color:#052e16;cursor:pointer;min-width:84px}
.item button:disabled{background:var(--card2);color:#64748b}
.stats{background:var(--card);border-radius:14px;padding:12px;font-size:13px;line-height:1.9}
.btn2{width:100%;padding:12px;border:0;border-radius:12px;font-weight:800;margin-top:8px;cursor:pointer}
.prest{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff}
.reset{background:var(--card2);color:var(--mut)}
.ach{opacity:.45}.ach.done{opacity:1;border:1px solid var(--acc)}
#event{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;background:#fff;color:#111;border-radius:16px;padding:12px;display:none;z-index:20;box-shadow:0 6px 24px #000a}
#event b{display:block;margin-bottom:8px}
#event .row{display:flex;gap:8px}
#event button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:var(--pri);color:#052e16}
#event button.no{background:#e2e8f0;color:#334155}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;display:none;z-index:30;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl"></canvas>
    <div id="hud">
      <div class="top">
        <div>
          <span class="rank" id="rank"></span>
          <div class="glass mbox"><div class="money" id="money"></div><div class="sub" id="rate"></div></div>
        </div>
        <div class="btns"><button id="cam" aria-label="시간대">🌗</button><button id="snd" aria-label="소리">🔊</button></div>
      </div>
      <div style="margin-top:8px;max-width:78%"><div class="bar"><i id="prog"></i></div><div class="sub" id="progt"></div></div>
      <div id="hint" style="opacity:.0">드래그로 회전 · 두 손가락으로 확대 · 화면을 눌러도 손님 응대!</div>
    </div>
    <div id="log"></div>
    <div id="load">🏪 매장 여는 중…</div>
  </div>
  <div id="nogl">이 기기에서는 3D를 표시할 수 없어요. 게임은 아래에서 계속 즐길 수 있어요.</div>
  <div class="main">
    <button id="tap">🧾 손님 응대하기</button>
    <div class="tabs">
      <button data-t="staff" class="on">👥 직원</button>
      <button data-t="goods">📦 상품</button>
      <button data-t="store">🏬 매장</button>
      <button data-t="ach">🏆 업적</button>
      <button data-t="info">📊 정보</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="event"></div>
<div id="toast"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
