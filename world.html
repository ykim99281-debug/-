<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>공명 월드 · 모든 게임이 모인 3D 세상</title>
<link rel="icon" href="rpg-icon-192.png">
<meta name="description" content="캐릭터를 움직여 포털로 들어가면 내가 만든 모든 게임을 바로 플레이! 로블록스 같은 3D 월드.">
<meta property="og:title" content="공명 월드">
<meta property="og:description" content="캐릭터를 꾸미고, 돌아다니고, 포털로 들어가 모든 게임을 즐겨요.">
<meta property="og:image" content="https://ykim99281-debug.github.io/-/promo/og-home.jpg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;color:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:rgba(15,15,30,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
#tl{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#tr{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.btn{border:0;font:inherit;font-weight:800;color:#fff;background:rgba(15,15,30,.66);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 13px;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(180deg,#22c55e,#15803d);border-color:#86efac}
#em{display:flex;flex-direction:column;gap:6px}
#em .btn{padding:6px 10px;font-size:20px;border-radius:12px}
#prompt{left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));display:none}
#prompt .btn{font-size:17px;padding:14px 22px;background:linear-gradient(180deg,#f59e0b,#b45309);border-color:#fde68a;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pu 1.2s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
#joy{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55)}
#jump{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);font-size:15px;font-weight:900;display:block;touch-action:none;color:#fff}
#joy,#jump{display:block}
#hint{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12.5px;opacity:.9;white-space:nowrap}
body.touch #hint{display:none}
#toast{position:fixed;z-index:30;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(15,15,30,.86);border:1px solid rgba(255,255,255,.25);padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,5,15,.72);display:none;align-items:center;justify-content:center;padding:16px;touch-action:auto}
.modal.on{display:flex}
.panel{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#26254a,#14142b);border:2px solid #a78bfa;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:pan-y}
.panel h2{margin:0 0 12px;font-size:21px;display:flex;justify-content:space-between;align-items:center}
.panel h2 button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:16px;border:2px solid var(--c);background:rgba(255,255,255,.07);color:#fff;font:inherit;cursor:pointer}
.gcard:active{transform:scale(.98)}
.gcard .e{font-size:32px;width:50px;height:50px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.gcard b{display:block;font-size:16px}.gcard span{display:block;font-size:12.5px;color:#cfcdea;margin-top:2px;word-break:keep-all}
.gcard em{margin-left:auto;font-style:normal;font-weight:900;color:var(--c);font-size:13px;flex:none}
.row{margin:12px 0}.row label{display:block;font-size:13px;color:#cfcdea;margin-bottom:6px;font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw i{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff;box-shadow:0 0 0 2px #7c3aed}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid #4c4a85;background:#0e0e22;color:#fff;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
#gv{position:fixed;inset:0;z-index:40;background:#000;display:none}
#gv.on{display:block}
#gf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#gx{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top,0px));padding:7px 14px;font-size:13px;opacity:.88}
#boot{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 30%,#4c1d95,#0b0b1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
#boot h1{font-size:34px;margin:0 0 6px;background:linear-gradient(90deg,#fff,#c4b5fd 55%,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot p{color:#cfcdea;margin:6px 0}
#boot .btn{margin-top:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="tl">
  <div class="chip" id="me">🙂 <span id="nm">손님</span> · 🪙 <span id="cn">0</span></div>
  <div id="em">
    <button class="btn" data-e="👋">👋</button><button class="btn" data-e="😂">😂</button><button class="btn" data-e="❤️">❤️</button><button class="btn" data-e="👍">👍</button>
  </div>
</div>
<div class="hud" id="tr">
  <button class="btn pri" id="bGames">🎮 게임</button>
  <button class="btn" id="bDress">👕 꾸미기</button>
  <button class="btn" id="bSnd">🔊</button>
</div>
<div class="hud" id="prompt"><button class="btn" id="bGo">▶ 입장</button></div>
<div class="hud" id="joy"><i id="knob"></i></div>
<button class="hud" id="jump">점프</button>
<div class="hud chip" id="hint">WASD/방향키 이동 · 스페이스 점프 · 마우스 드래그로 시점 · E 입장</div>
<div id="toast"></div>

<div class="modal" id="mGames"><div class="panel">
  <h2>🎮 모든 게임 <button data-close>✕</button></h2>
  <div id="glist"></div>
</div></div>

<div class="modal" id="mDress"><div class="panel">
  <h2>👕 캐릭터 꾸미기 <button data-close>✕</button></h2>
  <div class="row"><label>닉네임</label><input type="text" id="iName" maxlength="10" placeholder="닉네임 (최대 10자)"></div>
  <div class="row"><label>옷 색</label><div class="sw" id="swShirt"></div></div>
  <div class="row"><label>바지 색</label><div class="sw" id="swPants"></div></div>
  <div class="row"><label>피부 색</label><div class="sw" id="swSkin"></div></div>
  <div class="row"><label>모자</label><div class="sw" id="swHat"></div></div>
  <button class="btn pri" style="width:100%;margin-top:8px;padding:14px" data-close>완료</button>
</div></div>

<div id="gv"><button class="btn" id="gx">🏠 월드로 돌아가기</button><iframe id="gf" allow="fullscreen; autoplay; clipboard-write" title="게임"></iframe></div>

<div id="boot"><h1>공명 월드</h1><p id="bootMsg">월드를 불러오는 중이에요...</p><div id="bootBtns"></div></div>

<script>
/* ===== 게임 목록 (지금까지 만든 모든 게임) ===== */
var GAMES=[
 {id:"sword",t:"전설의 검 강화하기",e:"⚔️",tag:"강화 · 수집",u:"index.html",c:"#fbc531",d:"검을 강화해서 전설의 검을 만들어요"},
 {id:"rpg",t:"별빛 공명 연대기",e:"⭐",tag:"액션 RPG",u:"rpg.html",c:"#7c3aed",d:"꺼진 별을 다시 켜는 공명의 여정"},
 {id:"hagil",t:"하길 공명 연대기",e:"📖",tag:"RPG · 성경 퀴즈",u:"hagil.html",c:"#f59e0b",d:"성경 인물 30명과 함께 걷는 믿음의 모험"},
 {id:"gunchuk",t:"건축 공명 연대기",e:"🏗️",tag:"RPG · 건축 퀴즈",u:"gunchuk.html",c:"#0ea5e9",d:"건축가들과 무너지는 세계를 다시 지어요"},
 {id:"kids",t:"어린이 공명 연대기",e:"🧸",tag:"쉬운 RPG · 어린이용",u:"kids.html",c:"#ec4899",d:"귀여운 친구들과 심술 구름을 달래 줘요"},
 {id:"rich",t:"꼬마 투자왕",e:"💰",tag:"부자 RPG",u:"rich-rpg.html",c:"#eab308",d:"투자해서 부자가 되는 RPG"},
 {id:"slime",t:"슬라임 대탐험",e:"🟢",tag:"달려라 러너",u:"slime/index.html",c:"#22c55e",d:"슬라임이 되어 달리는 러너 게임"},
 {id:"hero",t:"용사 키우기",e:"🛡️",tag:"방치형 RPG",u:"hero-idle.html",c:"#ef4444",d:"용사를 키우고 환생하는 방치형 게임"},
 {id:"brain",t:"뇌절 RPG 3D",e:"🧠",tag:"3D 액션 RPG",u:"brain-cut-rpg-3d.html",c:"#a855f7",d:"펫과 장비를 모으는 3D 액션"},
 {id:"fps",t:"TACTICAL STRIKE",e:"🔫",tag:"3D FPS",u:"fps-game.html",c:"#64748b",d:"수류탄·맵·랭크가 있는 3D 슈팅"},
 {id:"hook",t:"HOOK SWING",e:"🕸️",tag:"아케이드",u:"hook-swing.html",c:"#06b6d4",d:"로프를 걸고 휘두르며 날아가요"},
 {id:"survivor",t:"NEON SURVIVOR",e:"👾",tag:"서바이버 액션",u:"neon-survivor.html",c:"#d946ef",d:"끝없는 네온 군단 속에서 살아남기"},
 {id:"void",t:"NEON VOID",e:"🚀",tag:"슈팅",u:"neon-void.html",c:"#37f0ff",d:"보스 4종, 기체 3종, 상점이 있는 우주 슈팅"},
 {id:"dodge",t:"별똥별 피하기",e:"☄️",tag:"아케이드",u:"star-dodge.html",c:"#ffd23f",d:"바위를 피하고 별을 모아요"},
 {id:"convenience",t:"편의점 사장 키우기",e:"🏪",tag:"3D 타이쿤",u:"convenience/index.html",c:"#10b981",d:"편의점을 키우는 로블록스 스타일 타이쿤"},
 {id:"latte",t:"라떼 하우스 타이쿤",e:"☕",tag:"3D 카페 타이쿤",u:"tycoon3d.html",c:"#b45309",d:"3D 카페를 꾸미고 키워요"},
 {id:"company",t:"스타트업 타이쿤",e:"🏢",tag:"회사 키우기",u:"company-tycoon.html",c:"#3b82f6",d:"작은 회사를 크게 키워요"},
 {id:"bus",t:"버스 운전교실 타이쿤",e:"🚌",tag:"운전 · 타이쿤",u:"bus/index.html",c:"#f97316",d:"버스를 몰고 회사를 키워요"},
 {id:"block",t:"블록크래프트",e:"⛏️",tag:"서바이벌 & 크리에이티브",u:"blockcraft.html",c:"#84cc16",d:"블록을 캐고 쌓는 샌드박스"},
 {id:"obby",t:"점프 타워",e:"🏁",tag:"월드 안 장애물 달리기",u:null,c:"#22c55e",d:"끝까지 올라가면 코인 50개! (체크포인트 있음)"}
];
var PAL_SHIRT=["#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899","#f1f5f9","#1f2937"];
var PAL_PANTS=["#1e3a8a","#14532d","#1f2937","#7f1d1d","#4c1d95","#78350f","#e2e8f0","#0f766e"];
var PAL_SKIN=["#fcd9b6","#f1c27d","#e0ac69","#c68642","#8d5524","#fde047","#86efac","#93c5fd"];
var HATS=[["없음",""],["🎩","top"],["👑","crown"],["🧢","cap"]];

/* ===== 저장 ===== */
var SAVE_KEY="gm_world_v1",S={name:"",coins:0,shirt:0,pants:0,skin:0,hat:0,obbyBest:0};
try{var raw=localStorage.getItem(SAVE_KEY);if(raw){var o=JSON.parse(raw);for(var k in S)if(o[k]!==undefined)S[k]=o[k]}}catch(e){}
if(!S.name)S.name="손님"+(100+Math.floor(Math.random()*900));
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},2200)}
function hud(){$("nm").textContent=S.name;$("cn").textContent=S.coins}
hud();
if("ontouchstart" in window||(window.matchMedia&&matchMedia("(pointer:coarse)").matches))document.body.classList.add("touch");

/* ===== 게임 열기/닫기 (플레이 중에는 월드 렌더링 정지) ===== */
var inGame=false;
var BASE=/^https?:$/.test(location.protocol)?"":"https://ykim99281-debug.github.io/-/";
function openGame(g){
  if(g.id==="obby"){closeModals();startObby();return}
  closeModals();inGame=true;
  $("gf").src=BASE+g.u;$("gv").classList.add("on");
}
function closeGame(){
  inGame=false;$("gv").classList.remove("on");$("gf").src="about:blank";
  if(window.__tick)window.__tick.last=performance.now();
}
$("gx").onclick=closeGame;
function buildList(){
  var h="";
  GAMES.forEach(function(g,i){
    h+='<button class="gcard" data-i="'+i+'" style="--c:'+g.c+'"><span class="e">'+g.e+'</span><div><b>'+g.t+'</b><span>'+g.tag+' · '+g.d+'</span></div><em>▶ 플레이</em></button>';
  });
  $("glist").innerHTML=h;
  $("glist").onclick=function(e){var b=e.target.closest(".gcard");if(b)openGame(GAMES[+b.dataset.i])};
}
buildList();
function closeModals(){var m=document.querySelectorAll(".modal.on");for(var i=0;i<m.length;i++)m[i].classList.remove("on")}
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){
  if($("mDress").classList.contains("on")){var v=$("iName").value.trim();if(v){S.name=v.slice(0,10);save();hud();if(window.__world)window.__world.refreshName()}}
  closeModals()}});
$("bGames").onclick=function(){$("mGames").classList.add("on")};
$("bDress").onclick=function(){$("iName").value=S.name;$("mDress").classList.add("on")};
function swatches(id,pal,key){
  var el=$(id);
  function draw(){el.innerHTML=pal.map(function(c,i){return '<i data-i="'+i+'" class="'+(S[key]===i?"on":"")+'" style="background:'+c+'"></i>'}).join("")}
  draw();
  el.onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i===null||i===undefined)return;S[key]=+i;save();draw();if(window.__world)window.__world.refreshLook()};
}
swatches("swShirt",PAL_SHIRT,"shirt");swatches("swPants",PAL_PANTS,"pants");swatches("swSkin",PAL_SKIN,"skin");
(function(){
  var el=$("swHat");
  function draw(){el.innerHTML=HATS.map(function(h,i){return '<i data-i="'+i+'" class="'+(S.hat===i?"on":"")+'" style="background:#3b3a66;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal">'+h[0]+'</i>'}).join("")}
  draw();
  el.onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i===null||i===undefined)return;S.hat=+i;save();draw();if(window.__world)window.__world.refreshLook()};
})();

/* ===== 효과음 ===== */
var muted=false,AC=null;
function beep(f,d,type){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}
}
$("bSnd").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊"};

/* ===== 3D 불러오기 실패해도 게임은 고를 수 있게 ===== */
function fallback(msg){
  $("bootMsg").textContent=msg;
  $("bootBtns").innerHTML='<button class="btn pri" id="bFb">🎮 게임 목록 열기</button>';
  $("bFb").onclick=function(){$("boot").classList.add("off");$("mGames").classList.add("on")};
}
window.addEventListener("load",function(){
  if(!window.THREE){fallback("3D 화면을 불러오지 못했어요. 그래도 게임은 바로 할 수 있어요!");return}
  try{initWorld()}catch(err){console.error(err);fallback("이 기기에서는 3D 월드를 열 수 없어요. 게임 목록에서 바로 플레이하세요!")}
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function startObby(){if(window.__world)window.__world.startObby()}
function initWorld(){
var T=THREE;
var canvas=$("c");
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
var scene=new T.Scene();
scene.background=new T.Color(0x8fd3ff);
scene.fog=new T.Fog(0x8fd3ff,60,190);
var camera=new T.PerspectiveCamera(62,1,.1,400);

/* 조명 */
scene.add(new T.HemisphereLight(0xffffff,0x6b8f5a,.85));
var sun=new T.DirectionalLight(0xfff3d6,.9);
sun.position.set(30,50,20);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-26;sc.right=26;sc.top=26;sc.bottom=-26;sc.near=1;sc.far=140;
scene.add(sun);scene.add(sun.target);

/* 공용 도우미 */
function mat(c){return new T.MeshLambertMaterial({color:c})}
function box(w,h,d,c){var m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));return m}
function label(text,opt){
  opt=opt||{};
  var w=opt.w||256,h=opt.h||64,cv=document.createElement("canvas");cv.width=w;cv.height=h;
  var x=cv.getContext("2d");
  if(opt.bg){x.fillStyle=opt.bg;rr(x,2,2,w-4,h-4,opt.r||18);x.fill()}

var G=32,SPEED=9.5,JV=13,tt=0;
var tick={last:performance.now()};window.__tick=tick;
function groundAt(x,z,y,ny){
  for(var i=0;i<plats.length;i++){var p=plats[i];
    if(x>p.x0-.3&&x<p.x1+.3&&z>p.z0-.3&&z<p.z1+.3&&y>=p.top-.25&&ny<=p.top)return p.top}
  return null;
}
function angDiff(a,b){var d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d}
function loop(now){
  requestAnimationFrame(loop);
  if(inGame){tick.last=now;return}
  var dt=Math.min(.05,(now-tick.last)/1000);tick.last=now;tt+=dt;

  // 이동
  var ix=(keys["d"]||keys["arrowright"]?1:0)-(keys["a"]||keys["arrowleft"]?1:0)+joy.x;
  var iy=(keys["w"]||keys["arrowup"]?1:0)-(keys["s"]||keys["arrowdown"]?1:0)+joy.y;
  var il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;il=1}
  var sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  var mx=(-sy)*iy+cy*ix,mz=(-cy)*iy+(-sy)*ix;
  P.x+=mx*SPEED*dt;P.z+=mz*SPEED*dt;P.spd=il*SPEED;
  if(il>.08){var want=Math.atan2(mx,mz);P.face+=angDiff(P.face,want)*Math.min(1,dt*14)}
  // 점프·중력
  if(jumpReq&&!P.air){P.vy=JV;P.air=true;beep(520,.1,"square")}
  jumpReq=false;
  var ny=P.y+P.vy*dt;P.vy-=G*dt;
  var gy=groundAt(P.x,P.z,P.y,ny);
  if(gy!==null&&P.vy<=0){P.y=gy;P.vy=0;P.air=false}
  else{P.y=ny;P.air=true}
  if(P.y<-20)respawn();
  // 점프 타워 체크포인트/도착
  if(obbyOn){
    for(var i=0;i<obbyPts.length;i++){var c=obbyPts[i];if(!P.air&&Math.abs(P.x-c.x)<2.2&&Math.abs(P.z-c.z)<2.2&&(!checkpoint||checkpoint.y<c.y)){checkpoint=c;toast("✅ 체크포인트 저장!");beep(740,.15,"triangle")}}
    if(!P.air&&obbyFinish&&Math.abs(P.x-obbyFinish.x)<4&&Math.abs(P.z-obbyFinish.z)<4&&P.y>=obbyFinish.y-.1){
      S.coins+=50;S.obbyBest++;save();hud();toast("🏆 도착! 코인 +50 (완주 "+S.obbyBest+"회)");beep(988,.4,"triangle");toLobby();
    }
  }
  back.style.display=obbyOn?"block":"none";

  player.position.set(P.x,P.y,P.z);player.rotation.y=P.face;animate(player,P.spd,P.air,tt);

  // 코인 먹기
  for(var k=0;k<coins.length;k++){var co=coins[k];
    if(co.on){co.m.rotation.z+=dt*3;co.o.position.y+=Math.sin(tt*3+k)*.003;
      var dx=co.o.position.x-P.x,dz=co.o.position.z-P.z,dy=co.o.position.y-(P.y+1.2);
      if(dx*dx+dz*dz+dy*dy<2.2){co.on=false;co.o.visible=false;co.t=co.obby?45:25;S.coins++;hud();beep(1040,.08,"triangle");save()}
    }else{co.t-=dt;if(co.t<=0){co.on=true;co.o.visible=true}}
  }

  // 봇
  for(var b=0;b<bots.length;b++){var bo=bots[b],av=bo.av,pp=av.position;
    var ddx=bo.tx-pp.x,ddz=bo.tz-pp.z,dd=Math.hypot(ddx,ddz);
    if(bo.wait>0){bo.wait-=dt;bo.spd=0}
    else if(dd<.6){bo.wait=1+Math.random()*4;var a=Math.random()*6.28,r=6+Math.random()*50;bo.tx=Math.cos(a)*r;bo.tz=Math.sin(a)*r;bo.spd=0}
    else{pp.x+=ddx/dd*5*dt;pp.z+=ddz/dd*5*dt;bo.face+=angDiff(bo.face,Math.atan2(ddx,ddz))*Math.min(1,dt*8);bo.spd=5}
    av.rotation.y=bo.face;animate(av,bo.spd,false,tt+b);
    bo.say-=dt;if(bo.say<=0){bo.say=8+Math.random()*14;say(av,["👋","😂","❤️","👍"][Math.floor(Math.random()*4)])}
  }

  // 포털
  near=null;var nd=3.6;
  for(var q=0;q<portals.length;q++){var po=portals[q];
    po.inner.material.opacity=.35+Math.sin(tt*3+po.ph)*.12;po.pad.material.opacity=.55+Math.sin(tt*4+po.ph)*.2;
    var d2=Math.hypot(P.x-po.x,P.z-po.z);if(d2<nd&&P.y<1&&!obbyOn){nd=d2;near=po}
  }
  var pr=$("prompt");
  if(near){pr.style.display="block";$("bGo").textContent="▶ "+near.g.t+" 입장 (E)"}else pr.style.display="none";
  gem.rotation.y+=dt;gem.position.y=3.6+Math.sin(tt*1.6)*.25;

  // 카메라
  var tx=P.x,ty=P.y+2.1,tz=P.z,cp=Math.cos(cam.pitch);
  var wantx=tx+Math.sin(cam.yaw)*cp*cam.dist,wanty=ty+Math.sin(cam.pitch)*cam.dist,wantz=tz+Math.cos(cam.yaw)*cp*cam.dist;
  camera.position.x+=(wantx-camera.position.x)*Math.min(1,dt*12);camera.position.y+=(wanty-camera.position.y)*Math.min(1,dt*12);camera.position.z+=(wantz-camera.position.z)*Math.min(1,dt*12);
  camera.lookAt(tx,ty,tz);
  sun.position.set(P.x+30,P.y+50,P.z+20);sun.target.position.set(P.x,P.y,P.z);
  renderer.render(scene,camera);
}
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

window.__world={
  startObby:startObby,
  refreshLook:function(){restyle(player,S)},
  refreshName:function(){renameAv(player,S.name)},
  _dbg:{P:P,portals:portals,cam:cam}
};
camera.position.set(0,6,18);
requestAnimationFrame(loop);
$("boot").classList.add("off");
setTimeout(function(){toast("포털로 걸어가서 게임에 입장해요! 🎮")},600);
}
</script>
</body>
</html>
